// ---------- 像素完美缩放：只用整数倍 ----------
let scale = 1;
function fit(){
  const raw = Math.min((innerWidth-16)/VW, (innerHeight-40)/VH);
  // 屏幕够大 → 只用整数倍（像素完美）；屏幕装不下 → 允许缩小，优先保证能看全
  scale = raw >= 1 ? Math.floor(raw) : raw;
  cv.width = VW; cv.height = VH;                     // 画布内部尺寸固定
  cv.style.width  = (VW*scale)+'px';                 // CSS 尺寸缩放
  cv.style.height = (VH*scale)+'px';
  ctx.imageSmoothingEnabled = false;                 // 关键：关掉插值
}
addEventListener('resize', fit); fit();

// ---------- 伪随机（固定种子 → 每次地图一致）----------
let seed = 20260817;
function rnd(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed / 4294967296; }

// ---------- 世界 ----------
const WORLD = 2000;
const P = {                                          // 饥荒调色板
  ground:'#8f7f5c', ground2:'#7d6e4f', ground3:'#a08e68',
  ink:'#1a1614', trunk:'#4a3628', trunk2:'#33251b',
  leaf:'#3d4a2c', leaf2:'#2b351f', leaf3:'#4e5c39',
  grass:'#5b6b3a', rock:'#6e6a63', rock2:'#514e49'
};

// 预渲染树 / 石头 / 草，避免每帧重画矢量
// canvas 的路径填充永远带抗锯齿 —— 烘焙后强制"去毛边"，才是真像素画
const PAL_RGB = ['#1a1614','#4a3628','#33251b','#3d4a2c','#2b351f','#4e5c39',
                 '#5b6b3a','#6e6a63','#514e49','#8f7f5c','#7d6e4f','#a08e68'].map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
function crispify(c){
  const x=c.getContext('2d'), d=x.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){
    if(p[i+3]<128){ p[i+3]=0; continue; }
    p[i+3]=255;
    let bi=0,bd=1e9;
    for(let k=0;k<PAL_RGB.length;k++){
      const q=PAL_RGB[k], dd=(p[i]-q[0])**2+(p[i+1]-q[1])**2+(p[i+2]-q[2])**2;
      if(dd<bd){bd=dd;bi=k;}
    }
    p[i]=PAL_RGB[bi][0]; p[i+1]=PAL_RGB[bi][1]; p[i+2]=PAL_RGB[bi][2];
  }
  x.putImageData(d,0,0); return c;
}
function bake(w,h,fn){ const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; fn(x); return crispify(c); }

const treeImg = bake(56,86,x=>{
  x.fillStyle=P.ink;                                  // 粗黑描边（饥荒特征）
  x.fillRect(23,52,12,32);
  x.fillStyle=P.trunk;  x.fillRect(24,52,10,31);
  x.fillStyle=P.trunk2; x.fillRect(29,52,5,31);
  const tier=(cy,hw,hh)=>{
    x.fillStyle=P.ink;
    x.beginPath();x.moveTo(28,cy-hh-3);x.lineTo(28+hw+3,cy+hh+1);x.lineTo(28-hw-3,cy+hh+1);x.fill();
    x.fillStyle=P.leaf;
    x.beginPath();x.moveTo(28,cy-hh);x.lineTo(28+hw,cy+hh-1);x.lineTo(28-hw,cy+hh-1);x.fill();
    x.fillStyle=P.leaf2;
    x.beginPath();x.moveTo(28,cy-hh);x.lineTo(28+hw,cy+hh-1);x.lineTo(28,cy+hh-1);x.fill();
  };
  tier(58,24,14); tier(40,20,13); tier(24,15,12); tier(11,10,10);
});

const rockImg = bake(30,22,x=>{
  x.fillStyle=P.ink;  x.beginPath();x.ellipse(15,14,14,8,0,0,7);x.fill();
  x.fillStyle=P.rock; x.beginPath();x.ellipse(15,13,12,6.5,0,0,7);x.fill();
  x.fillStyle=P.rock2;x.beginPath();x.ellipse(17,15,9,4,0,0,7);x.fill();
});

const grassImg = bake(16,14,x=>{
  x.fillStyle=P.ink;
  [[3,13,1,-8],[7,13,0,-11],[11,13,2,-7]].forEach(([px,py,dx,dy])=>{
    x.beginPath();x.moveTo(px,py);x.lineTo(px+dx,py+dy);x.lineTo(px+2,py);x.fill(); });
  x.fillStyle=P.grass;
  [[3,12,1,-6],[7,12,0,-9],[11,12,2,-5]].forEach(([px,py,dx,dy])=>{
    x.beginPath();x.moveTo(px,py);x.lineTo(px+dx,py+dy);x.lineTo(px+1,py);x.fill(); });
});

// 散布物件（带 y 排序做深度）
const props = [];
for(let i=0;i<170;i++){
  const r = rnd();
  props.push({
    x: rnd()*WORLD, y: rnd()*WORLD,
    img: r<0.42 ? treeImg : (r<0.62 ? rockImg : grassImg),
    solid: r<0.42
  });
}
props.sort((a,b)=>a.y-b.y);

// 地面噪点（一次性烘焙成一张平铺纹理）
const groundTile = bake(64,64,x=>{
  x.fillStyle=P.ground; x.fillRect(0,0,64,64);
  for(let i=0;i<220;i++){
    x.fillStyle = rnd()<0.5 ? P.ground2 : P.ground3;
    x.fillRect((rnd()*64)|0,(rnd()*64)|0, rnd()<0.75?1:2, 1);
  }
});
const groundPat = ctx.createPattern(groundTile,'repeat');

// ---------- 玩家 ----------
const pl = { x:WORLD/2, y:WORLD/2, vx:0, vy:0, face:1, anim:0, frame:0,
             hunger:100, sanity:100, hp:100 };
const cam = { x:0, y:0 };

// ---------- 输入 ----------
const keys = {};
addEventListener('keydown',e=>{keys[e.code]=1; if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',  e=>{keys[e.code]=0;});
let touch = null;
const tp = e=>{const t=e.touches[0]; return t?{x:t.clientX,y:t.clientY}:null;};
cv.addEventListener('touchstart',e=>{e.preventDefault(); touch={o:tp(e),c:tp(e)};},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault(); if(touch)touch.c=tp(e);},{passive:false});
cv.addEventListener('touchend',  e=>{e.preventDefault(); touch=null;},{passive:false});

function input(){
  let dx=0, dy=0;
  if(keys.KeyA||keys.ArrowLeft) dx--;
  if(keys.KeyD||keys.ArrowRight)dx++;
  if(keys.KeyW||keys.ArrowUp)   dy--;
  if(keys.KeyS||keys.ArrowDown) dy++;
  if(touch){
    const ddx=(touch.c.x-touch.o.x)/40, ddy=(touch.c.y-touch.o.y)/40;
    dx+=Math.max(-1,Math.min(1,ddx)); dy+=Math.max(-1,Math.min(1,ddy));
  }
  const l=Math.hypot(dx,dy);
  return l>1 ? {x:dx/l, y:dy/l, l:1} : {x:dx, y:dy, l:l};
}

// ---------- 昼夜 ----------
let clock = 0.28;                                     // 0..1 一整天
const DAY_LEN = 90;                                   // 秒

// ---------- 固定步长主循环 ----------
const DT = 1/60; let acc = 0, last = performance.now();

function update(){
  const i = input();
  const run = keys.Space ? 1.7 : 1;
  const spd = 78 * run;
  pl.vx = i.x*spd; pl.vy = i.y*spd;

  const nx = pl.x + pl.vx*DT, ny = pl.y + pl.vy*DT;
  // 树干碰撞（简单圆形）
  let ok = true;
  for(const p of props){
    if(!p.solid) continue;
    if(Math.abs(p.x-nx)<14 && Math.abs(p.y-ny)<9){ ok=false; break; }
  }
  if(ok){ pl.x=nx; pl.y=ny; }
  pl.x=Math.max(20,Math.min(WORLD-20,pl.x)); pl.y=Math.max(20,Math.min(WORLD-20,pl.y));

  if(i.l>0.05){ pl.anim += DT*(6+run*2); if(i.x!==0) pl.face = i.x>0?1:-1; }
  else pl.anim += DT*0.6;
  pl.frame = (pl.anim|0) % FRAMES;

  clock = (clock + DT/DAY_LEN) % 1;
  const night = clock>0.72 || clock<0.06;
  pl.hunger = Math.max(0, pl.hunger - DT*0.9);
  pl.sanity = Math.max(0, Math.min(100, pl.sanity + (night ? -DT*3.2 : DT*1.4)));
  if(pl.hunger<=0) pl.hp = Math.max(0, pl.hp - DT*4);

  // 摄像机平滑跟随
  cam.x += ((pl.x - VW/2) - cam.x)*0.12;
  cam.y += ((pl.y - VH/2) - cam.y)*0.12;
}

function nightTint(){
  const t = clock;
  if(t<0.06)  return ['#0d1430', 0.68];               // 深夜
  if(t<0.14)  return ['#2a2440', 0.34];               // 黎明
  if(t<0.60)  return ['#000000', 0.00];               // 白天
  if(t<0.72)  return ['#8a4a1e', 0.24];               // 黄昏
  if(t<0.80)  return ['#241f42', 0.46];               // 入夜
  return ['#0d1430', 0.66];
}

function render(){
  const cx = Math.round(cam.x), cy = Math.round(cam.y);   // 取整 → 无抖动

  ctx.save();
  ctx.translate(-cx, -cy);
  ctx.fillStyle = groundPat;
  ctx.fillRect(cx, cy, VW, VH);
  ctx.restore();

  // 场景物件 + 玩家，按 y 排序绘制
  const list = props.filter(p =>
    p.x>cx-70 && p.x<cx+VW+70 && p.y>cy-100 && p.y<cy+VH+60);
  list.push({x:pl.x, y:pl.y, hero:true});
  list.sort((a,b)=>a.y-b.y);

  for(const p of list){
    if(p.hero){
      const dx = Math.round(p.x-cx-SW/2), dy = Math.round(p.y-cy-SH+8);
      // 影子
      ctx.globalAlpha=.26; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(dx+SW/2, dy+SH-3, 13, 4.5, 0,0,7); ctx.fill();
      ctx.globalAlpha=1;
      ctx.save();
      if(p.face===-1 || pl.face===-1){ ctx.translate(dx+SW,dy); ctx.scale(-1,1);
        ctx.drawImage(hero, pl.frame*SW,0,SW,SH, 0,0,SW,SH); }
      else ctx.drawImage(hero, pl.frame*SW,0,SW,SH, dx,dy,SW,SH);
      ctx.restore();
    } else {
      const w=p.img.width, h=p.img.height;
      const dx=Math.round(p.x-cx-w/2), dy=Math.round(p.y-cy-h+6);
      if(p.solid){ ctx.globalAlpha=.22; ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(dx+w/2, dy+h-3, 16,5,0,0,7); ctx.fill(); ctx.globalAlpha=1; }
      ctx.drawImage(p.img, dx, dy);
    }
  }

  // 昼夜色罩
  const [col,a] = nightTint();
  if(a>0){ ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=a;
    ctx.fillStyle=col; ctx.fillRect(0,0,VW,VH);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; }

  // 低理智暗角（饥荒的核心反馈）
  const ins = 1 - pl.sanity/100;
  if(ins>0.15){
    const g=ctx.createRadialGradient(VW/2,VH/2,VH*0.28, VW/2,VH/2,VH*0.78);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(12,4,20,${ins*0.8})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  }
  hud();
}

// ---------- HUD：饥荒式三维度 ----------
function meter(x,y,val,col,label){
  ctx.fillStyle='#1a1614'; ctx.fillRect(x-1,y-1,42,8);
  ctx.fillStyle='#3a332c'; ctx.fillRect(x,y,40,6);
  ctx.fillStyle=col;       ctx.fillRect(x,y,Math.round(40*val/100),6);
  ctx.fillStyle='#d9cdb4'; ctx.font='8px monospace'; ctx.textAlign='right';
  ctx.fillText(label, x-5, y+6);
}
function hud(){
  meter(VW-52, 8,  pl.hp,     '#b8443f', '生命');
  meter(VW-52, 20, pl.hunger, '#c98b32', '饥饿');
  meter(VW-52, 32, pl.sanity, '#7a6bb5', '理智');
  const d = Math.floor(clock*24), m = Math.floor((clock*24%1)*60);
  ctx.fillStyle='#d9cdb4'; ctx.font='8px monospace'; ctx.textAlign='left';
  ctx.fillText(`${String(d).padStart(2,'0')}:${String(m).padStart(2,'0')}`, 8, 14);
  ctx.fillText(clock>0.72||clock<0.06 ? '夜晚 · 理智下降' : '白天', 8, 26);
}

function loop(now){
  acc += Math.min(0.25, (now-last)/1000); last = now;
  while(acc >= DT){ update(); acc -= DT; }
  render();
  requestAnimationFrame(loop);
}
let started=false;
function boot(){ if(started)return; started=true; requestAnimationFrame(loop); }
hero.onload  = boot;
hero.onerror = ()=>{ const b=document.getElementById('err');
  b.style.display='block'; b.textContent='精灵图载入失败'; boot(); };
setTimeout(boot, 3000);
</script>
</body>
