<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>点头</title>
<style>
  :root{
    --bg:#0e1116; --ink:#f2f4f7; --dim:#8b93a1; --line:#262c36;
    --brand:#3ddc97;                       /* 品牌绿：开始、选中、进度条 */
    --ok:#21b866; --pass:#e0a02e; --hot:#ff5a4d;
    /* 四个大类各一套主色（深—更深）。底色只能往深走：词必须在两三米外最清楚，
       所以颜色负责「活泼」和「这是哪一类」，对比度仍然留给白字。 */
    --g1a:#1f6b4a; --g1b:#10392a;          /* 眼前的 */
    --g2a:#2f4194; --g2b:#161f4c;          /* 影音 */
    --g3a:#7c2f68; --g3b:#3f1836;          /* 文字与人 */
    --g4a:#8c5420; --g4b:#472a10;          /* 史地 */
    --pa:#1a1f27; --pb:#0e1116;            /* 当前词的底色，由 JS 按词所属大类设 */
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  /* 底色不是纯黑。两团很淡的辉光（左上偏绿、右下偏紫）压在深色上 ——
     菜单、起手、总结这三屏都走它，进行屏和确认屏各自有自己的底色。
     为什么是辉光不是平涂：菜单上有四个大类的彩色按钮，一层平涂的彩底会跟它们打架，
     辉光够淡，只负责把「黑」变成「夜」。 */
  body{
    height:100%;margin:0;color:var(--ink);overflow:hidden;
    background:
      radial-gradient(120% 95% at 2% 0%, rgba(61,220,151,.30), transparent 56%),
      radial-gradient(115% 95% at 100% 100%, rgba(150,90,220,.34), transparent 56%),
      radial-gradient(85% 70% at 88% 0%, rgba(237,120,190,.18), transparent 58%),
      linear-gradient(158deg,#16233a,#0e1116 52%,#1b1228);
    background-attachment:fixed;
  }
  body{
    font:16px/1.5 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;
  }
  .screen{
    position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;
    padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));
  }
  .screen.on{display:flex}

  /* ---------- 菜单 ---------- */
  /* 安全网：词包多到换三排时（568×320 的老手机上会），菜单可以滚，
     而不是把「开始」按钮顶出屏幕 —— 那是这一屏唯一必须点得到的东西。 */
  #menu,#subs{justify-content:space-between;gap:10px;padding-top:calc(14px + var(--safe-t));overflow:hidden}
  #menu h1{
    margin:0;font-size:clamp(28px,7vh,44px);letter-spacing:.4em;
    background:linear-gradient(100deg,var(--brand),#9db4ff 55%,#eda3d6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-indent:.4em;font-weight:600;
  }
  #menu .sub{
    color:var(--dim);font-size:13px;margin-top:6px;text-align:center;line-height:1.7;
    max-width:min(46em,100%);margin-left:auto;margin-right:auto;text-wrap:balance;
  }
  #menu .sub b{color:var(--ink);font-weight:600}
  /* ---------- 词包卡片 ---------- */
  /* 菜单分三层：头部 / 可滚的卡片网格 / 固定底栏。
     卡片比文字按钮占地大得多，而横屏只有 320~430px 高 —— 只有让网格自己滚、
     把时长和「开始」压进同一条底栏，卡片才有地方放，而「开始」永远点得到。 */
  #menu .head,#subs .head{flex:0 0 auto;text-align:center}
  #packs,#subPacks{
    /* flex:0 1 auto —— 网格只占内容那么高，富余由 #menu 的 space-between 均摊；
       装不下时它自己收缩并滚动（min-height:0 是让 flex 子项允许收缩的那一句）。 */
    flex:0 1 auto;min-height:0;width:100%;max-width:760px;padding:2px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;
    /* 行高跟着视口高度走：矮横屏 50px，高竖屏封顶 84px。
       上限压在 74：量出来竖屏 390×780 正好六行排下不用滚（76 时差 6px）。 */
    grid-auto-rows:clamp(50px,17vh,74px);
    align-content:start;overflow-y:auto;-webkit-overflow-scrolling:touch;
    /* 底部渐隐：被裁掉半行时读作「还有更多」，跟总结页那张列表同一个做法 */
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);
  }
  .card{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,1vh,7px);
    padding:4px;border:1px solid var(--line);border-radius:13px;
    background:#12151b;color:var(--dim);cursor:pointer;font-family:inherit;
    transition:transform .12s,background .15s,color .15s,border-color .15s;
  }
  .card:active{transform:scale(.96)}
  .card .ico{
    width:clamp(17px,4.6vh,28px);height:clamp(17px,4.6vh,28px);flex:0 0 auto;display:block;
    stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  }
  .card .nm{font-size:clamp(11px,3vh,15px);font-weight:600;line-height:1;color:var(--ink)}
  /* 装饰底纹：每个大类一种，很淡，只透出一点肌理。用 currentColor 所以自动跟着分组色走。 */
  .card::before{content:'';position:absolute;inset:0;pointer-events:none}
  .card[data-g="1"]{color:#7fe0b0;border-color:rgba(31,107,74,.75);background:rgba(31,107,74,.20)}
  .card[data-g="2"]{color:#9db4ff;border-color:rgba(47,65,148,.80);background:rgba(47,65,148,.22)}
  .card[data-g="3"]{color:#eda3d6;border-color:rgba(124,47,104,.75);background:rgba(124,47,104,.22)}
  .card[data-g="4"]{color:#f0bd7c;border-color:rgba(140,84,32,.75);background:rgba(140,84,32,.22)}
  .card[data-g="1"]::before{opacity:.14;background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:9px 9px}
  .card[data-g="2"]::before{opacity:.11;background-image:repeating-linear-gradient(45deg,currentColor 0 1px,transparent 1px 8px)}
  .card[data-g="3"]::before{opacity:.09;background-image:repeating-linear-gradient(-45deg,currentColor 0 1px,transparent 1px 7px),repeating-linear-gradient(45deg,currentColor 0 1px,transparent 1px 7px)}
  .card[data-g="4"]::before{opacity:.12;background-image:repeating-linear-gradient(0deg,currentColor 0 1px,transparent 1px 7px)}
  /* 选中一律品牌绿实心 —— 分组色是为了扫得快，「哪个被选了」比它更要紧，必须压过全部分组色 */
  .card[aria-checked=true],.card[data-g][aria-checked=true]{
    background:var(--brand);border-color:var(--brand);color:#06231a;
    box-shadow:0 4px 16px rgba(61,220,151,.30);
  }
  .card[aria-checked=true] .nm{color:#06231a;font-weight:800}
  .card[aria-checked=true]::before{opacity:.18}
  .card[disabled]{opacity:.3;cursor:default}
  .card small{font-size:10px;opacity:.75;line-height:1}
  /* 右上角的「›」表示这张卡点进去还有一层。随机卡没有，因为它没有子包 ——
     不同的行为就该有不同的记号，否则点下去的结果无法预测。 */
  .card .more{position:absolute;top:3px;right:6px;font-size:14px;line-height:1;opacity:.45}
  .card[aria-checked=true] .more{opacity:.6}
  /* 子包卡片：图标用所属大类那一枚，压淡当背景 —— 一眼看出还在这个大类里 */
  .card.subcard .ico{position:absolute;right:-6px;bottom:-6px;width:42%;height:auto;opacity:.16}
  .card.subcard .nm{font-size:clamp(11px,2.8vh,14px);text-align:center;padding:0 3px}
  #subs .head h2{margin:0;font-size:clamp(20px,5.4vh,32px);font-weight:700;letter-spacing:.14em}
  /* 子包名比大类名长（「虫·爬行·神兽」六个字），列宽要放宽，否则每张卡都折行 */
  /* 返回不参与时长那三个的平分 —— 它不是同一类东西 */
  #back2{flex:0 0 auto;min-width:5.2em;font-size:13px}

  /* ---------- 底栏：时长 + 开始 ---------- */
  .foot{flex:0 0 auto;width:100%;max-width:760px;display:flex;gap:8px;align-items:stretch}
  .foot .chips{flex:1 1 auto;display:flex;gap:6px}
  .chip{
    flex:1 1 0;min-width:0;padding:11px 8px;border:1px solid var(--line);border-radius:11px;
    background:#12151b;color:var(--dim);font-size:14px;text-align:center;cursor:pointer;
    font-family:inherit;transition:background .15s,color .15s,border-color .15s;
  }
  .chip[aria-checked=true]{background:var(--brand);color:#06231a;border-color:var(--brand);font-weight:700}
  #go,#go2{
    flex:0 0 34%;padding:11px 8px;border:0;border-radius:11px;
    background:linear-gradient(135deg,var(--brand),#22b880);
    color:#06231a;font-size:17px;font-weight:800;letter-spacing:.25em;
    box-shadow:0 8px 24px rgba(61,220,151,.28);
    text-indent:.25em;cursor:pointer;font-family:inherit;
  }

  /* 竖着拿的时候高度富余，space-between 会把三块推到两端、中间空出两大片。
     改成居中 + 均匀间距，读起来才有节奏。 */
  @media (max-aspect-ratio:1/1){
    #menu{gap:16px;padding-top:calc(26px + var(--safe-t))}
    #packs,#subPacks{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  }

  /* 矮屏压缩档。竖着拿的时候高度充裕，这一档实际只会在【横着拿】时生效 ——
     横屏手机的可用高度只有 320~430px，包一多就顶到底 ——
     这一档把标题、说明、按钮内边距一起收，量下来能省出 60px 左右。 */
  @media (max-height:380px){
    #menu{padding-top:calc(8px + var(--safe-t));gap:7px}
    #menu h1{font-size:21px;letter-spacing:.3em;text-indent:.3em}
    #menu .sub{font-size:10.5px;line-height:1.5;margin-top:3px}
    #packs,#subPacks{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
    .card{border-radius:11px}
    .chip{padding:8px 6px;font-size:13px}
    #go{padding:8px;font-size:15px}
    /* 总结页在矮屏上也收一档，给词表多让出一行多 */
    #over{gap:8px}
    .num{padding:6px 8px}
    .num b{font-size:clamp(22px,6.4vh,32px)}
    #over .foot button{padding:10px;font-size:14px}
    #list .it{padding:8px 10px 8px 12px;font-size:16px}
  }

  /* ---------- 起手 ---------- */
  #ready .big{
    font-size:min(38vh,38vw);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    color:var(--brand);
    animation:breathe 1s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{text-shadow:0 0 36px rgba(61,220,151,.22)}
    50%{text-shadow:0 0 72px rgba(61,220,151,.45)}
  }
  #ready .hint{color:var(--dim);margin-top:18px;font-size:clamp(14px,3.4vh,20px);text-align:center}

  /* ---------- 进行 ---------- */
  /* 底色跟着当前词所属的大类换。随机包一局里会一路变色 ——
     既活泼，也顺带告诉表演人这个词是哪一类的。0.45s 过渡让它像换了口气，不是闪一下。 */
  #play{
    justify-content:center;
    background:linear-gradient(158deg,var(--pa),var(--pb) 72%);
    transition:background .45s ease;
  }
  /* 最后十秒：整屏边缘泛红并每秒跳一下。
     为什么不是「把倒计时放大」—— 词是居中且可能占满整宽的，角落里的数字一放大就会压到词上。
     边缘辉光在余光里，永远不跟词抢位置，而表演人在两米外一眼就知道时间要没了。 */
  #play::after{
    content:'';position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 0 rgba(224,86,74,0);transition:box-shadow .3s;
  }
  #play.hot::after{
    box-shadow:inset 0 0 80px 8px rgba(255,90,77,.46);
    animation:tick 1s steps(1,end) infinite;
  }
  /* 光靠边缘辉光，在暖色底（史地那一组）上不够刺眼 —— 量下来是这一类最弱。
     再叠一层整屏红罩：不管底下是哪个大类的色，最后十秒一律偏红。
     这会盖掉「当前词属于哪一类」那点信息，是有意的 —— 此刻紧迫比分类要紧。 */
  #play.hot::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background:rgba(190,38,30,.30);
  }
  @keyframes tick{
    0%,55%{box-shadow:inset 0 0 80px 8px rgba(255,90,77,.46)}
    56%,100%{box-shadow:inset 0 0 38px 3px rgba(255,90,77,.18)}
  }
  #bar{position:fixed;top:0;left:0;height:6px;background:var(--brand);width:100%;transition:background .25s}
  #bar.hot{background:var(--hot);box-shadow:0 0 14px rgba(224,86,74,.7)}
  #word{
    font-weight:700;line-height:1.1;text-align:center;
    max-width:100%;word-break:break-all;
  }
  #tally,#clock{
    position:fixed;bottom:calc(7px + var(--safe-b));
    color:rgba(255,255,255,.52);font-size:clamp(14px,3.6vh,20px);font-variant-numeric:tabular-nums;
    letter-spacing:.04em;transition:color .25s,font-size .25s;
  }
  #tally{left:calc(12px + var(--safe-l))}
  #clock{right:calc(12px + var(--safe-r));font-weight:600}
  #play.hot #clock{color:var(--hot);font-size:clamp(22px,5.4vh,34px)}

  /* ---------- 确认 ---------- */
  #confirm{color:#fff}
  #confirm.ok{background:linear-gradient(150deg,#2bd47a,#0f8a4c)}
  #confirm.pass{background:linear-gradient(150deg,#f5b544,#b8791a)}
  /* 箭头把「猜中＝往下翻 / 跳过＝往上翻」这层肌肉记忆再钉一次 ——
     这一屏是唯一能钉它的地方，因为此刻手机正好停在翻过去的那个角度上 */
  #confirm .arw{font-size:min(13vh,12vw);line-height:1;opacity:.55;margin-bottom:-.06em}
  #confirm .k{font-size:min(18vh,16vw);font-weight:700;letter-spacing:.2em;text-indent:.2em}
  #confirm .w{font-size:clamp(16px,4vh,26px);opacity:.85;margin-top:6px}
  #confirm .back{margin-top:22px;font-size:clamp(13px,2.6vh,17px);opacity:.75}

  /* ---------- 总结 ---------- */
  #over{justify-content:flex-start;gap:12px}
  .nums{display:flex;gap:10px;width:100%;max-width:720px;margin-top:4px}
  .num{
    flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:#12151b;
  }
  .num b{display:block;font-size:clamp(26px,7vh,40px);line-height:1.1;font-variant-numeric:tabular-nums}
  .num span{color:var(--dim);font-size:11px;letter-spacing:.14em}
  .num.ok{border-color:rgba(61,220,151,.45);background:rgba(33,184,102,.12)}
  .num.pass{border-color:rgba(224,160,46,.45);background:rgba(224,160,46,.12)}
  .num.ok b{color:var(--brand)} .num.pass b{color:#f5c26b}
  #list{
    /* min-height:0 是必须的：flex 子项默认 min-height:auto，列表会按内容把自己撑到
       份额之外，再把下面的提示和按钮顶出容器 —— 表现出来就是提示那行压在词条上。 */
    width:100%;max-width:720px;flex:1;min-height:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);margin-top:2px;
    /* 底部渐隐：被裁掉半行时，让它读作「还有更多」而不是「坏了」。
       列表不满时这段本来就是空的，看不出来。 */
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
  }
  /* 横着拿的时候一屏只看得见三条，太少 —— 宽度有富余就排两栏，一眼多一倍。
     grid 是行优先的，所以「按出现顺序」这条没被破坏。 */
  @media (min-aspect-ratio:1/1){
    #list{display:grid;grid-template-columns:1fr 1fr;align-content:start;column-gap:14px}
  }
  #list .it{
    display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;
    border-bottom:1px solid var(--line);border-left:4px solid transparent;
    cursor:pointer;font-size:17px;transition:background .15s;
  }
  #list .it:active{background:#161a21}
  #list .it.ok{border-left-color:var(--brand)}
  #list .it.pass{border-left-color:#f5c26b}
  #list .it .n{color:#3f4754;font-size:11px;width:2.2em;font-variant-numeric:tabular-nums}
  #list .it .w{flex:1;font-weight:500}
  #list .it .v{font-size:12px;letter-spacing:.1em;opacity:.75}
  #list .it.ok .v{color:var(--brand)}
  #list .it.pass .v{color:#f5c26b}
  #list .it.pass .w{color:var(--dim)}
  #over .foot{display:flex;gap:8px;width:100%;max-width:720px;padding-bottom:2px}
  #over .foot button{
    flex:1;padding:13px;border:1px solid var(--line);border-radius:11px;background:#12151b;
    color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit;
  }
  #over .foot button.pri{
    background:linear-gradient(135deg,var(--brand),#22b880);color:#06231a;
    border-color:transparent;font-weight:800;
  }
  #over .tip{color:#5b6472;font-size:12px;text-align:center}


  /* ---------- 子包网格（放在最后，好压过矮屏档给大类定的窄列）----------
     子包名比大类名长（「迪士尼与动画电影」八个字），列要更宽；
     而子包最多 7 张、只占一两行，所以行高也比大类那屏给得大 ——
     否则一行小卡片浮在一大片空白中间，看着像没加载完。 */
  #subPacks{
    grid-template-columns:repeat(auto-fill,minmax(122px,1fr));
    grid-auto-rows:clamp(62px,24vh,104px);
  }
  @media (max-height:380px){
    #subPacks{grid-template-columns:repeat(auto-fill,minmax(106px,1fr))}
  }

  /* 窄屏的底栏：细分屏比大类屏多一个「返回」，390px 宽下三个时长按钮被挤到把
     「60秒」折成两行。收窄返回与开始，把省下的宽度还给时长。 */
  @media (max-width:460px){
    #back2{min-width:3.4em;font-size:12px;padding:9px 6px}
    #go,#go2{flex:0 0 27%;font-size:15px;letter-spacing:.12em;text-indent:.12em}
    .chip{padding:9px 4px;font-size:13px}
  }
</style>

<!-- ================= 菜单 ================= -->
<div class="screen on" id="menu">
  <div class="head">
    <h1>点头</h1>
    <div class="sub">
      一个人举起手机、<b>屏幕朝外</b>，另一个人看词往外传 —— 横着竖着都行。<br>
      猜对了<b>往下翻</b>，说不出来<b>往上翻</b>；怎么描述随便，但<b>不能说词里的字</b>。
    </div>
  </div>

  <div id="packs"></div>

  <div class="foot">
    <div class="chips" id="secs"></div>
    <button id="go">开 始</button>
  </div>
</div>

<!-- ================= 细分 ================= -->
<div class="screen" id="subs">
  <div class="head">
    <h2 id="subTitle">动物</h2>
    <div class="sub">挑一类，或者选「全部」—— 在整个大类里随机。</div>
  </div>

  <div id="subPacks"></div>

  // 只看 API 在不在，起手那一屏就会叫人「把手机举到额头前」，而他坐在电脑前。
  let sensorGranted = false, sensorLive = false, smooth = null;

  // 屏幕法线在世界坐标里的竖直分量 = 旋转矩阵的 (2,2) 元 = cos(β)·cos(γ)。
  // 它在横屏 / 竖屏都成立，而且在 gamma 的奇点上也不跳 —— 那儿 cos(β)≈0，稳稳压在中位。
  function normalZ(beta, gamma) {
    const r = Math.PI / 180;
    return Math.cos(beta * r) * Math.cos(gamma * r);
  }

  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;   // 没有硬件时 Chrome 发的就是一串 null
    sensorLive = true;
    const z = normalZ(e.beta, e.gamma);
    smooth = smooth == null ? z : smooth + (z - smooth) * 0.35;   // 低通，压手抖
    feedNormal(smooth);
  }

  // iOS 13+ 要在【用户手势里】求权限，而且页面必须是 HTTPS。
  // 拿不到就静默退到点击那条路 —— 不弹错误框，派对上没人想读报错。
  function askSensor() {
    try {
      const D = window.DeviceOrientationEvent;
      if (!D) return Promise.resolve(false);
      if (typeof D.requestPermission === 'function') {
        return D.requestPermission().then(r => {
          if (r !== 'granted') return false;
          window.addEventListener('deviceorientation', onOrient);
          return true;
        }).catch(() => false);
      }
      window.addEventListener('deviceorientation', onOrient);
      return Promise.resolve(true);
    } catch (_) { return Promise.resolve(false); }
  }

  // ===================================================================
  // 音效 —— 猜词人看不见屏幕，声音是他唯一的反馈（不做震动）
  // ===================================================================
  let AC = null;
  function ac() {
    if (AC) return AC;
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { AC = null; }
    return AC;
  }
  function tone(f0, f1, dur, type, gain) {
    const c = ac(); if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f0, t);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(gain == null ? 0.22 : gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  }
  function sfx(k) {
    if (k === 'ok') { tone(660, 990, 0.12, 'triangle', 0.3); setTimeout(() => tone(990, 1320, 0.1, 'triangle', 0.26), 70); }
    else if (k === 'pass') tone(420, 300, 0.2, 'sawtooth', 0.16);
    else if (k === 'cd') tone(760, 760, 0.09, 'sine', 0.2);
    else if (k === 'go') tone(1240, 1240, 0.16, 'sine', 0.26);
    else if (k === 'tick') tone(1500, 1500, 0.045, 'square', 0.1);
    else if (k === 'end') { tone(300, 160, 1.1, 'sawtooth', 0.3); setTimeout(() => tone(220, 120, 1.0, 'triangle', 0.22), 90); }
  }

  // ===================================================================
  // 视图层 —— 只读状态，不写状态
  // ===================================================================
  // 大类。它不参与任何逻辑（词包的权威顺序仍然是 PACKS），只管两件看得见的事：
  // 菜单上把同类连成一片，以及进行屏的底色。
  const GROUP = { 动物: 1, 日常动作: 1, 食物: 1,
                  影视动画: 2, 动漫: 2, 二次元角色: 2, 游戏: 2, 歌曲: 2, 古风歌曲: 2, 戏曲: 2,
                  成语: 3, 诗词: 3, 名人: 3, 中国史: 4, 世界史: 4, 地理: 4 };

  const $ = id => document.getElementById(id);
  const S = {};
  ['menu', 'subs', 'ready', 'play', 'confirm', 'over'].forEach(k => (S[k] = $(k)));
  let scr = 'menu';
  let view = 'menu';   // 没开局时停在哪一屏：大类 or 细分
  function show(k) {
    if (scr === k) return;
    scr = k;
    for (const n in S) S[n].classList.toggle('on', n === k);
  }
  function paint(n) { painted.add(n); }

  // 进行屏的底色跟着【当前这个词】所属的大类走，不是跟着这一局选的包走 ——
  // 随机包一局里混着各类词，跟着词走才对得上，也正好让一局有颜色的起伏。
  function setHue(pack) {
    const g = GROUP[pack] || 0;
    const r = document.documentElement.style;
    r.setProperty('--pa', g ? 'var(--g' + g + 'a)' : '#1a1f27');
    r.setProperty('--pb', g ? 'var(--g' + g + 'b)' : '#0e1116');
  }

  // 字号按【当前可用宽高】实算，允许折行。
  // 旧版是一串写死的 vw 阶梯，那是照横屏调的：同样一个九字词，
  // 竖屏下挤一行只有 39px，折成三行能到 117px —— 阶梯做不到这件事。
  // 折行有 1.5 倍的门槛：折了要比不折大一半以上才折，
  // 否则横屏上大部分词会无谓地变成两行。
  function fitWord(w) {
    const n = (w || '').length || 1;
    const W = (window.innerWidth || 800) - 24;          // 左右各留一点
    const H = (window.innerHeight || 360) - 60;         // 顶上进度条、底下比分
    const LH = 1.1;
    let one = 0, best = 0;
    for (let lines = 1; lines <= 3; lines++) {
      const per = Math.ceil(n / lines);
      const size = Math.min(W / per, H / (lines * LH)) * .98;
      if (lines === 1) { one = size; best = size; }
      else if (size > best && size > one * 1.5) best = size;
    }
    return Math.max(16, Math.min(best, 190)).toFixed(1) + 'px';
  }

  let lastWord = null, lastOver = -1;
  function render() {
    if (!st) { paint('菜单'); show(view === 'subs' ? 'subs' : 'menu'); return; }

    if (st.state === '起手') {
      paint('倒数'); show('ready');
      $('cd').textContent = st.armed ? String(Math.max(1, Math.ceil(st.readyLeft / 1000))) : '·';
      $('cdhint').textContent = st.armed ? '别偷看'
        : sensorLive ? '把手机举到额头前，屏幕对着比划的人'
        : '举到额头前，或者点一下屏幕开始';
      return;
    }

    if (st.state === '进行') {
      paint('词'); show('play');
      if (st.word !== lastWord) {
        lastWord = st.word;
        $('word').textContent = st.word || '—';
        $('word').style.fontSize = fitWord(st.word);
        setHue(OF[st.word]);
      }
      const p = Math.max(0, st.left / st.total);
      $('bar').style.width = (p * 100).toFixed(2) + '%';
      const hot = st.left <= HOT_MS;
      $('bar').classList.toggle('hot', hot);
      S.play.classList.toggle('hot', hot);
      const sc = score();
      $('tally').textContent = '猜中 ' + sc.猜中 + ' · 跳过 ' + sc.跳过;
      $('clock').textContent = Math.ceil(st.left / 1000) + '"';
      return;
    }

    if (st.state === '确认') {
      paint('确认'); show('confirm');
      const ok = st.last === '猜中';
      S.confirm.classList.toggle('ok', ok);
      S.confirm.classList.toggle('pass', !ok);
      $('ck').textContent = st.last;
      $('carw').textContent = ok ? '↓' : '↑';
      $('cw').textContent = (st.log[st.log.length - 1] || {}).word || '';
      $('cb').textContent = sensorLive ? '转回来，继续' : '点一下继续';
      lastWord = null;
      return;
    }

    // 总结
    paint('总结'); show('over');
    const sc = score();
    if (lastOver !== st.log.length + sc.猜中 * 1000) {
      lastOver = st.log.length + sc.猜中 * 1000;
      $('nOk').textContent = sc.猜中;
      $('nPass').textContent = sc.跳过;
      $('nPace').textContent = st.log.length ? pace().toFixed(1) + '"' : '—';
      const box = $('list');
      box.innerHTML = '';
      st.log.forEach((e, i) => {
        const d = document.createElement('div');
        d.className = 'it ' + (e.verdict === '猜中' ? 'ok' : 'pass');
        const cell = (cls, txt) => {
          const x = document.createElement('span');
          x.className = cls; x.textContent = txt; d.appendChild(x);
        };
        cell('n', String(i + 1));
        cell('w', e.word);
        cell('v', e.verdict);
        d.addEventListener('click', () => { amend(i); lastOver = -1; render(); });
        box.appendChild(d);
      });
    }
  }

  // ===================================================================
  // 接线
  // ===================================================================
  let pick = { pack: '随机', sub: null, secs: 60 };

  // 每个词包一枚线条图标。全是 24×24 里的基本形（圆、矩形、折线），
  // 跟这个仓库其余几款一样：美术由代码生成，不外挂任何文件。
  // stroke 走 currentColor，所以图标自动跟着卡片的分组色走，选中变深色也不用单独写。
  const ICON = {
    随机: '<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="1.1" fill="currentColor" stroke="none"/>',
    动物: '<circle cx="6.6" cy="10" r="1.7"/><circle cx="10.4" cy="7.2" r="1.7"/><circle cx="14.6" cy="7.2" r="1.7"/><circle cx="18" cy="11" r="1.7"/><path d="M8.2 17.4c0-2.6 1.9-4.2 4.1-4.2s4.1 1.6 4.1 4.2c0 1.9-1.7 2.9-4.1 2.9s-4.1-1-4.1-2.9z"/>',
    日常动作: '<path d="M7.5 13.2V7.3a1.5 1.5 0 013 0v4.4V5.2a1.5 1.5 0 013 0v6.5V6.6a1.5 1.5 0 013 0v5.1"/><path d="M16.5 11.7a1.5 1.5 0 013 0v3.5c0 3.3-2.4 5.8-6 5.8s-6-2.5-6-5.8v-2.3"/>',
    食物: '<path d="M3.5 12h17a8.5 8.5 0 01-8.5 8.5A8.5 8.5 0 013.5 12z"/><path d="M8.5 8.5l2.5-5M13 8.5l3.5-5"/>',
    影视动画: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.3 9.4l4.8 2.6-4.8 2.6z"/>',
    动漫: '<path d="M4 6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5v6a2.5 2.5 0 01-2.5 2.5H10l-4.2 3.7V15h-.3A2.5 2.5 0 013 12.5"/><path d="M12 6.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/>',
    二次元角色: '<circle cx="12" cy="8.5" r="4.2"/><path d="M4.8 20.5c0-3.9 3.2-6.2 7.2-6.2s7.2 2.3 7.2 6.2"/>',
    游戏: '<rect x="2.5" y="8" width="19" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="18.4" cy="15" r="1.1" fill="currentColor" stroke="none"/>',
    歌曲: '<path d="M9.5 17.5V5.8l9-1.8v11.5"/><circle cx="7" cy="17.8" r="2.6"/><circle cx="16" cy="15.8" r="2.6"/>',
    古风歌曲: '<path d="M12 20.5L3.8 8A9.8 9.8 0 0112 3.5 9.8 9.8 0 0120.2 8z"/><path d="M12 20.5V8M8 9.2L6.4 15M16 9.2l1.6 5.8"/>',
    戏曲: '<path d="M12 3.2c4.4 0 6.9 2.9 6.9 6.8 0 5-3.4 10.8-6.9 10.8S5.1 15 5.1 10c0-3.9 2.5-6.8 6.9-6.8z"/><path d="M8.3 10.2c.9-1.1 2.3-1.1 3.1 0M12.6 10.2c.8-1.1 2.2-1.1 3.1 0M9.8 15.2c1.3.9 3.1.9 4.4 0"/>',
    成语: '<rect x="3.4" y="3.4" width="7.2" height="7.2" rx="1.4"/><rect x="13.4" y="3.4" width="7.2" height="7.2" rx="1.4"/><rect x="3.4" y="13.4" width="7.2" height="7.2" rx="1.4"/><rect x="13.4" y="13.4" width="7.2" height="7.2" rx="1.4"/>',
    诗词: '<rect x="5" y="2.8" width="14" height="18.4" rx="2.4"/><path d="M8.8 7.6h6.4M8.8 11.6h6.4M8.8 15.6h3.6"/>',
    名人: '<circle cx="12" cy="8" r="4.6"/><path d="M8.4 12.1L6.8 21.2 12 18.5l5.2 2.7-1.6-9.1"/>',
    中国史: '<path d="M3.6 8.4c2.2-1.2 4.4-3.4 8.4-3.4s6.2 2.2 8.4 3.4"/><path d="M6 8.4v3h12v-3"/><path d="M8 11.4v7.6M16 11.4v7.6M5 19h14M3 21.8h18"/>',
    世界史: '<path d="M3 9.2l9-6.2 9 6.2z"/><path d="M6 9.2v8M10 9.2v8M14 9.2v8M18 9.2v8M4 17.2h16M2.6 20.4h18.8"/>',
    地理: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.7 2.5 4.1 5.7 4.1 9s-1.4 6.5-4.1 9c-2.7-2.5-4.1-5.7-4.1-9S9.3 5.5 12 3z"/>',
  };
  const iconSVG = n => '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || '') + '</svg>';

  // 大类卡片的点击有两种行为，所以卡片上有两种记号：
  //   随机 —— 没有子包，点了就是选中（实心绿）
  //   其余 —— 点了进细分屏，右上角带一个「›」
  function buildMenu() {
    const pb = $('packs');
    const mk = (name, enabled) => {
      const b = document.createElement('button');
      b.className = 'card';
      b.type = 'button';
      b.dataset.pack = name;
      // 图标用 innerHTML 是有意的：SVG 得走 createElementNS，逐个 path 拼出来又长又难读，
      // 而这枚图标是纯装饰、没有任何代码会回头读它的子节点 —— 名字仍然走 createElement。
      b.innerHTML = iconSVG(name);
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = name;
      b.appendChild(nm);
      if (GROUP[name]) b.setAttribute('data-g', String(GROUP[name]));
      if (!enabled) { b.disabled = true; const s = document.createElement('small'); s.textContent = '待补'; b.appendChild(s); }
      else if (name !== '随机') { const m = document.createElement('span'); m.className = 'more'; m.textContent = '›'; b.appendChild(m); }
      b.addEventListener('click', () => {
        if (!enabled) return;
        if (name === '随机') { pick.pack = '随机'; pick.sub = null; markPacks(); return; }
        openSubs(name);
      });
      pb.appendChild(b);
    };
    mk('随机', true);
    PACKS.forEach(p => mk(p, WORDS[p].length > 0));
    markPacks();
    buildSecs($('secs'));
    buildSecs($('secs2'));
  }

  // 两屏各有一排时长按钮，但 pick.secs 只有一份 —— 点任意一排都要把两排都刷了，
  // 否则返回上一屏会看到一个跟事实不符的选中态。
  function buildSecs(box) {
    SECS.forEach(v => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = v + '秒';
      b.dataset.secs = String(v);
      b.addEventListener('click', () => { pick.secs = v; markSecs(); });
      box.appendChild(b);
    });
    markSecs();
  }
  function markSecs() {
    [...$('secs').children, ...$('secs2').children]
      .forEach(c => c.setAttribute('aria-checked', String(+c.dataset.secs === pick.secs)));
  }
  function markPacks() {
    [...$('packs').children]
      .forEach(c => c.setAttribute('aria-checked', String(c.dataset.pack === pick.pack)));
  }

  // 细分屏。第一张永远是「全部」= 在整个大类里随机 —— 它是默认选中的那张，
  // 因为大多数人进来只是想看看有什么，并不想真的挑一类。
  function openSubs(pack) {
    $('subTitle').textContent = pack;
    const box = $('subPacks');
    box.innerHTML = '';
    const g = GROUP[pack] ? String(GROUP[pack]) : null;
    const mkSub = (label, subName, count) => {
      const b = document.createElement('button');
      b.className = 'card subcard';
      b.type = 'button';
      b.dataset.pack = pack;
      b.dataset.sub = subName || '';
      b.innerHTML = iconSVG(pack);
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = label; b.appendChild(nm);
      const c = document.createElement('small'); c.textContent = count + ' 词'; b.appendChild(c);
      if (g) b.setAttribute('data-g', g);
      b.addEventListener('click', () => {
        pick.pack = pack; pick.sub = subName || null;
        [...box.children].forEach(x => x.setAttribute('aria-checked',
          String((x.dataset.sub || null) === pick.sub)));
      });
      box.appendChild(b);
    };
    mkSub('全部', null, WORDS[pack].length);
    (SUBS[pack] || []).forEach(r => mkSub(r[0], r[0], r[2] - r[1]));
    // 进来就把当前选择落到这一屏上：本来选的就是这个大类就沿用，否则默认「全部」
    if (pick.pack !== pack) { pick.pack = pack; pick.sub = null; }
    [...box.children].forEach(x => x.setAttribute('aria-checked',
      String((x.dataset.sub || null) === pick.sub)));
    markPacks();
    view = 'subs';
    render();
  }

  function relayout() {
    lastWord = null;
    render();
  }

  function beginRound() {
    try { const c = ac(); if (c && c.resume) c.resume(); } catch (_) {}   // 手势里解锁音频
    // ?seed= 在的时候不覆盖它 —— 调试要钉得死；平时每局换一颗种子
    const pinned = /[?&]seed=(-?\d+)/.test(location.search || '');
    const o = { pack: pick.pack, sub: pick.sub, secs: pick.secs };
    start(pinned ? o : Object.assign(o, { seed: (Date.now() & 0x7fffffff) }));
    relayout();
    askSensor().then(on => { sensorGranted = on; smooth = null; render(); });
    render();
  }

  function boot() {
    buildMenu();
    $('go').addEventListener('click', beginRound);
    $('go2').addEventListener('click', beginRound);
    $('back2').addEventListener('click', () => { view = 'menu'; markPacks(); render(); });
    $('again').addEventListener('click', beginRound);
    $('back').addEventListener('click', () => { st = null; view = 'menu'; lastWord = null; lastOver = -1; render(); });

    // 点击兜底：总结页和菜单不吃，别把「改判」误判成「跳过」
    document.addEventListener('pointerdown', e => {
      if (!st || st.state === '总结') return;
      feedTap(e.clientY, window.innerHeight || 1);
      render();
    });
    // 桌面上也能玩：↓ 猜中、↑ 跳过、空格放行
    window.addEventListener('keydown', e => {
      if (!st) return;
      if (e.code === 'ArrowDown') feedNormal(-1);
      else if (e.code === 'ArrowUp') feedNormal(1);
      else if (e.code === 'Space') { feedNormal(0); e.preventDefault(); }
      else return;
      render();
    });

    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', relayout);

    // 主循环。桌面 / 手机都靠它，量具则直接调 tick/ready —— 两条路推同一个状态机。
    let t0 = 0;
    const loop = t => {
      const dt = t0 ? Math.min(250, t - t0) : 0;
      t0 = t;
      if (st) { if (st.state === '起手') ready(dt); else tick(dt); }
      render();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    render();
  }

  // ---- 契约（tools/nod-stub.js 里定稿的那一份）----------------------
  const NOD = {
    PACKS, WORDS, SECS, TH, PAINT_PATHS,
    start, ready, tick, verdict, release, feedNormal, feedTap, amend,
    render, paint, normalZ, pace, SUBS,
    packOf: w => OF[w] || null,
    subsOf: p => (SUBS[p] || []).map(r => r[0]),
    sub: () => (st ? st.sub : null),
    word: () => (st && st.state === '进行' ? st.word : null),
    left: () => (st ? st.left : 0),
    usedMs: () => (st ? st.total - st.left : 0),
    log: () => (st ? st.log.slice() : []),
    score,
    state: () => (st ? st.state : null),
    cycles: () => (st ? st.cycles : 0),
    poolSize: () => (st ? st.base.length : 0),
    shown() {
      if (!st) return { kind: '无' };
      if (st.state === '起手') return { kind: '倒数', n: Math.ceil(st.readyLeft / 1000) };
      if (st.state === '进行') return { kind: '词', word: st.word };
      if (st.state === '确认') return { kind: '确认', verdict: st.last };
      return { kind: '总结' };
    },
    __painted: painted,
  };
  window.NOD = NOD;

  if (document.getElementById('menu')) boot();
})();
</script>
</html>
