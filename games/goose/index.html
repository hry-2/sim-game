<script>
'use strict';
const ITEMS=[['🥕','胡萝卜'],['🌽','玉米'],['🍅','番茄'],['🥬','青菜'],['🍆','茄子'],['🍎','苹果'],['🍄','蘑菇'],['🎃','南瓜'],['🪿','大鹅']];
const LEVELS=[{name:'先来热热手',place:'第一站 · 农家小院',layers:[[4,3],[3,2]],types:4},{name:'鹅躲到菜园啦',place:'第二站 · 田边菜园',layers:[[6,5],[5,4],[4,3],[1,1]],types:7},{name:'最后一筛，抓住它',place:'第三站 · 丰收集市',layers:[[6,5],[5,4],[4,3],[3,2],[3,2],[1,1]],types:8}];
const $=id=>document.getElementById(id);let tiles=[],tray=[],history=[],level=0,total=0,cleared=0,caught=0,phase='playing',uses={},sound=false,audio,solution=[],focusReturn;
let view3d = null;
function randomize(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function overlaps(a,b){return Math.abs(a.x-b.x)<14.5&&Math.abs(a.y-b.y)<17}
function available(tile,list=tiles){return !list.some(t=>t.z>tile.z&&overlaps(t,tile))}
function removalOrder(){const pool=tiles.slice(),order=[];while(pool.length){const choices=pool.filter(t=>available(t,pool));const t=choices[Math.floor(Math.random()*choices.length)];order.push(t);pool.splice(pool.indexOf(t),1)}return order}
function deal(){const order=removalOrder(),types=[];const counts=Array(ITEMS.length).fill(0);for(const t of [...tiles,...tray])counts[t.type]++;for(let k=0;k<counts.length;k++){const held=tray.filter(t=>t.type===k).length;if(held){for(let n=0;n<3-held;n++)types.push(k);counts[k]-=3}}
const groups=[];for(let k=0;k<counts.length;k++)for(let n=0;n<counts[k]/3;n++)groups.push(k);const geese=groups.filter(k=>k===8);randomize(groups);for(const k of [...groups.filter(k=>k!==8),...geese])types.push(k,k,k);order.forEach((t,i)=>t.type=types[i]);solution=order.map(t=>t.id)}
function start(index){view3d?.reset();level=index;phase='playing';tiles=[];tray=[];history=[];cleared=0;uses={undo:3,shuffle:2,hint:3};const cfg=LEVELS[level];cfg.layers.forEach(([cols,rows],z)=>{for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)tiles.push({id:tiles.length,x:(100-cols*15.5)/2+c*15.5,y:(100-rows*18)/2+r*18,z,type:0})});total=tiles.length;const groups=total/3;for(let i=0;i<total;i++)tiles[i].type=Math.floor(i/3)===groups-1?8:Math.floor(i/3)%cfg.types;deal();closeModal();say('点击收取 · 拖动转视角 · 晃一晃翻动好物');render()}
function tone(match=false){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();[0,...(match?[.09,.18]:[])].forEach((delay,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(match?[523,659,784][i]:420,t);g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)})}catch{}}
function say(text){$('status').textContent=text}
function snapshot(){return {tiles:tiles.map(t=>({...t})),tray:tray.map(t=>({...t})),cleared,solution:solution.slice(),motion:view3d?.snapshot()}}
// A ray-confirmed 3D hit is selectable even when the conservative deal grid overlaps.
function pick(id,visibleHit=false){if(phase!=='playing')return;const t=tiles.find(t=>t.id===id);if(!t||(!visibleHit&&!available(t)))return;history.push(snapshot());tiles=tiles.filter(x=>x.id!==id);solution=solution.filter(x=>x!==id);tray.push(t);tray.sort((a,b)=>a.type-b.type);const match=tray.filter(x=>x.type===t.type).length===3;if(match){tray=tray.filter(x=>x.type!==t.type);cleared+=3;say(t.type===8?'嘎！大鹅被你找到了！':'凑齐一组'+ITEMS[t.type][1]+'！继续找找');}else say(tray.length>=5?'收纳槽快满了，优先凑齐已有的物品':'再找找相同的'+ITEMS[t.type][1]);tone(match);render();if(!tiles.length&&!tray.length){phase='won';render();caught++;$('caught').textContent='已抓到 '+caught+' 只鹅';openModal('抓到大鹅啦！',level===2?'三筛好物全部收齐，三只大鹅也乖乖回家。\n歇一歇，或再挑战一次吧。':'这一筛收得干干净净。\n下一只鹅躲得更深了，去找找？',level===2?'再玩一轮':'去下一站',()=>start((level+1)%LEVELS.length),'留在这里',closeModal)}else if(tray.length>=7){phase='lost';render();openLoss()}}
function render(){view3d?.sync();const cfg=LEVELS[level];$('chapter').textContent=cfg.place;$('level').textContent=cfg.name;$('remaining').textContent='已收齐 '+cleared+' / '+total+' 件';$('bar').style.width=cleared/total*100+'%';$('capacity').textContent=tray.length+' / 7';$('trayWrap').classList.toggle('danger',tray.length>=5);$('board').querySelectorAll('.tile').forEach(b=>b.remove());for(const t of tiles){const b=document.createElement('button');const free=view3d?true:available(t);b.className='tile'+(free?'':' blocked');b.disabled=!free;b.dataset.id=t.id;b.style.cssText=`left:${t.x}%;top:${t.y}%;z-index:${t.z+1}`;b.textContent=ITEMS[t.type][0];b.setAttribute('aria-label',ITEMS[t.type][1]+(free?'':'（被遮挡）'));b.onclick=()=>view3d?view3d.pickVisible(t.id):pick(t.id);$('board').append(b)}$('tray').replaceChildren();for(let i=0;i<7;i++){const slot=document.createElement('div');slot.className='slot'+(tray[i]?' filled':'');slot.textContent=tray[i]?ITEMS[tray[i].type][0]:'';if(tray[i]&&view3d){const img=document.createElement('img');img.src=view3d.icons[tray[i].type];img.alt=ITEMS[tray[i].type][1];slot.replaceChildren(img);}slot.setAttribute('aria-label',tray[i]?ITEMS[tray[i].type][1]:'空槽位');$('tray').append(slot)}for(const k of ['undo','shuffle','hint']){$(k+'Count').textContent=uses[k];$(k).disabled=!uses[k]||phase==='won'||(k==='undo'&&!history.length)||(k!=='undo'&&phase!=='playing')}}
function undo(){if(!uses.undo||!history.length||phase==='won')return;const s=history.pop();({tiles,tray,cleared,solution}=s);uses.undo--;phase='playing';view3d?.restore(s.motion);closeModal();render();say('退回上一步，换个思路试试')}
function openLoss(){openModal('哎呀，装满了','七个槽位都满了。\n先凑槽里已有的物品，会更容易抓到鹅。',uses.undo&&history.length?'撤回上一步':'重新挑战',uses.undo&&history.length?undo:()=>start(level),'重新挑战',()=>start(level))}
function closeModal(){$('modal').hidden=true;focusReturn?.focus()}
function openModal(title,text,primary,action,secondary,second){focusReturn=document.activeElement;$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogPrimary').textContent=primary;$('dialogPrimary').onclick=action;$('dialogSecondary').hidden=!secondary;$('dialogSecondary').textContent=secondary||'';$('dialogSecondary').onclick=second||closeModal;$('modal').hidden=false;$('dialogPrimary').focus()}
$('shake').onclick=()=>view3d?.shake();
$('undo').onclick=undo;$('shuffle').onclick=()=>{if(phase!=='playing'||!uses.shuffle)return;uses.shuffle--;deal();history=[];render();say('物品重新排好啦！先凑收纳槽里已有的')};$('hint').onclick=()=>{
 if(phase!=='playing'||!uses.hint)return;
 const held=tray.map(t=>t.type),free=tiles.filter(t=>available(t));
 const next=view3d?view3d.findHint(held):(free.find(t=>held.includes(t.type))||free.find(t=>solution[0]===t.id)||free[0]);
 if(!next){say('先晃一晃或转动盘子，让物品露出来');return;}
 uses.hint--;render();document.querySelector(`[data-id="${next.id}"]`).classList.add('hint');view3d?.hint(next.id);
 say('试试这件'+ITEMS[next.type][1]+'，优先凑已有的物品');
};
$('restart').onclick=()=>openModal('重开这一筛？','本关进度会清空，道具次数也会恢复。','重新开始',()=>start(level),'接着玩',closeModal);
$('help').onclick=()=>openModal('三个一样，就收好','① 点击盘里的立体物品，放进收纳槽。\n② 三个相同的物品会自动消除。\n③ 露出来、能点到的物品都可以拿。\n拖动盘子可以转动视角；点「晃一晃」翻动物品。\n④ 七格装满就失败，清空物品盘抓到鹅！\n每关有 3 次撤回、2 次洗牌、3 次提示。','知道啦',closeModal);
$('sound').onclick=()=>{sound=!sound;$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'关闭音效':'开启音效');$('sound').textContent=sound?'♫':'♪';tone()};
$('modal').addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='playing')closeModal();if(e.key==='Tab'){const buttons=[...$('modal').querySelectorAll('button')].filter(b=>!b.hidden);if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});
start(0);
</script>

<script>
// Procedural models share geometry and materials; no remote models or textures.
(() => {
  const host = $('board');
  if (!window.THREE || !window.CANNON) { say('3D 引擎未能加载，请刷新页面重试'); return; }
  const T = THREE;
  let renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  } catch (error) {
    host.insertAdjacentHTML('beforeend', '<p class="webgl-error">此浏览器无法启动 3D 画面，请开启硬件加速后重试。</p>');
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.domElement.setAttribute('aria-label', '3D 物品盘，点击物品收取，拖动转动视角');
  host.prepend(renderer.domElement);
  const scene = new T.Scene();
  const camera = new T.OrthographicCamera(-7, 7, 7, -7, .1, 100);
  camera.position.set(0, 14, 14);
  camera.lookAt(0, .8, 0);
  const world = new T.Group();
