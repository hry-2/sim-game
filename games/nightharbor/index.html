*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#07080d;color:#c9d4e6;font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;background:#000;display:block}
.box{background:rgba(7,8,13,.72);border:1px solid #1e2a3f;padding:6px 10px}
/* ---- 关卡 HUD ---- */
#hud{position:absolute;left:0;top:0;right:0;padding:10px 14px;display:none;justify-content:space-between;pointer-events:none;text-shadow:0 1px 0 #000}
#hp{width:140px;height:8px;background:#1a1420;border:1px solid #3a2233;margin-top:4px}
#hp i{display:block;height:100%;background:#ff2ea6;width:100%}
#alert{font-weight:bold;letter-spacing:.15em}
#alert.idle{color:#8fd18f}#alert.search{color:#ffb347}#alert.combat{color:#ff4d6d}
#obj{color:#ffd97a}
#hud.walk .box:first-child,#hud.walk .box:last-child,#hud.walk #alert{display:none}
#hud.walk{justify-content:center}
/* ---- 常驻状态条：倒计时和欠款是这个游戏的脊梁，任何时候都看得见 ---- */
#status{position:absolute;right:14px;top:10px;display:none;text-align:right;pointer-events:none;text-shadow:0 1px 0 #000;font-size:11px}
#status.inlevel{top:auto;bottom:10px}
#status b{color:#45f0ff;font-weight:normal}
#status .d{color:#ff8f6d}
#status .r{color:#7d8aa5}
/* ---- 对话 ---- */
#dlg{position:absolute;inset:0;display:none;flex-direction:column;justify-content:flex-end;pointer-events:none}
#dlg .loc{position:absolute;left:0;top:0;padding:10px 16px;color:#7d8aa5;letter-spacing:.16em;font-size:11px;text-shadow:0 1px 0 #000}
#dlg .port{position:absolute;left:20px;bottom:2px;width:192px;height:224px;pointer-events:none;
  background-repeat:no-repeat;image-rendering:pixelated;opacity:0;transition:opacity .16s;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.9))}

#dlg .panel{pointer-events:auto;background:linear-gradient(180deg,rgba(7,8,13,0),rgba(7,8,13,.93) 22%,rgba(7,8,13,.97));
  border-top:1px solid #1e2a3f;padding:16px 22px 14px 228px;max-height:66%;display:flex;flex-direction:column}
@media (max-width:900px){#dlg .port{display:none}#dlg .panel{padding-left:22px}}
#dlg .log{overflow-y:auto;margin-bottom:2px}
#dlg .l{margin:3px 0;max-width:820px}
#dlg .l .who{color:#45f0ff}
#dlg .l .who.pc{color:#ffd97a}
#dlg .l .note{color:#5a6478}
#dlg .l.nar{color:#8a94a8;font-style:italic}
#dlg .l.scr{color:#8fd18f;white-space:pre-wrap;border-left:2px solid #24503a;padding:2px 0 2px 8px;margin:6px 0}
#dlg .l.dim{opacity:.45}
#dlg .opts{margin-top:8px;display:flex;flex-direction:column;gap:2px;max-width:820px}
#dlg .opt{pointer-events:auto;text-align:left;background:none;border:1px solid #1e2a3f;color:#c9d4e6;
  font:inherit;padding:4px 10px;cursor:pointer}
#dlg .opt:hover{border-color:#45f0ff;color:#fff;background:rgba(69,240,255,.06)}
#dlg .opt .k{color:#5a6478;margin-right:8px}
#dlg .opt.locked{color:#4c5468;border-color:#161d2b;cursor:not-allowed;text-decoration:line-through}
#dlg .opt.locked:hover{border-color:#161d2b;background:none;color:#4c5468}
#dlg .hint{margin-top:8px;color:#5a6478;font-size:11px}
/* ---- 全屏卡片：标题 / 结算 ---- */
#ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,5,9,.86)}
#ovl .card{max-width:580px;padding:26px 30px;border:1px solid #2a3b5a;background:#0b0e16;box-shadow:0 0 40px rgba(69,240,255,.08)}
#ovl h1{font-size:26px;letter-spacing:.3em;color:#45f0ff;margin-bottom:4px}
#ovl h2{font-size:12px;color:#7d8aa5;font-weight:normal;letter-spacing:.2em;margin-bottom:18px}
#ovl p{margin:8px 0}
#ovl table{border-collapse:collapse;margin:10px 0 16px}
#ovl td{padding:2px 12px 2px 0}
#ovl td:first-child{color:#7d8aa5}
#ovl kbd{display:inline-block;min-width:22px;text-align:center;padding:0 5px;border:1px solid #3a4b6a;border-bottom-width:2px;border-radius:3px;color:#e8eefc;background:#141a28;font:inherit}
#ovl .go{margin-top:14px;color:#ffd97a}
#ovl .stat{display:flex;gap:22px;margin:12px 0}
#ovl .stat b{display:block;font-size:20px;color:#45f0ff}
#ovl .bonus{color:#8fd18f}#ovl .miss{color:#5a6478;text-decoration:line-through}
#ovl button{font:inherit;background:none;border:1px solid #2a3b5a;color:#c9d4e6;padding:5px 14px;cursor:pointer;margin-right:8px}
#ovl button:hover{border-color:#45f0ff;color:#fff}
#toast{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);color:#ffd97a;font-size:14px;letter-spacing:.1em;text-shadow:0 0 12px #000;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body>

ene":"P0.5","step":10}},{"t":"nar","text":"他把擦好的杯子放下，倒了一杯，推过来。"},{"t":"say","who":"阿鲈","text":"你上去那年我十九。你走的那天六指在我这儿喝到关门，说港区又送走一个。"},{"t":"say","who":"阿鲈","text":"我说小九不一样。"},{"t":"ask","opts":[{"text":"现在呢","goto":"5c","to":{"scene":"P0.5","step":14}},{"text":"六指说对了","goto":"5d","to":{"scene":"P0.5","step":17}}]},{"t":"say","who":"阿鲈","text":"现在你回来了。"},{"t":"say","who":"阿鲈","text":"回来的人不多。"},{"t":"goto","goto":"结束序章","to":{"exit":"结束序章"}},{"t":"say","who":"阿鲈","text":"六指说对的事多了。他也说过我这店撑不过三年。"},{"t":"nar","text":"他看了一眼吧台后面的墙，墙上有一块比周围新的地方，像是摘掉了什么。"},{"t":"say","who":"阿鲈","text":"喝完再走。第一杯不要钱。"},{"t":"goto","goto":"结束序章","to":{"exit":"结束序章"}},{"t":"nar","text":"（序章结束。三个中间人的任务同时开放。）"}],"labels":{"5a":7,"5b":10,"5c":14,"5d":17}}],"after":[{"who":"桂姐","text":"「昨天的面钱不急。」","quest":"P0","need":"flag.told_truth"},{"who":"桂姐","text":"「你昨天说换班。」（停顿）「豆包都知道了。」","quest":"P0","need":"flag.lied_gui"},{"who":"桂姐","text":"什么都不说，多给一勺卤","quest":"P0","need":"flag.quiet"},{"who":"豆包","text":"「九{哥","quest":"P0","need":"flag.told_doubao"}]},"M1":{"key":"M1","title":"旧钥匙","scenes":[{"id":"M1.1","title":"见许维安：穹顶外围，一家有包厢的餐厅","steps":[{"t":"nar","text":"许维安已经点好了菜。两副筷子。七年前面试完他也是带陈九来的这里。"},{"t":"say","who":"许维安","text":"坐。这家的鱼还是老样子。"},{"t":"say","who":"许维安","text":"先说清楚，裁员那件事不是我的意思。上面要数字，我给的名单里没有你。"},{"t":"ask","opts":[{"text":"晨曦说你签了","need":"flag.asked_xu","set":"rep.corp-=5","goto":"a1","to":{"scene":"M1.1","step":4}},{"text":"我知道","goto":"a2","to":{"scene":"M1.1","step":8}},{"text":"说事吧","set":"flag.blunt=1","goto":"a3","to":{"scene":"M1.1","step":10}}]},{"t":"nar","text":"许维安夹菜的手停了半秒。"},{"t":"say","who":"许维安","text":"签是一定要签的。不签，名单就是别人来定。"},{"t":"say","who":"许维安","text":"你在内审组三年，这个道理不用我讲。"},{"t":"goto","goto":"a3","to":{"scene":"M1.1","step":10}},{"t":"say","who":"许维安","text":"你一直是明白人。七年前我在港区看一圈，就你一个不问工资先问合同。"},{"t":"goto","goto":"a3","to":{"scene":"M1.1","step":10}},{"t":"say","who":"许维安","text":"有件小事。安保部老楼那边有间档案室，里面有块盘，我要拿出来。"},{"t":"say","who":"许维安","text":"走流程要三个星期。我没有三个星期。"},{"t":"say","who":"许维安","text":"你那套旧门禁还在——那栋楼的锁老，没换。"},{"t":"say","who":"陈九","text":"里面是什么。"},{"t":"say","who":"许维安","text":"一些不该留在公司系统里的东西。"},{"t":"say","who":"许维安","text":"你拿出来，交给我，不看。事成之后我帮你把账户接回来——不是宽限期，是正式的。债也可以谈。"},{"t":"ask","opts":[{"text":"我看一眼","goto":"a4","to":{"scene":"M1.1","step":17}},{"text":"好","set":"flag.m1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"我不做这种事","need":"flag.blunt","goto":"a5","to":{"scene":"M1.1","step":20}}]},{"t":"say","who":"许维安","text":"你要是看了，我们俩就都得走另一条路。"},{"t":"say","who":"许维安","text":"我不建议。"},{"t":"ask","opts":[{"text":"那我不看","set":"flag.m1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"那算了","goto":"a5","to":{"scene":"M1.1","step":20}}]},{"t":"say","who":"许维安","text":"小九。"},{"t":"nar","text":"他很少这么叫。上一次是七年前在港区。"},{"t":"say","who":"许维安","text":"你剩多少天？"},{"t":"nar","text":"他没等回答。"},{"t":"say","who":"许维安","text":"卡留着。想通了随时。"},{"t":"nar","text":"（M1 暂停。三天后自动重开，再来的时候许维安会说\"我等着你\"。）"}],"labels":{"a1":4,"a2":8,"a3":10,"a4":17,"a5":20}},{"id":"M1.2","title":"任务：安保部老楼","steps":[{"t":"note","text":"关卡：三层楼，两条巡逻路线（外包保安，不认识陈九），门禁全部是陈九的旧密码——走到任何一扇门前按 E 都会直接开，这是本关的教学：你的价值就是这些门。"},{"t":"note","text":"可选目标：不被发现。不杀人（他们是外包的，跟公司没关系）。"},{"t":"nar","text":"到达档案室。硬盘在一个上锁的抽屉里，抽屉是旧密码。"},{"t":"nar","text":"义眼视野角落弹出一行：检测到可读存储 · 是否挂载。"},{"t":"ask","opts":[{"text":"挂载","set":"flag.m1_looked=1","goto":"硬盘内容","to":{"scene":"M1.2","step":5}},{"text":"不挂载","goto":"撤离","to":{"exit":"撤离"}}]},{"t":"screen","lines":["明烛安保 · 内部调查 · 结案报告（草稿）","调查对象：许维安","调查负责人：陈九 / 林可","状态：负责人（陈九）已优化，案卷封存"]},{"t":"nar","text":"倒计时在角落跳了一下。"}],"labels":{"（拿到硬盘时）":3,"硬盘内容":5}},{"id":"M1.3","title":"交硬盘：同一家餐厅","steps":[{"t":"say","who":"许维安","text":"顺利？"},{"t":"say","who":"陈九","text":"顺利。"},{"t":"say","who":"许维安","text":"看了？","need":"flag.m1_looked"},{"t":"ask","opts":[{"text":"看了","set":"flag.m1_admit=1","goto":"b1","to":{"scene":"M1.3","step":5}},{"text":"没看","set":"flag.m1_lied=1","goto":"b2","to":{"scene":"M1.3","step":10}}],"need":"flag.m1_looked"},{"t":"goto","goto":"b3","need":"!(flag.m1_looked)","to":{"scene":"M1.3","step":16}},{"t":"nar","text":"许维安把硬盘收进包里。很久。"},{"t":"say","who":"许维安","text":"那你现在知道了。"},{"t":"say","who":"许维安","text":"知道了也好。你我之间就不用演了。"},{"t":"say","who":"许维安","text":"账户的事我照办。下一件事，你自己决定接不接。"},{"t":"goto","set":"rep.corp+=10; days+=15","goto":"结算","to":{"exit":"结算"}},{"t":"say","who":"许维安","text":"好。"},{"t":"nar","text":"他看了你一眼，你知道他知道。"},{"t":"say","who":"许维安","text":"七年了，你撒谎还是不看人。"},{"t":"say","who":"许维安","text":"账户的事我照办。"},{"t":"nar","text":"（flag.m1_lied 在 M4 会被他拿出来讲。）"},{"t":"goto","set":"rep.corp+=10; days+=15","goto":"结算","to":{"exit":"结算"}},{"t":"say","who":"许维安","text":"你还是老样子。"},{"t":"say","who":"许维安","text":"所以我才找你。"},{"t":"say","who":"许维安","text":"账户的事我照办。过几天还有一件。"},{"t":"goto","set":"rep.corp+=15; days+=15","goto":"结算","to":{"exit":"结算"}}],"labels":{"b1":5,"b2":10,"b3":16}}],"after":[{"who":"桂姐","text":"「阿鲈说你昨晚穿了公司那套衣服出去。」（不等回答）「面好了。」","quest":"M1"},{"who":"豆包","text":"「九{哥","quest":"M1","need":"flag.m1_looked"},{"who":"老韩","text":"「听说老楼昨晚死了两个外包的。外包的，啧。」","quest":"M1","needLabel":"任务里杀了人"},{"who":"林可的消息","text":"「你去了老楼。」只有这四个字。","quest":"M1","need":"flag.m1_looked"}]},"G1":{"key":"G1","title":"第一针","scenes":[{"id":"G1.1","title":"见六指：潮声酒吧后巷","steps":[{"t":"nar","text":"六指靠在墙上抽烟。左手五根手指，烟夹在无名指和小指之间。"},{"t":"say","who":"六指","text":"小九。回来了。"},{"t":"say","who":"六指","text":"七年前你走的时候我就说，穹顶不留港区的人。"},{"t":"say","who":"六指","text":"我不跟你绕。你剩多少天？"},{"t":"ask","opts":[{"text":"八十几","goto":"c1","to":{"scene":"G1.1","step":5}},{"text":"你管这个？","goto":"c2","to":{"scene":"G1.1","step":7}}]},{"t":"say","who":"六指","text":"八十几。够我把你养熟了。"},{"t":"goto","goto":"c3","to":{"scene":"G1.1","step":10}},{"t":"say","who":"六指","text":"港区所有人剩几天我都管。这是我吃饭的本事。"},{"t":"say","who":"六指","text":"你在上面查别人的时候，我在下面数日子。一样的活。"},{"t":"goto","goto":"c3","to":{"scene":"G1.1","step":10}},{"t":"say","who":"六指","text":"我这儿有固件。不是环宇那种，是破解的。一针三十天，价钱是公司的三分之一。"},{"t":"say","who":"六指","text":"坏处我也直说：十针里坏一针。坏了不是死，是难受。白大夫能修。"},{"t":"say","who":"六指","text":"今晚有一趟货要送到十七栋。你陪小陆走一趟，回来第一针我请。"},{"t":"say","who":"陈九","text":"小陆是谁。"},{"t":"say","who":"六指","text":"陆妈妈的儿子。你走那年他十二，天天在你屁股后面跑。"},{"t":"say","who":"六指","text":"孩子刚上手，毛躁。你就走在他后面，别让他出事。"},{"t":"ask","opts":[{"text":"好","set":"flag.g1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"我不带小孩","goto":"c4","to":{"scene":"G1.1","step":17}}]},{"t":"say","who":"六指","text":"他十九。"},{"t":"say","who":"六指","text":"你十九的时候在干什么？"},{"t":"say","who":"陈九","text":"站门。"},{"t":"say","who":"六指","text":"在穹顶给人站门。他在港区给自己人跑腿。"},{"t":"say","who":"六指","text":"去不去？"},{"t":"ask","opts":[{"text":"去","set":"flag.g1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"不去","goto":"c5","to":{"scene":"G1.1","step":23}}]},{"t":"say","who":"六指","text":"行。"},{"t":"say","who":"六指","text":"卡我不留，港区人找我不用卡。"},{"t":"nar","text":"（G1 暂停。三天后重开，重开时六指第一句：\"小陆昨天自己走了一趟，没出事。你的运气。\"）"}],"labels":{"c1":5,"c2":7,"c3":10,"c4":17,"c5":23}},{"id":"G1.2","title":"任务：从潮声到十七栋","steps":[{"t":"note","text":"关卡：三条巷子。小陆走在前面，你跟着。没有敌人。"},{"t":"nar","text":"巷子中间有一台明烛的巡逻无人机——陈九认得它的巡逻间隔，屏幕上会提示：它每 12 秒转一次头。教玩家读节奏。"},{"t":"nar","text":"小陆边走边说："},{"t":"say","who":"小陆","text":"九{哥|姐}，你还记得我不？"},{"t":"say","who":"陈九","text":"记得。"},{"t":"say","who":"小陆","text":"你走那天我去车站了。你没看见我。"},{"t":"ask","opts":[{"text":"看见了","goto":"d1","to":{"scene":"G1.2","step":7}},{"text":"没看见","goto":"d2","to":{"scene":"G1.2","step":11}}]},{"t":"say","who":"小陆","text":"骗人。你看见了怎么不挥手。"},{"t":"say","who":"陈九","text":"……"},{"t":"say","who":"小陆","text":"算了。你们上去的人都这样，我妈说的。"},{"t":"goto","goto":"d3","to":{"scene":"G1.2","step":15}},{"t":"say","who":"小陆","text":"哦。"},{"t":"nar","text":"沉默走了半条巷子。"},{"t":"say","who":"小陆","text":"我妈不让我进六指这儿。可她自己的义腿也是六指的针。"},{"t":"goto","goto":"d3","to":{"scene":"G1.2","step":15}},{"t":"walk","key":"alley","hint":"跟着小陆穿过三条巷子，走到十七栋楼下"},{"t":"nar","text":"十七栋楼下。交货的人没来。小陆等得不耐烦。"},{"t":"say","who":"小陆","text":"他说八点。"},{"t":"nar","text":"一辆车灯亮了。不是接货的车，是澜海的巡查车。"},{"t":"say","who":"小陆","text":"操——"},{"t":"nar","text":"他把货塞进嘴里。三支固件针。"},{"t":"say","who":"陈九","text":"吐出来。"},{"t":"say","who":"小陆","text":"他们要查的！"},{"t":"nar","text":"车停了。两个澜海的巡查下来。"},{"t":"say","who":"巡查甲","text":"站住。港区禁夜令你们不知道？"},{"t":"say","who":"巡查甲","text":"包打开。"},{"t":"nar","text":"（这里可以打。也可以不打。）"},{"t":"ask","opts":[{"text":"明烛安保，编号 A-77120，这孩子跟我的","need":"flag.walk_alone || rep.corp>=5","set":"flag.g1_badge=1","goto":"d4","to":{"scene":"G1.2","step":28}},{"text":"打","action":"战斗","goto":"d5","to":{"scene":"G1.2","step":35}},{"text":"举手","goto":"d6","to":{"scene":"G1.2","step":40}}]},{"t":"nar","text":"巡查甲的义眼扫了你一下。工牌是撤了，但编号还在明烛的名册上——宽限期的意思。"},{"t":"say","who":"巡查甲","text":"……明烛的管到我们澜海地界了？"},{"t":"say","who":"巡查乙","text":"算了算了，别惹那边。"},{"t":"nar","text":"车走了。"},{"t":"say","who":"小陆","note":"（吐出针，三支，一支已经破了）","text":"九{哥|姐}……你还能用那个号？"},{"t":"say","who":"陈九","text":"还有八十几天能用。破了的那支别用。"},{"t":"goto","goto":"回潮声","to":{"scene":"G1.3","step":0}},{"t":"nar","text":"两个巡查倒下。澜海的车会记下你的脸。"},{"t":"nar","text":"小陆吐出针。三支，一支破了，他自己手也抖。"},{"t":"say","who":"小陆","text":"我……我没打过人。"},{"t":"say","who":"陈九","text":"你没打。是我打的。"},{"t":"goto","set":"flag.g1_killed=1; rep.street-=5","goto":"回潮声","to":{"scene":"G1.3","step":0}},{"t":"nar","text":"他们搜了包，搜了你，没搜小陆的嘴。走的时候踹了小陆一脚。"},{"t":"say","who":"巡查甲","text":"港区的狗。"},{"t":"nar","text":"车走了。小陆吐出针，两支破了。"},{"t":"say","who":"小陆","text":"对不起。"},{"t":"ask","opts":[{"text":"没事","goto":"d6a","to":{"scene":"G1.2","step":45}},{"text":"下次别吞","goto":"d6b","to":{"scene":"G1.2","step":48}}]},{"t":"say","who":"小陆","text":"六指会扣我的。"},{"t":"say","who":"陈九","text":"我说是我弄破的。"},{"t":"goto","set":"flag.g1_cover=1","goto":"回潮声","to":{"scene":"G1.3","step":0}},{"t":"say","who":"小陆","text":"那要不吞了他们搜出来我更完。"},{"t":"say","who":"陈九","text":"……"},{"t":"goto","goto":"回潮声","to":{"scene":"G1.3","step":0}}],"labels":{"d1":7,"d2":11,"d3":15,"d4":28,"d5":35,"d6":40,"d6a":45,"d6b":48}},{"id":"G1.3","title":"回潮声：六指","steps":[{"t":"say","who":"六指","text":"货呢。"},{"t":"nar","text":"小陆把针放在桌上。"},{"t":"say","who":"陈九","text":"我弄破的。","need":"flag.g1_cover"},{"t":"say","who":"六指","text":"你？","need":"flag.g1_cover"},{"t":"say","who":"陈九","text":"手滑。","need":"flag.g1_cover"},{"t":"nar","text":"六指看了小陆一眼，小陆盯着地。","need":"flag.g1_cover"},{"t":"say","who":"六指","text":"行。小九手滑。","need":"flag.g1_cover"},{"t":"say","who":"六指","text":"小陆，回去看你妈。","need":"flag.g1_cover"},{"t":"set","set":"rep.gang+=5; flag.saved_xiaolu=1","need":"flag.g1_cover"},{"t":"say","who":"六指","text":"小陆。","need":"!(flag.g1_cover)"},{"t":"say","who":"小陆","text":"澜海的车……","need":"!(flag.g1_cover)"},{"t":"say","who":"六指","text":"我问你货。","need":"!(flag.g1_cover)"},{"t":"say","who":"小陆","text":"我吞了。","need":"!(flag.g1_cover)"},{"t":"say","who":"六指","text":"吞了。","need":"!(flag.g1_cover)"},{"t":"nar","text":"六指没说话。他把两支破的推给小陆。","need":"!(flag.g1_cover)"},{"t":"say","who":"六指","text":"这两针记你账上。回去看你妈。","need":"!(flag.g1_cover)"},{"t":"set","set":"rep.gang+=5","need":"!(flag.g1_cover)"},{"t":"nar","text":"小陆走后。"},{"t":"say","who":"六指","text":"第一针，我请。白大夫那儿，随时。"},{"t":"say","who":"六指","text":"澜海的人你打了两个。他们记脸的。","need":"flag.g1_killed"},{"t":"say","who":"六指","text":"以后走码头，戴个帽子。","need":"flag.g1_killed"},{"t":"say","who":"六指","text":"你报了明烛的号。","need":"flag.g1_badge"},{"t":"say","who":"六指","text":"好用。但下次我就不知道你是哪边的了。","need":"flag.g1_badge"},{"t":"set","set":"rep.corp+=3","need":"flag.g1_badge"},{"t":"nar","text":"吧台后面，阿鲈一直在擦同一个杯子。你走的时候他说："},{"t":"say","who":"阿鲈","text":"小陆那孩子，你走以后就没人管了。"},{"t":"say","who":"阿鲈","text":"今天有了。","need":"flag.saved_xiaolu"}],"labels":{}}],"after":[{"who":"陆妈妈","text":"「小九？」（她看了很久）「你走那年小陆哭了一晚上。」（停顿）「他说你手滑。谢谢你的手。」","quest":"G1","need":"flag.saved_xiaolu"},{"who":"陆妈妈","text":"「小陆昨晚没回来。」","quest":"G1","need":"!flag.saved_xiaolu"},{"who":"大勇","text":"「昨晚死了两个澜海巡查。今天我们全码头挨个查。」","quest":"G1","need":"flag.g1_killed"},{"who":"桂姐","text":"「白大夫说你在她那儿排了号。」（她没有再说话，卤少了半勺）","quest":"G1"}]},"N1":{"key":"N1","title":"看东西","scenes":[{"id":"N1.1","title":"见老鲸：报废疏浚船「沪疏 07」","steps":[{"t":"nar","text":"船搁浅在新陆边缘的滩上，锈了一半。舷梯下有一个铃。"},{"t":"nar","text":"玩家拉铃。舱门开了一半。"},{"t":"say","who":"老鲸","note":"（从里面）","text":"进来。鞋脱了。"},{"t":"nar","text":"舱里堆满显示器，全亮着，每个都在滚字。老鲸背对着门。角落有一张折叠床，床上有人睡过的痕迹，但没人。"},{"t":"say","who":"老鲸","text":"陈九。二十五岁。明烛苗子计划第九期。右臂环宇 M7，双眼环宇 V4 定制，脊柱环宇 S2。宽限期八十七天。未偿二十一万八千四。"},{"t":"say","who":"老鲸","text":"我念错了吗？"},{"t":"ask","opts":[{"text":"你怎么知道的","goto":"e1","to":{"scene":"N1.1","step":7}},{"text":"没有","goto":"e2","to":{"scene":"N1.1","step":10}}]},{"t":"say","who":"老鲸","text":"你的义眼每三十天跟环宇握一次手。握手的时候把你全身都报一遍。"},{"t":"say","who":"老鲸","text":"环宇知道。所以我也知道。"},{"t":"goto","goto":"e3","to":{"scene":"N1.1","step":12}},{"t":"say","who":"老鲸","text":"好。你不惊讶。这是我找你的第一个理由。"},{"t":"goto","goto":"e3","to":{"scene":"N1.1","step":12}},{"t":"nar","text":"他转过来。左眼是义眼，右眼是真的，有白内障。"},{"t":"say","who":"老鲸","text":"我不给你固件。我不是六指。"},{"t":"say","who":"老鲸","text":"我给你看东西。看完你自己决定要不要再来。"},{"t":"say","who":"老鲸","text":"新陆东边有座信号塔，塔下面有个白色的箱子。你去，拍一张箱子上的编号。"},{"t":"say","who":"陈九","text":"为什么。"},{"t":"say","who":"老鲸","text":"因为你去了才会问对的问题。"},{"t":"ask","opts":[{"text":"行","set":"flag.n1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"我不做不知道为什么的事","goto":"e4","to":{"scene":"N1.1","step":19}}]},{"t":"say","who":"老鲸","text":"你在穹顶做了七年不知道为什么的事。"},{"t":"say","who":"老鲸","text":"这一件不一样的地方是，做完你会知道。"},{"t":"ask","opts":[{"text":"行","set":"flag.n1_agree=1","goto":"任务开始","to":{"exit":"任务开始"}},{"text":"不去","goto":"e5","to":{"scene":"N1.1","step":22}}]},{"t":"say","who":"老鲸","text":"门在那儿。鞋在门口。"},{"t":"nar","text":"（N1 暂停。三天后重开。重开时他第一句：\"第三十天你会回来的。他们都是第三十天回来。\"）"}],"labels":{"e1":7,"e2":10,"e3":12,"e4":19,"e5":22}},{"id":"N1.2","title":"任务：信号塔","steps":[{"t":"note","text":"关卡：一片工地，围栏，两个澜海的守夜人，一条狗（机械犬，有噪音探测）。塔下白箱子上有一台摄像头。"},{"t":"note","text":"可选目标：不被发现。不破坏任何东西。"},{"t":"nar","text":"玩家靠近白箱子，义眼自动对焦。箱子上："},{"t":"screen","lines":["环宇义体 · 固件签名中继 · HK-E-014","维护：明烛安保外包"]},{"t":"nar","text":"拍照。义眼弹出：已保存。然后弹出第二行，不是系统字体，是手打的："},{"t":"screen","lines":["> 看见\"明烛\"两个字了吗。 —— 鲸"]},{"t":"nar","text":"有人在你眼睛里。这是第一次。"},{"t":"ask","opts":[{"text":"（对着空气）你什么时候进来的","goto":"f1","to":{"scene":"N1.2","step":8}},{"text":"（不说话，撤离）","goto":"撤离","to":{"exit":"撤离"}}]},{"t":"nar","text":"义眼里打字："},{"t":"screen","lines":["> 你拉铃的时候。别紧张，我只看你看的。","> 现在往回走。狗醒了。"]},{"t":"nar","text":"打字的速度很快，快得不像六十二岁的人。玩家现在不会注意到这一点。"},{"t":"nar","text":"机械犬确实醒了。撤离。"}],"labels":{"f1":8}},{"id":"N1.3","title":"回船","steps":[{"t":"say","who":"老鲸","text":"编号。"},{"t":"say","who":"陈九","text":"HK-E-014。"},{"t":"say","who":"老鲸","text":"全城有四十一个这种箱子。每个箱子每三十天给一片区的义体签一次名。"},{"t":"say","who":"老鲸","text":"签名从环宇的服务器发出来，经过澜海的光缆，由明烛的外包维护。"},{"t":"say","who":"老鲸","text":"三家公司，一把锁。"},{"t":"say","who":"陈九","text":"所以呢。"},{"t":"say","who":"老鲸","text":"所以锁是在城里的，不是在天上的。"},{"t":"say","who":"老鲸","text":"城里的东西，人就摸得到。"},{"t":"nar","text":"他把一杯茶推过来。"},{"t":"say","who":"老鲸","text":"第三十天你会降级。到时候来，我给你打个补丁。不要钱。"},{"t":"say","who":"老鲸","text":"要的是别的。到时候说。"},{"t":"ask","opts":[{"text":"什么别的","goto":"f2","to":{"scene":"N1.3","step":12}},{"text":"到时候说","goto":"结算","to":{"exit":"结算"}}]},{"t":"say","who":"老鲸","text":"让我们住在你眼睛里。"},{"t":"say","who":"老鲸","text":"像刚才那样。但是一直。"},{"t":"say","who":"陈九","text":"……\"我们\"？"},{"t":"say","who":"老鲸","text":"三十天。你有三十天想。"},{"t":"goto","set":"rep.street+=5; flag.n1_done=1","goto":"结算","to":{"exit":"结算"}}],"labels":{"f2":12}}],"after":[{"who":"桂姐","text":"「你昨晚上新陆去了？」（她放下碗）「小九，那边的滩，晚上会涨。你小时候差点淹在那儿。」","quest":"N1"},{"who":"豆包","text":"「九{哥","quest":"N1"},{"who":"大勇","text":"「昨晚工地进贼了，今天澜海加了两条狗。」","quest":"N1","needLabel":"任务里被发现"}]},"R1":{"key":"R1","title":"潮声的账","scenes":[{"id":"R1.1","title":"潮声的账","steps":[{"t":"nar","text":"第 8 天以后，你去潮声。店关着，门没锁。阿鲈一个人坐在吧台外面——客人的位置。他面前的墙上那块新的地方，现在挂了一张纸：潮帮 · 产业登记 · 潮声酒吧 · 抵押人：鲈。"},{"t":"say","who":"阿鲈","text":"坐。今天不开门。"},{"t":"say","who":"阿鲈","text":"六指昨天来贴的。以前他不贴，因为不用贴，港区没人不知道。"},{"t":"say","who":"阿鲈","text":"昨天贴了。就是要让我知道他随时能收。"},{"t":"ask","opts":[{"text":"为什么是昨天","goto":"g1","to":{"scene":"R1.1","step":5}},{"text":"你欠他多少","goto":"g2","to":{"scene":"R1.1","step":9}}]},{"t":"say","who":"阿鲈","text":"因为你回来了。"},{"t":"say","who":"阿鲈","text":"你在我这儿坐了三个晚上。六指觉得我在替你传话，替谁都没事，替你不行。"},{"t":"say","who":"阿鲈","text":"他说小九是穹顶的人，小九的话经过我的店，他就得知道每一句。"},{"t":"goto","goto":"g2","to":{"scene":"R1.1","step":9}},{"t":"say","who":"阿鲈","text":"四万二。三年前是三万，我爹的固件钱。"},{"t":"say","who":"阿鲈","text":"我爹撑了四针，第五针没撑到。钱花完了，人没留下，店抵出去了。"},{"t":"nar","text":"他第一次看你。"},{"t":"say","who":"阿鲈","text":"我从来没求过人。这是第一次。"},{"t":"say","who":"阿鲈","text":"帮我把店赎回来。不是要你的钱，你没有。是要你去跟六指谈。他听你的，他现在需要你。"},{"t":"ask","opts":[{"text":"我去谈","goto":"g3","to":{"scene":"R1.1","step":15}},{"text":"六指不会因为我改主意","goto":"g4","to":{"scene":"R1.1","step":18}},{"text":"你可以不要这个店","goto":"g5","to":{"scene":"R1.1","step":23}}]},{"t":"say","who":"阿鲈","text":"谢了。"},{"t":"say","who":"阿鲈","text":"谈成谈不成，今晚这杯我请。"},{"t":"goto","goto":"任务：跟六指谈","to":{"scene":"R1.2","step":0}},{"t":"say","who":"阿鲈","text":"那你就是白问了。"},{"t":"nar","text":"他站起来，把纸从墙上摘下来，又贴回去。"},{"t":"say","who":"阿鲈","text":"算了。当我没说。"},{"t":"nar","text":"（love.alu 不变。R1 关闭三天，重开时他说：\"上次的事，忘了吧。\"）"},{"t":"goto","set":"flag.r1_defer=1","goto":"结算","to":{"exit":"结算"}},{"t":"nar","text":"他愣了一下，然后笑了。"},{"t":"say","who":"阿鲈","text":"这店我爹擦了二十年，我擦了九年。你说不要。"},{"t":"say","who":"阿鲈","text":"……你知道吗，你是第一个这么说的。所有人都觉得我该保住它。"},{"t":"ask","opts":[{"text":"我是说，你不用替谁擦杯子","set":"flag.alu_heard=1","goto":"g6","to":{"scene":"R1.1","step":27}},{"text":"我的意思是有些东西保不住","goto":"g7","to":{"scene":"R1.1","step":31}}]},{"t":"nar","text":"他很久没说话。"},{"t":"say","who":"阿鲈","text":"先帮我赎回来。"},{"t":"say","who":"阿鲈","text":"赎回来了，我再想要不要。"},{"t":"goto","goto":"任务：跟六指谈","to":{"scene":"R1.2","step":0}},{"t":"say","who":"阿鲈","text":"你说得对。"},{"t":"say","who":"阿鲈","text":"但我还是想试一次。帮不帮？"},{"t":"ask","opts":[{"text":"帮","goto":"g3","to":{"scene":"R1.1","step":15}},{"text":"不帮","goto":"g4","to":{"scene":"R1.1","step":18}}]}],"labels":{"g1":5,"g2":9,"g3":15,"g4":18,"g5":23,"g6":27,"g7":31}},{"id":"R1.2","title":"任务：跟六指谈（后巷）","steps":[{"t":"say","who":"六指","text":"阿鲈让你来的。"},{"t":"say","who":"六指","text":"他自己怎么不来？"},{"t":"ask","opts":[{"text":"他来过了，你贴了张纸","goto":"h1","to":{"scene":"R1.2","step":3}},{"text":"他不好开口","goto": // 本仓库的规矩：不用 Math.random。确定性 LCG，同一局重开敌人走位一致，方便复现。
let seed = 20770909;

/* =====================================================================
   全局状态
   所有系统只读写这一个对象：对话的条件、任务结算、街坊台词、结局判定。
   存档就是存它。
   ===================================================================== */
const ST = {
  name: '陈九', gender: 'f',
  day: 1, days: 90,                    // 固件宽限期还剩几天
  money: 120, debt: 218400,
  flags: {}, rep: { corp: 0, gang: 0, street: 0 },
  love: { linke: 0, alu: 0, qingling: 0, bailan: 0 },
  quest: {},                            // key → 'done'
  kills: 0, seen: 0,                    // 上一次任务的战绩，街坊台词要用
};
const UNKNOWN = [];                     // 认不出来的条件/赋值，攒起来给开发看

// 剧本里有些条件是写给人看的散文，给它们一个对照表
const ALIAS = { '任务里杀了人': 'kills>=1', '任务里被发现': 'seen>=1', '无条件': '', '无': '' };

function val(p) {
  const [a, b] = p.split('.');
  if (a === 'flag') return ST.flags[b] ? 1 : 0;
  if (a === 'rep') return ST.rep[b] || 0;
  if (a === 'love') return ST.love[b] || 0;
  if (p === 'money') return ST.money;
  if (p === 'days') return ST.days;
  if (p === 'day') return ST.day;
  if (p === 'kills') return ST.kills;
  if (p === 'seen') return ST.seen;
  UNKNOWN.push('读不出的量：' + p); return 0;
}
// 条件求值。不用 eval —— 只支持剧本实际用到的那点语法。
function need(e) {
  if (!e) return true;
  e = String(e).trim();
  if (ALIAS[e] != null) e = ALIAS[e];
  if (!e) return true;
  if (e.startsWith('!(') && e.endsWith(')')) return !need(e.slice(2, -1));
  if (e.startsWith('!')) return !need(e.slice(1));
  if (e.includes('||')) return e.split('||').some(need);
  if (e.includes('&&')) return e.split('&&').every(need);
  const m = e.match(/^([a-z][a-z0-9_.]*)\s*(>=|<=|==|>|<)\s*(-?\d+)$/i);
  if (m) {
    const v = val(m[1]), n = +m[3], op = m[2];
    return op === '>=' ? v >= n : op === '<=' ? v <= n : op === '==' ? v === n : op === '>' ? v > n : v < n;
  }
  if (/^[a-z][a-z0-9_.]*$/i.test(e)) return !!val(e);
  UNKNOWN.push('看不懂的条件：' + e);
  return true;                          // 认不出来就放行，宁可多给一个选项也别卡住玩家
}
function apply(set) {
  if (!set) return;
  for (const one of String(set).split(/[;；]/)) {
    const s = one.trim(); if (!s) continue;
    const m = s.match(/^([a-z][a-z0-9_.]*)\s*(\+=|-=|=)\s*(-?\d+)$/i);
    if (!m) { UNKNOWN.push('看不懂的赋值：' + s); continue; }
    const [a, b] = m[1].split('.'), n = +m[3], op = m[2];
    const bag = a === 'flag' ? ST.flags : a === 'rep' ? ST.rep : a === 'love' ? ST.love : null;
    const cur = bag ? (bag[b] || 0) : (m[1] === 'money' ? ST.money : m[1] === 'days' ? ST.days : null);
    if (cur === null) { UNKNOWN.push('写不了的量：' + s); continue; }
    let v = op === '=' ? n : op === '+=' ? cur + n : cur - n;
    if (a === 'love') v = clamp(v, 0, 3);   // 一拍最多一点，四拍到顶
    if (bag) bag[b] = v; else if (m[1] === 'money') ST.money = v; else ST.days = v;
  }
  syncStatus();
}
// {哥|姐} 按玩家选的性别替换；主角名字统一走 ST.name
const fmt = s => String(s).replace(/\{(.+?)\|(.+?)\}/g, (_, a, b) => ST.gender === 'm' ? a : b)
  .replace(/陈九/g, () => ST.name);

function dlgClose() { DLG.active = false; el('dlg').style.display = 'none'; }

function play(id, at) {
  const f = scene(id);
  if (!f) { toast('缺一场：' + id); return hub(); }
  DLG.q = f.q; DLG.sc = f.s; DLG.custom = null;
  DLG.i = typeof at === 'string' ? (f.s.labels[at] || 0) : (at || 0);
  DLG.lines = []; DLG.opts = null; DLG.type = null;
  dlgOpen((SCENE[id] || {}).where);
  advance();
}
// 自造一场对话（港区去处、次日街坊）——不走剧本数据
function playCustom(o) {
  DLG.q = null; DLG.sc = null; DLG.custom = o;
  DLG.lines = o.lines || []; DLG.opts = null; DLG.type = null;
  dlgOpen(o.where);
  if (o.opts) DLG.opts = o.opts.filter(x => need(x.need));
  paint();
}

// 走下一步。碰到提问就停下等人选。
function advance() {
  if (DLG.type) { DLG.type.i = DLG.type.n; DLG.type = null; paint(); return; }   // 打字机没打完 → 一次打完
  if (DLG.opts) return;
  const sc = DLG.sc;
  if (!sc) { if (DLG.custom && DLG.custom.then) { const t = DLG.custom.then; DLG.custom = null; return goExit(t); } return; }
  while (DLG.i < sc.steps.length) {
    const st = sc.steps[DLG.i++];
    if (st.need && !need(st.need)) continue;          // 条件不满足的整段跳过
    if (st.t === 'note') continue;                    // 写给做关卡的人看的，玩家不看
    if (st.t === 'set') { apply(st.set); continue; }
    if (st.t === 'goto') { apply(st.set); return jump(st); }
    if (st.t === 'walk') return startWalk(st, { scene: sc.id, step: DLG.i, lines: DLG.lines.slice() });
    if (st.t === 'ask') {
      DLG.opts = st.opts;                             // 不满足的选项也要显示，只是灰掉
      paint(); return;
    }
    DLG.lines.push(st);
    DLG.type = { i: 0, n: (st.text || (st.lines || []).join('\n')).length, t: 0 };
    paint(); return;
  }
  goExit((SCENE[sc.id] || {}).then || 'hub');
}
function jump(st) {
  if (st.action === '战斗') DLG.lines.push({ t: 'nar', text: '——（交火。两个澜海的巡查倒下了。这一段的关卡还没做，先记在账上。）' });
  const to = st.to || {};
  if (to.exit) {
    const on = (SCENE[DLG.sc.id] || {}).on || {};
    return goExit(on[to.exit] || to.exit);
  }
  // 换场景就是换地点，对话记录清空重新开始；只有本场内的锚点跳转才留着上面说过的话。
  // （走位段是同一场戏被打断，由 endWalk 负责把话接回去。）
  if (to.scene && to.scene !== DLG.sc.id) return play(to.scene, to.step);
  DLG.i = to.step != null ? to.step : DLG.i;
  return advance();
}
function pick(k) {
  if (!DLG.opts) return;
  const o = DLG.opts[k];
  if (!o || !need(o.need)) return;
  DLG.opts = null;
  if (o.go) { dlgClose(); return o.go(); }            // 自造选项：直接跑函数
  DLG.lines.push({ t: 'pc', text: o.text });
  apply(o.set);
  if (o.to || o.action) return jump(o);
  return advance();
}
// 出口：交给场次图解释
function goExit(x) {
  if (!x) return hub();
  if (x === 'hub') { dlgClose(); return hub(); }
  if (x === 'exfil') return exfil();
  if (x.startsWith('level:')) { dlgClose(); return startLevel(x.slice(6)); }
  if (x.startsWith('done:')) return questDone(x.slice(5));
  if (SCENE[x]) return play(x);
  toast('场次图没定义的出口：' + x); dlgClose(); return hub();
}

const PC = new Set(['陈九']);                          // 主角的台词右对齐、换个颜色
function paint() {
  const log = el('dlg').querySelector('.log');
  log.innerHTML = DLG.lines.map((l, k) => {
    const last = k === DLG.lines.length - 1;
    let body;
    if (l.t === 'screen') {
      const txt = l.lines.join('\n');
      body = `<div class="l scr${last ? '' : ' dim'}">${esc(cut(txt, last))}</div>`;
    } else if (l.t === 'nar') {
      body = `<div class="l nar${last ? '' : ' dim'}">${esc(cut(fmt(l.text), last))}</div>`;
    } else if (l.t === 'pc') {
      body = `<div class="l${last ? '' : ' dim'}"><span class="who pc">${esc(ST.name)}</span> ${esc(fmt(l.text))}</div>`;
    } else {
      const who = PC.has(l.who) ? ST.name : fmt(l.who);
      body = `<div class="l${last ? '' : ' dim'}"><span class="who${PC.has(l.who) ? ' pc' : ''}">${esc(who)}</span>`
        + (l.note ? `<span class="note">${esc(l.note)}</span>` : '') + ` ${esc(cut(fmt(l.text), last))}</div>`;
    }
    return body;
  }).join('');
  log.scrollTop = log.scrollHeight;

  // 立绘：跟着最后一句有主的台词换。闸机、广播这种没有脸的就不显示。
  const spk = [...DLG.lines].reverse().find(l => l.who || l.t === 'pc');

  } else {
    ob.innerHTML = '';

  }
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const cut = (s, last) => (last && DLG.type) ? s.slice(0, DLG.type.i) : s;
function dlgTick(dt) {
  if (!DLG.type) return;

  if (DLG.type.i >= DLG.type.n) { DLG.type = null; paint(); }

const tile = (tx, ty) => (tx < 0 || ty < 0 || tx >= MW || ty >= MH) ? '#' : MAP[ty][tx];
const doorAt = (tx, ty) => DOORS[tx + ',' + ty];
const blocksMove = (tx, ty) => { const t = tile(tx, ty); return t === '#' || t === 'c' || t === 'g'; };
const blocksLOS = (tx, ty) => { const t = tile(tx, ty); if (t === '#') return true; if (t === 'D') return !doorAt(tx, ty).open; return false; };
const blocksShot = (tx, ty) => { const t = tile(tx, ty); if (t === '#' || t === 'c' || t === 'g') return true; if (t === 'D') return !doorAt(tx, ty).open; return false; };

function loadMap(key) {
  const M = MAPS[key];
  MAPSRC = M.src; MW = M.src[0].length; MH = M.src.length;
  MAP = M.src.map(r => r.split(''));
  ROOMS = M.rooms || []; ENEMY_DEF = M.enemies || []; COL = PAL[M.pal] || PAL.industrial;
  DOORS = {}; TERM = EXIT = START = null;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = MAP[y][x];
    if (t === 'D') DOORS[x + ',' + y] = { open: 0, t: 0 };
    if (t === 'T') TERM = { x, y }; if (t === 'X') EXIT = { x, y }; if (t === 'S') START = { x, y };
  }
  // 走位地图最怕目标点走不到 —— 布局改一改就可能封死，开局先自己走一遍
  if (START && TERM && !findPath(START.x, START.y, TERM.x, TERM.y).length)
    console.error('地图 ' + key + '：从起点走不到目标点');
}

const lightAt = (x, y) => { const r = roomAt(x, y); return r ? r.light : .7; };

// 视线：沿线每 4px 采一次，撞到挡视线的格子就断
function los(x0, y0, x1, y1) {
  const d = len(x1 - x0, y1 - y0), n = Math.ceil(d / 4);
  for (let i = 1; i < n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    if (blocksLOS(x / TS | 0, y / TS | 0)) return false;
  }
  return true;
}
// 圆形角色贴墙滑行：X、Y 分开试
function moveActor(a, dx, dy) {
  const r = a.r;
  const free = (x, y) => {
    for (const [ox, oy] of [[-r, -r], [r, -r], [-r, r], [r, r]]) if (blocksMove((x + ox) / TS | 0, (y + oy) / TS | 0)) return false;
    return true;
  };
  if (free(a.x + dx, a.y)) a.x += dx;
  if (free(a.x, a.y + dy)) a.y += dy;
}
function findPath(sx, sy, tx, ty) {
  const key = (x, y) => y * MW + x;
  const prev = new Int32Array(MW * MH).fill(-1);
  const q = [key(sx, sy)]; prev[q[0]] = q[0];
  while (q.length) {
    const k = q.shift(), x = k % MW, y = k / MW | 0;
    if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (blocksMove(nx, ny)) continue;
      const nk = key(nx, ny); if (prev[nk] !== -1) continue;
      prev[nk] = k; q.push(nk);
    }
  }
  let k = key(tx, ty); if (prev[k] === -1) return [];
  const out = [];
  while (k !== key(sx, sy)) { out.push([k % MW, k / MW | 0]); k = prev[k]; }
  return out.reverse();
}

/* ---- 走位段：剧本中间插进来的一小截"自己走" ----
   不是任务：没有敌人、不能开枪、没有结算屏。走到目标点按 E，对话就从那一行往下接。
   这让开局的头五分钟里，"读"和"玩"能交替一次，而不是读一百句再玩。 */
function startWalk(st, resume) {
  if (!MAPS[st.key]) { toast('没有这张走位地图：' + st.key); return advance(); }
  seed = 20770909; loadMap(st.key);
  G.mode = 'walk'; G.walk = Object.assign({ hint: st.hint }, resume);
  P = { x: START.x * TS + 8, y: START.y * TS + 8, r: 5, hp: 100, maxhp: 100, ang: 0, speed: 78,
    crouch: false, fireT: 0, dashT: 0, dashCd: 0, inv: 0, dvx: 0, dvy: 0 };
  G.enemies = []; G.bullets = []; G.parts = []; G.noises = []; G.bodies = []; G.t = 0; G.hackT = 0;
  G.state = 'play';
  dlgClose(); el('ovl').style.display = 'none';
  el('hud').style.display = 'flex'; el('hud').className = 'walk';
  el('obj').textContent = st.hint; el('tip').textContent = '';
  syncStatus();
}
function endWalk() {
  const r = G.walk; G.mode = 'mission'; G.walk = null;
  el('hud').style.display = 'none'; el('hud').className = '';
  play(r.scene, r.step);
  DLG.lines = r.lines.concat(DLG.lines);       // 走之前说过的话留在上面，是同一场戏
  paint();
}

// 摸到东西了 → 播剧本里那一段（M1 是硬盘，N1 是箱子上的编号）
function grabbed() {
  G.grabbed = true; G.state = 'dlg';
  play(MISSION[G.mission].grab);
}
// 那一段结束 → 回关卡，目标变成撤离
function exfil() {
  dlgClose(); G.state = 'play'; el('hud').style.display = 'flex'; G.phase = 'out';
  el('obj').textContent = MISSION[G.mission].objExfil;
  toast('撤离'); syncStatus();
}
function toggleView() {
  FPS.on = !FPS.on;
  if (!FPS.on && document.exitPointerLock) document.exitPointerLock();
  toast(FPS.on ? '第一人称 · 点一下锁鼠标，Q 义眼扫描' : '俯视角');
}
function scan() {
  if (!FPS.on) return toast('义眼扫描只在第一人称下有用（V 切视角）');
  if (FPS.scanT > 0 || FPS.scanCd > 0) return toast('义眼还在冷却');
  FPS.scanT = SCAN_DUR; toast('义眼扫描');
}
function toast(s) { el('toast').textContent = s; el('toast').style.opacity = 1; G.toastT = 2.2; }

function noise(x, y, r) { G.noises.push({ x, y, r: r * TS, t: .12 }); }
function fire() {
  P.fireT = 1 / 5.5;
  const a = P.ang + rnd(-.05, .05);
  G.bullets.push({ x: P.x + Math.cos(a) * 7, y: P.y + Math.sin(a) * 7, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 1.1, dmg: 12, mine: true });
  for (let i = 0; i < 3; i++) G.parts.push({ x: P.x + Math.cos(P.ang) * 8, y: P.y + Math.sin(P.ang) * 8, vx: Math.cos(a + rnd(-.4, .4)) * rnd(40, 110), vy: Math.sin(a + rnd(-.4, .4)) * rnd(40, 110), life: .1, max: .1, s: 1, c: '#ffe066' });
  noise(P.x, P.y, 9); G.shake = Math.max(G.shake, 1); FPS.flash = .06;
}
function hurtPlayer(d) {
  if (P.inv > 0 || P.dashT > 0) return;
  P.hp -= d; P.inv = .35; G.shake = Math.max(G.shake, 4);
  burst(P.x, P.y, 8, '#ff2ea6', 100); syncHud();
  if (P.hp <= 0) finish(false);
}
// E：处决 > 目标 > 撤离
function interact() {
  if (G.mode === 'walk') {
    if (TERM && len(TERM.x * TS + 8 - P.x, TERM.y * TS + 8 - P.y) < TS * 1.5) endWalk();
    else toast('走到发光的那一格');
    return;
  }
  for (const e of G.enemies) {
    if (e.dead || e.state === 'combat') continue;
    if (len(e.x - P.x, e.y - P.y) > TS * 1.1) continue;
    const toP = Math.atan2(P.y - e.y, P.x - e.x);
    if (Math.abs(angDiff(toP, e.ang)) < Math.PI * 100 / 180) { toast('他面朝你，绕到背后再动手'); continue; }
    killEnemy(e, true); toast('无声处决'); return;
  }
  if (!G.grabbed && TERM && len(TERM.x * TS + 8 - P.x, TERM.y * TS + 8 - P.y) < TS * 1.4) { G.hackT = .01; return; }
  if (G.grabbed && EXIT && len(EXIT.x * TS + 8 - P.x, EXIT.y * TS + 8 - P.y) < TS * 1.2) finish(true);
}

/* ---------------- 敌人 ---------------- */
const VIEW_ANG = Math.PI * 55 / 180, VIEW_DIST = 7 * TS;
function viewDist(e) { let d = VIEW_DIST * lightAt(e.x, e.y); if (P.crouch) d *= .7; return d; }
function canSee(e) {
  const dx = P.x - e.x, dy = P.y - e.y, d = len(dx, dy);
  if (d > viewDist(e)) return false;
  if (Math.abs(angDiff(Math.atan2(dy, dx), e.ang)) > VIEW_ANG) return false;
  return los(e.x, e.y, P.x, P.y);
}
function setState(e, s, at) {
  if (s === 'combat' && e.state !== 'combat') { if (!e.seenP) { G.seen++; e.seenP = true; syncHud(); } e.loseT = 3; }
  if (s === 'search') { e.searchT = e.state === 'combat' ? 15 : 8; e.scanT = 0; }
  if (s === 'idle') e.path = [];
  e.state = s; if (at) e.last = { x: at.x, y: at.y }; e.pathT = 0;
}
function callRoom(e, at) {
  const r = roomAt(e.x, e.y);
  for (const o of G.enemies) if (o !== e && !o.dead && o.state === 'idle' && roomAt(o.x, o.y) === r) setState(o, 'search', at);
}
function killEnemy(e, silent) {
  e.dead = true; G.kills++;
  G.bodies.push({ x: e.x, y: e.y, ang: e.ang, t: 0 });
  burst(e.x, e.y, silent ? 4 : 14, '#ff4d6d', silent ? 40 : 130);
  syncHud();
}
function eshoot(e) {
  const a = Math.atan2(P.y - e.y, P.x - e.x) + rnd(-.11, .11);
  G.bullets.push({ x: e.x + Math.cos(a) * 7, y: e.y + Math.sin(a) * 7, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190, life: 1.6, dmg: 9, mine: false });
  noise(e.x, e.y, 7);
}
function steer(e, tx, ty, spd, dt) {
  e.pathT -= dt;
  if (e.pathT <= 0 || !e.path.length) { e.path = findPath(e.x / TS | 0, e.y / TS | 0, tx / TS | 0, ty / TS | 0); e.pathT = .4; }
  let gx = tx, gy = ty;
  if (e.path.length) {
    const [nx, ny] = e.path[0]; gx = nx * TS + 8; gy = ny * TS + 8;
    if (len(gx - e.x, gy - e.y) < 3) { e.path.shift(); if (e.path.length) { gx = e.path[0][0] * TS + 8; gy = e.path[0][1] * TS + 8; } else { gx = tx; gy = ty; } }
  }
  const dx = gx - e.x, dy = gy - e.y, d = len(dx, dy);
  if (d < 2) return true;
  const a = Math.atan2(dy, dx); e.ang += angDiff(a, e.ang) * Math.min(1, dt * 8);
  moveActor(e, dx / d * spd * dt, dy / d * spd * dt);
  return len(tx - e.x, ty - e.y) < 6;                  // 到的是终点才算到，不是下一个路点
}
function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt);
  if (canSee(e)) {
    if (e.state !== 'combat') { setState(e, 'combat', P); toast('被发现了'); }
    e.last = { x: P.x, y: P.y }; e.loseT = 3;
  }
  for (const n of G.noises) if (e.state === 'idle' && len(n.x - e.x, n.y - e.y) < n.r) { setState(e, 'search', n); callRoom(e, n); }
  if (e.state === 'idle') for (const b of G.bodies) {
    if (b.found) continue;
    const dx = b.x - e.x, dy = b.y - e.y;
    if (len(dx, dy) < 2.5 * TS && Math.abs(angDiff(Math.atan2(dy, dx), e.ang)) < VIEW_ANG && los(e.x, e.y, b.x, b.y)) { b.found = true; setState(e, 'search', b); callRoom(e, b); toast('尸体被发现'); }
  }

  if (e.state === 'idle') {
    const p = e.def.path;
    if (p.length === 1) { e.ang += angDiff(e.def.face != null ? e.def.face : 0, e.ang) * Math.min(1, dt * 3); if (len(p[0][0] * TS + 8 - e.x, p[0][1] * TS + 8 - e.y) > 3) steer(e, p[0][0] * TS + 8, p[0][1] * TS + 8, 28, dt); }
    else { const [tx, ty] = p[e.wp]; if (steer(e, tx * TS + 8, ty * TS + 8, 26, dt)) e.wp = (e.wp + 1) % p.length; }
  } else if (e.state === 'search') {
    e.searchT -= dt;
    if (e.last && len(e.last.x - e.x, e.last.y - e.y) > 10) steer(e, e.last.x, e.last.y, 44, dt);
    else { e.scanT += dt; e.ang += Math.sin(e.scanT * 1.6) * dt * 1.8; }
    if (e.searchT <= 0) setState(e, 'idle');
  } else if (e.state === 'combat') {
    e.loseT -= dt;
    const seeNow = los(e.x, e.y, P.x, P.y) && len(P.x - e.x, P.y - e.y) < viewDist(e) * 1.6;
    if (seeNow) {
      e.last = { x: P.x, y: P.y }; e.loseT = 3;
      e.ang += angDiff(Math.atan2(P.y - e.y, P.x - e.x), e.ang) * Math.min(1, dt * 10);
      const d = len(P.x - e.x, P.y - e.y);
      if (d > 5 * TS) steer(e, P.x, P.y, 40, dt);
      e.fireT -= dt; if (e.fireT <= 0) { eshoot(e); e.fireT = .7 + rnd(0, .3); }
      e.shareT -= dt; if (e.shareT <= 0) { e.shareT = 1; for (const o of G.enemies) if (o !== e && !o.dead && o.state === 'combat') o.last = { x: P.x, y: P.y }; }
    } else if (e.last) steer(e, e.last.x, e.last.y, 48, dt);
    if (e.loseT <= 0) { setState(e, 'search', e.last); toast('敌人失去目标'); }
  }
}
function burst(x, y, n, c, pow) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(20, pow); G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.2, .5), max: .5, s: rnd(1, 2), c }); } }

/* ---------------- 更新 ---------------- */
function update(dt) {
  G.t += dt;
  if (G.toastT > 0) { G.toastT -= dt; if (G.toastT <= 0) el('toast').style.opacity = 0; }
  for (const k in DOORS) {
    const [tx, ty] = k.split(',').map(Number), d = DOORS[k], cx = tx * TS + 8, cy = ty * TS + 8;
    let near = len(P.x - cx, P.y - cy) < TS * 1.3;
    for (const e of G.enemies) if (!e.dead && len(e.x - cx, e.y - cy) < TS * 1.3) near = true;
    if (near) { if (!d.open) noise(cx, cy, 3); d.open = 1; d.t = 1.5; } else { d.t -= dt; if (d.t <= 0) d.open = 0; }
  }
  let ix, iy;
  if (FPS.on) {                                        // 第一人称：W/S 前后，A/D 侧移，方向键转身
    const fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    const str = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    if (keys.ArrowLeft) P.ang -= dt * 2.4;
    if (keys.ArrowRight) P.ang += dt * 2.4;
    const l = len(fwd, str), f = l ? fwd / l : 0, r = l ? str / l : 0;
    const c = Math.cos(P.ang), sn = Math.sin(P.ang);
    ix = c * f - sn * r; iy = sn * f + c * r;
  } else {
    ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    const l = len(ix, iy); if (l > 0) { ix /= l; iy /= l; }
  }
  const il = len(ix, iy); P.vxm = il > 0;
  // 义眼扫描的计时：扫完了才开始进冷却
  if (FPS.scanT > 0) { FPS.scanT -= dt; if (FPS.scanT <= 0) { FPS.scanT = 0; FPS.scanCd = SCAN_CD; } }
  else FPS.scanCd = Math.max(0, FPS.scanCd - dt);
  FPS.flash = Math.max(0, FPS.flash - dt);
  P.crouch = !!(keys.ControlLeft || keys.ControlRight || keys.KeyC);
  P.dashCd = Math.max(0, P.dashCd - dt); P.dashT = Math.max(0, P.dashT - dt); P.inv = Math.max(0, P.inv - dt); P.fireT -= dt;
  if ((keys.Space || keys.ShiftLeft) && P.dashCd === 0 && !G.hackT) {
    P.dashT = .17; P.dashCd = 2.2; const a = il > 0 ? Math.atan2(iy, ix) : P.ang;
    P.dvx = Math.cos(a) * 400; P.dvy = Math.sin(a) * 400; noise(P.x, P.y, 3); burst(P.x, P.y, 10, '#45f0ff', 80);
  }
  if (G.hackT > 0 && G.mode !== 'walk') {
    G.hackT += dt;
    // 只有正盯着你的敌人能打断读条；隔着两间屋交火的人管不到这里
    if (il > 0 || G.enemies.some(e => !e.dead && e.state === 'combat' && los(e.x, e.y, P.x, P.y))) { G.hackT = 0; toast('中断了'); }
    else if (G.hackT >= 2) { G.hackT = 0; return grabbed(); }
  } else {
    const spd = P.speed * (P.crouch ? .5 : 1);
    if (P.dashT > 0) moveActor(P, P.dvx * dt, P.dvy * dt);
    else { moveActor(P, ix * spd * dt, iy * spd * dt); if (il > 0 && !P.crouch && (G.t * 10 | 0) % 3 === 0) noise(P.x, P.y, 2); }
  }
  if (!FPS.on) P.ang = Math.atan2(mouse.y + G.cam.y - P.y, mouse.x + G.cam.x - P.x);
  if (mouse.down && P.fireT <= 0 && !G.hackT && G.mode !== 'walk') fire();
  for (const b of G.bullets) {
    const steps = 3;
    for (let i = 0; i < steps && b.life > 0; i++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      const tx = b.x / TS | 0, ty = b.y / TS | 0;
      if (blocksShot(tx, ty)) {
        b.life = 0; burst(b.x, b.y, 3, tile(tx, ty) === 'g' ? '#9ff' : '#aab', 60);
        if (tile(tx, ty) === 'g') { MAP[ty][tx] = '.'; noise(b.x, b.y, 6); G.broke = 1; toast('玻璃碎了'); }
        break;
      }
      if (b.mine) { for (const e of G.enemies) if (!e.dead && len(e.x - b.x, e.y - b.y) < e.r + 2) { e.hp -= b.dmg; e.flash = .1; b.life = 0; if (e.state !== 'combat') setState(e, 'combat', P); if (e.hp <= 0) killEnemy(e, false); break; } }
      else if (len(P.x - b.x, P.y - b.y) < P.r + 2) { hurtPlayer(b.dmg); b.life = 0; }
    }
    b.life -= dt;
  }
  G.bullets = G.bullets.filter(b => b.life > 0);
  for (const e of G.enemies) if (!e.dead) updateEnemy(e, dt);
  for (const n of G.noises) n.t -= dt; G.noises = G.noises.filter(n => n.t > 0);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  G.shake = Math.max(0, G.shake - dt * 12);
  G.cam.x = MW * TS <= VW ? (MW * TS - VW) / 2 : clamp(P.x - VW / 2, 0, MW * TS - VW);
  G.cam.y = MH * TS <= VH ? (MH * TS - VH) / 2 : clamp(P.y - VH / 2, 0, MH * TS - VH);
  if (G.mode === 'walk') { el('obj').textContent = G.walk.hint; return; }
  const st = G.enemies.some(e => !e.dead && e.state === 'combat') ? 'combat' : G.enemies.some(e => !e.dead && e.state === 'search') ? 'search' : 'idle';
  const A = el('alert'); A.className = st; A.textContent = { idle: '未察觉', search: '有人在搜索', combat: '交火中' }[st];
  el('tip').textContent = P.crouch ? '蹲伏：慢、静、难被看见' : G.hackT ? '读取中… ' + (G.hackT / 2 * 100 | 0) + '%'
    : FPS.on ? 'V 切视角 · Q 义眼扫描' : '';
}

/* =====================================================================
   第一人称：光线投射
   为什么这条路走得通：游戏本来存的就是一张字符网格（# 墙 / c 掩体 / g 玻璃 /
   D 门），那正好是这种渲染器的输入格式。不需要 WebGL、不需要模型、不需要依赖。

   三条规则和俯视角保持一致，不能因为换了视角就变：
     * 墙挡视线挡子弹
     * 掩体挡子弹不挡视线 —— 所以画成半高的矮墙，你能看过去，打不过去
     * 玻璃挡子弹不挡视线 —— 所以画成半透明，光线穿过去继续走

   潜行的可读性在第一人称会塌掉（看不见背后的视锥），补偿是两样：
   雷达（右下角，画视锥）和义眼扫描（Q，透墙看人和朝向 3 秒）。
   这不是补丁，是设定里本来就有的东西 —— 主角装的就是环宇 V4 定制义眼。
   ===================================================================== */
const FPS = {
  on: false, fov: 1.15, sens: 0.0032, zbuf: new Float32Array(VW),
  scanT: 0, scanCd: 0, flash: 0, lock: false,
};
const SCAN_DUR = 3, SCAN_CD = 8;

// 光线怎么对待一格：0 不挡 / 1 全高挡住并停下 / 2 半高（矮墙，看得过去）/ 3 半透明
function rayKind(tx, ty) {
  const t = tile(tx, ty);
  if (t === '#') return 1;
  if (t === 'D') return doorAt(tx, ty).open ? 0 : 1;
  if (t === 'c') return 2;
  if (t === 'g') return 3;
  return 0;
}
// 墙面上的装饰：按格子和朝向做确定性哈希 —— 第一人称最怕四面空墙
function deco(tx, ty, side) {
  const h = ((tx * 73856093) ^ (ty * 19349663) ^ (side * 83492791)) >>> 0;
  return h % 7;                       // 0..1 无 / 2 竖管 / 3 亮窗 / 4 招牌 / 5 通风口 / 6 污渍
}

function renderFPS() {
  const px = P.x / TS, py = P.y / TS;
  const dirX = Math.cos(P.ang), dirY = Math.sin(P.ang);
  const plX = -dirY * FPS.fov, plY = dirX * FPS.fov;
  const HOR = VH / 2 + 6;                       // 地平线：稍微压低一点，像人的视高

  // ---- 天花板与地面 ----
  const cg = ctx.createLinearGradient(0, 0, 0, HOR);
  cg.addColorStop(0, shade(COL.wallTop, .35)); cg.addColorStop(1, shade(COL.wall, .55));
  ctx.fillStyle = cg; ctx.fillRect(0, 0, VW, HOR);
  const fg = ctx.createLinearGradient(0, HOR, 0, VH);
  fg.addColorStop(0, shade(COL.floor, .5)); fg.addColorStop(1, COL.floor2);
  ctx.fillStyle = fg; ctx.fillRect(0, HOR, VW, VH - HOR);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, HOR - 1, VW, 2);

  // ---- 逐列投射 ----
  for (let sx = 0; sx < VW; sx++) {
    const camX = 2 * sx / VW - 1;
    const rx = dirX + plX * camX, ry = dirY + plY * camX;
    let tx = px | 0, ty = py | 0;
    const ddx = Math.abs(1 / (rx || 1e-9)), ddy = Math.abs(1 / (ry || 1e-9));
    const stepX = rx < 0 ? -1 : 1, stepY = ry < 0 ? -1 : 1;
    let sdx = (rx < 0 ? px - tx : tx + 1 - px) * ddx;
    let sdy = (ry < 0 ? py - ty : ty + 1 - py) * ddy;
    const hits = [];
    for (let n = 0; n < 64; n++) {
      let side;
      if (sdx < sdy) { sdx += ddx; tx += stepX; side = 0; } else { sdy += ddy; ty += stepY; side = 1; }
      const k = rayKind(tx, ty);
      if (!k) continue;
      const d = side === 0 ? (sdx - ddx) : (sdy - ddy);
      // 墙面上的横向坐标：拿来放窗、管道、招牌
      const u = side === 0 ? (py + d * ry) % 1 : (px + d * rx) % 1;
      hits.push({ d, side, k, tx, ty, u: u < 0 ? u + 1 : u });
      if (k === 1) break;
    }
    FPS.zbuf[sx] = hits.length ? hits[hits.length - 1].d : 1e9;
    // 远的先画，近的盖上去（玻璃和矮墙要能透出后面的东西）
    for (let i = hits.length - 1; i >= 0; i--) drawStrip(sx, hits[i], HOR);
  }

  // ---- 广告牌：敌人 / 尸体 / 目标 / 出口 ----
  const bill = [];
  for (const e of G.enemies) {
    if (e.dead) continue;
    const base = e.state === 'combat' ? 'guardHot' : e.state === 'search' ? 'guardWarn' : 'guard';
    const rel = Math.abs(angDiff(Math.atan2(P.y - e.y, P.x - e.x), e.ang));

    ctx.fillStyle = 'rgba(69,240,255,.10)';
    const sy = (G.t * 90) % VH; ctx.fillRect(0, sy, VW, 2);

/* ---- 雷达：把视锥还给玩家。没有它，第一人称的潜行就没法读了 ---- */

      ctx.fillStyle = hue === 0 ? '#123' : hue === 1 ? '#0f2418' : '#1a1220';
      ctx.fillRect(x + 2, y + 2, 40, 26);
      const col = hue === 0 ? 'rgba(90,180,220,' : hue === 1 ? 'rgba(120,220,140,' : 'rgba(220,120,180,';
      for (let i = 0; i < 7; i++) {                     // 滚动的字符行
        const w = 6 + ((i * 17 + r * 5 + c * 3) % 30);
        const yy = y + 4 + ((i * 4 + Math.floor(t * 9 + c * 3)) % 24);
        ctx.fillStyle = col + (i % 3 ? '.5)' : '.85)');
        ctx.fillRect(x + 4, yy, w, 1);
      }
      ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(x + 2, y + 2, 40, 6);
      ctx.globalAlpha = .06; glow(x + 22, y + 15, 40, 'rgba(120,200,220,1)'); ctx.globalAlpha = 1;
    }
    // 折叠床 + 一只保温杯：有人住在这儿
    ctx.fillStyle = '#1c2228'; ctx.fillRect(0, 112, 92, 22);
    ctx.fillStyle = '#2a3238'; ctx.fillRect(0, 112, 92, 4);
    ctx.fillStyle = '#3d4a52'; ctx.fillRect(12, 104, 28, 9);
    ctx.fillStyle = '#7a8a92'; ctx.fillRect(58, 100, 8, 13); ctx.fillStyle = '#98a8b0'; ctx.fillRect(58, 100, 3, 13);
    // 船体的锈
    ctx.fillStyle = '#1a1410'; ctx.fillRect(240, 108, 80, 26);
    ctx.fillStyle = '#2a2018'; for (let i = 0; i < 14; i++) ctx.fillRect(244 + (i * 13) % 72, 110 + (i * 7) % 20, 5, 2);
    band(134, VH, '#05070a');
  },
  // 穹顶外围的餐厅：包厢、窗、一盏低垂的灯。两副筷子。
  restaurant(t) {
    band(0, VH, '#14121a');
    ctx.fillStyle = '#1c1a24'; ctx.fillRect(0, 0, VW, 104);
    ctx.fillStyle = '#231f2c'; for (let x = 0; x < VW; x += 32) ctx.fillRect(x, 0, 3, 104);
    // 窗：外面是穹顶的光
    ctx.fillStyle = '#0e1620'; ctx.fillRect(198, 18, 104, 56);
    ctx.fillStyle = '#16283a'; ctx.fillRect(201, 21, 98, 50);
    ctx.globalAlpha = .5; glow(250, 46, 60, 'rgba(150,210,235,1)'); ctx.globalAlpha = 1;
    ctx.fillStyle = '#2a2634'; ctx.fillRect(196, 16, 108, 3); ctx.fillRect(196, 72, 108, 3); ctx.fillRect(248, 18, 3, 56);
    // 低垂的灯
    ctx.fillStyle = '#26222e'; ctx.fillRect(96, 0, 2, 26);
    ctx.fillStyle = '#3a3040'; ctx.fillRect(84, 26, 26, 6);
    ctx.fillStyle = '#ffd9a0'; ctx.fillRect(88, 32, 18, 3);
    ctx.globalAlpha = .2; glow(97, 36, 74, 'rgba(255,200,140,1)'); ctx.globalAlpha = 1;
    // 桌 + 两副筷子 + 一条鱼
    ctx.fillStyle = '#2e2028'; ctx.fillRect(0, 104, VW, 32);
    ctx.fillStyle = '#402c34'; ctx.fillRect(0, 104, VW, 4);
    ctx.fillStyle = '#e8e0d0'; ctx.fillRect(40, 96, 22, 9); ctx.fillRect(150, 96, 22, 9);
    ctx.fillStyle = '#c8bca8'; ctx.fillRect(40, 96, 22, 2); ctx.fillRect(150, 96, 22, 2);
    ctx.fillStyle = '#b8a888'; ctx.fillRect(66, 98, 14, 1); ctx.fillRect(66, 100, 14, 1);
    ctx.fillStyle = '#b8a888'; ctx.fillRect(176, 98, 14, 1); ctx.fillRect(176, 100, 14, 1);
    ctx.fillStyle = '#9a7a5a'; ctx.fillRect(100, 92, 34, 12);
    ctx.fillStyle = '#b08a62'; ctx.fillRect(100, 92, 34, 3);
    band(136, VH, '#0e0c12');
  },
};
function backId(w) {
  w = w || '';
  if (w.includes('会议室')) return 'dome_meet';
  if (w.includes('一号门')) return 'dome_gate';
  if (w.includes('轨道车')) return 'tram';
  if (w.includes('面馆')) return 'noodle';
  if (w.includes('后巷') || w.includes('巷子')) return 'alley';
  if (w.includes('酒吧')) return 'bar';
  if (w.includes('船')) return 'ship';
  if (w.includes('餐厅')) return 'restaurant';
  return 'street';
}
function drawBackdrop(where) {
  seed = 7717;
  (SCENES[backId(where)] || SCENES.street)(G.t);
  ctx.fillStyle = 'rgba(0,0,0,.14)'; for (let y = 0; y < VH; y += 2) ctx.fillRect(0, y, VW, 1);
  ctx.fillStyle = 'rgba(7,8,13,.34)'; ctx.fillRect(0, VH - 26, VW, 26);        // 底部压暗，字才看得清
}

/* ---------------- 结算 / 标题 ---------------- */
function syncHud() {
  el('hpn').textContent = Math.max(0, P.hp | 0); el('hp').firstElementChild.style.width = clamp(P.hp / P.maxhp * 100, 0, 100) + '%';
  el('kills').textContent = G.kills; el('seen').textContent = G.seen;
}
function finish(win) {
  G.state = 'over'; el('hud').style.display = 'none';
  ST.kills = G.kills; ST.seen = G.seen;                // 街坊台词要看战绩
  const M = MISSION[G.mission];
  const ghost = G.seen === 0, clean = G.kills === 0;
  const b2 = M.bonus[1] === '不破坏任何东西' ? !G.broke : clean;
  el('ovl').innerHTML = `<div class="card">
    <h1>${win ? '撤离成功' : '你死了'}</h1><h2>${M.title} · ${M.place}</h2>
    <div class="stat"><div><b>${(G.t | 0)}s</b>耗时</div><div><b>${G.kills}</b>击杀</div><div><b>${G.seen}</b>被发现</div></div>
    <div>可选目标：<span class="${ghost ? 'bonus' : 'miss'}">${M.bonus[0]}</span> · <span class="${b2 ? 'bonus' : 'miss'}">${M.bonus[1]}</span></div>
    <div class="go">${win ? (ghost && clean ? '没人知道你来过，也没人少一根头发。' : ghost ? '没人知道你来过。' : clean ? '一个都没杀，但他们都知道有人来过。' : '硬冲也是一种打法。') : '换一种打法：蹲下（Ctrl）、走暗房间、从背后按 E。'}</div>
    <div style="margin-top:16px">${win ? '<button id="k1">交活</button>' : '<button id="k1">再来一次</button>'}</div></div>`;
  el('ovl').style.display = 'flex';
  el('k1').onclick = () => win ? play(M.debrief) : startLevel(G.mission);
  syncStatus();
}
function title() {
  G.state = 'title'; el('status').style.display = 'none'; el('hud').style.display = 'none'; dlgClose();
  el('ovl').innerHTML = `<div class="card">
    <h1>夜 港</h1><h2>NIGHT HARBOR · 原型 · 序章 + 三支第一个任务</h2>
    <p>明烛把你优化了。义体是公司预支的，合同没做满，三处义体一起变成欠款。宽限期 90 天。</p>
    <p style="color:#7d8aa5">台词全部来自 <code>docs/夜港剧本.md</code>，由 <code>tools/script2json.js</code> 解析后嵌进来。改剧本就改游戏。</p>
    <table>
      <tr><td>对话</td><td><kbd>空格</kbd> 继续 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 选择（灰掉的是你做不到的事）</td></tr>
      <tr><td>关卡</td><td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · 鼠标瞄准开火 · <kbd>Ctrl</kbd> 蹲伏 · <kbd>空格</kbd> 冲刺</td></tr>
      <tr><td></td><td><kbd>E</kbd> 背后处决 / 读取目标 / 撤离</td></tr>
      <tr><td>视角</td><td><kbd>V</kbd> 俯视 ⇄ 第一人称 · 第一人称下 <kbd>Q</kbd> 义眼扫描（透墙看人 3 秒）</td></tr>
    </table>
    <p>你是——</p>
    <div style="margin-top:6px"><button id="gm">男</button><button id="gf">女</button></div>
    <div class="go">选一个就开始。全部台词不分性别，只有穹顶里的旧同事会叫你「陈哥」或「陈姐」。</div></div>`;
  el('ovl').style.display = 'flex';
  el('gm').onclick = () => { ST.gender = 'm'; titleGo(); };
  el('gf').onclick = () => { ST.gender = 'f'; titleGo(); };
}
function titleGo() { el('ovl').style.display = 'none'; play('P0.1'); }

/* ---------------- 主循环 ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.state === 'play') { update(dt); FPS.on ? renderFPS() : render(); }
  else if (G.state === 'over' && P) render();
  else if (G.state === 'dlg') { G.t += dt; dlgTick(dt); drawBackdrop(backdrop); }
  else { ctx.fillStyle = '#07080d'; ctx.fillRect(0, 0, VW, VH); }
  requestAnimationFrame(loop);
}
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / VW, innerHeight / VH)));
  cv.style.width = VW * s + 'px'; cv.style.height = VH * s + 'px';
}
bakeSprites();
if (PORTSRC) el('dlg').querySelector('.port').style.backgroundImage = `url(${PORTSRC})`;
addEventListener('resize', fit); fit(); title(); requestAnimationFrame(loop);
</script>
