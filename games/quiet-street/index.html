<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>静街 · 疫后小镇生存日志</title>
<style>
  :root { --ink:#e6e2d8; --dim:#8e8a80; --panel:#17191a; --line:#2a2d2e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0d0e0f; color:var(--ink);
    font:14px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overscroll-behavior:none; }
  #stage { display:flex; height:100%; touch-action:none; }
  #wrap { flex:1; display:grid; place-items:center; min-width:0; overflow:hidden; }
  canvas { image-rendering:pixelated; display:block; background:#0d0e0f; }
  #side { width:300px; flex:none; border-left:1px solid var(--line); background:var(--panel);
    padding:10px 12px; overflow:auto; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.18em; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 10px; }
  .row { display:flex; justify-content:space-between; font-size:12px; margin:2px 0; }
  .bar { height:4px; background:#26292a; margin-top:2px; }
  .bar i { display:block; height:100%; background:#7f9aa6; }
  #log { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; font-size:12px; color:var(--dim); }
  #log b { color:var(--ink); font-weight:500; }
  kbd { background:#26292a; border-radius:2px; padding:0 4px; font:11px/1.5 ui-monospace,monospace; }
  /* 竖排只给【竖着的】窄屏。原来只看宽度，于是 812×375 的横屏窗口
     也被竖排了：画布挤在上面，面板占满下面。断点要看形状，不只看宽度。 */
  @media (max-width:1000px) and (orientation:portrait){
    #stage{flex-direction:column} #side{width:auto;border-left:0;border-top:1px solid var(--line)}
  }
  @media (max-width:1000px) and (orientation:landscape){ #side{width:220px} }
  /* 触屏层：盖满视口，不是只盖画布 —— 竖屏时拇指在画布外面（霓虹教训五） */
  #tc { position:fixed; inset:0; z-index:9; display:none; touch-action:none; }
  body.touch #tc { display:block; }
  /* 触屏：画面铺满视口，侧栏收起 —— 六表和提示改画在画布上 */
  body.touch { overflow:hidden; }
  body.touch #stage { display:block; height:100%; }
  body.touch #wrap { position:fixed; inset:0; display:grid; place-items:center; background:#0d0e0f; }
  body.touch #side { display:none; }
  body.touch .keyhint { display:none; }          /* 手机上最该删的是它没有的东西 */
  /* 摇杆压淡一点 —— 原来是一大块实心黑饼，比地图还抢眼 */
  #stk { position:absolute; left:max(16px,env(safe-area-inset-left)); bottom:max(24px,env(safe-area-inset-bottom));
    width:128px; height:128px; border-radius:50%; border:1px solid rgba(90,96,98,.45);
    background:radial-gradient(circle,rgba(20,22,23,.30) 0%,rgba(20,22,23,.52) 100%); }
  #stk i { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px;
    border-radius:50%; background:rgba(210,226,74,.20); border:1px solid rgba(210,226,74,.45); }
  /* 【四个一样大的圆饼没有主次】。按用得多和够不着的程度分三档：
     挥最大最顺手，互动次之，跑/蹲最小排在底下一行。
     而且原来「挥」在 right:104，正好压在人物头上 —— 现在整组往右靠。 */
  .tb { position:absolute; border-radius:50%; text-align:center; user-select:none;
    color:var(--ink); border:1px solid rgba(90,96,98,.45);
    background:rgba(20,22,23,.46); font-family:-apple-system,sans-serif; }
  .tb:active, .tb.on { background:rgba(210,226,74,.22); border-color:rgba(210,226,74,.6); }
  #bA { width:94px; height:94px; font-size:15px; line-height:94px;
        right:max(16px,env(safe-area-inset-right));
        bottom:max(102px,calc(env(safe-area-inset-bottom) + 102px));
        background:rgba(120,40,34,.42); border-color:rgba(170,74,64,.55); }
  #bE { width:74px; height:74px; font-size:13px; line-height:74px;
        right:max(120px,calc(env(safe-area-inset-right) + 120px));
        bottom:max(134px,calc(env(safe-area-inset-bottom) + 134px)); }
  #bR { width:62px; height:62px; font-size:12px; line-height:62px;
        right:max(16px,env(safe-area-inset-right));
        bottom:max(26px,calc(env(safe-area-inset-bottom) + 26px)); }
  #bC { width:62px; height:62px; font-size:12px; line-height:62px;
        right:max(88px,calc(env(safe-area-inset-right) + 88px));
        bottom:max(26px,calc(env(safe-area-inset-bottom) + 26px)); }
  /* 【手机上原来根本打不开日志】—— J 键在手机上不存在，而按钮只有挥/互动/跑/蹲。
     补一个，放在摇杆上方，不跟右手那一组抢地方。 */
  #bJ { width:48px; height:48px; font-size:11px; line-height:48px;
        left:max(16px,env(safe-area-inset-left));
        bottom:max(168px,calc(env(safe-area-inset-bottom) + 168px)); }
  /* 【手机上原来没法开背包】—— Tab 在手机上不存在，所以也就没法换武器。
     放在日志旁边，跟它一组。 */
  #bP { width:48px; height:48px; font-size:11px; line-height:48px;
        left:max(70px,calc(env(safe-area-inset-left) + 70px));
        bottom:max(168px,calc(env(safe-area-inset-bottom) + 168px)); }
  /* 浮层打开时收起控件，并让整屏接收"轻点关闭" */
  body.modal #tc { display:none; }
  #mclose { position:fixed; inset:0; z-index:10; display:none; }
  body.touch.modal #mclose { display:block; }
</style>
</head>
<body>
<div id="mclose"></div>
<div id="tc">
  <div id="stk"><i></i></div>
  <div class="tb" id="bA">挥</div>
  <div class="tb" id="bE">互动</div>
  <div class="tb" id="bR">跑</div>
  <div class="tb" id="bC">蹲</div>
  <div class="tb" id="bJ">日志</div>

      <kbd>左键</kbd>/<kbd>空格</kbd> 挥击 <kbd>右键</kbd>/<kbd>Q</kbd> 推开<br>
      <kbd>M</kbd> 静音<br>
      <kbd>E</kbd> 互动<br>
      <kbd>Tab</kbd> 背包 <kbd>J</kbd> 日志 <kbd>P</kbd> 暂停

  </div>
</div>

(function () {
'use strict';

// ---- 种子：只能从外部来（霓虹教训四）----
const qs = new URLSearchParams(location.search);
const SEED0 = (qs.get('seed') | 0) || 20260911;
let rnd = mulberry(SEED0);
function mulberry(a) {
  a = a >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = n => Math.floor(rnd() * n);
const pickOne = a => a[ri(a.length)];

// ---- 尺度（数据规格第一节 / 七·五节）----
const W = 96, H = 80;              // 镇子格数

// 视口格数在触屏上是【算】出来的，不是写死的（见 layout()）。
// 这两个是桌面的默认值，也是触屏的下限参考框。
let VW = 17, VH = 12;
// 下限是参考框（至少看得见 7×10）；上限只是防止超宽屏把格子铺到离谱，
// 别定得比常见手机横屏还小 —— 16 格 ×48 = 768，铺不满 812 的横屏。
const TOUCH_MIN = { w:7, h:10 }, TOUCH_MAX = { w:34, h:28 };
const MIN_PER_HOUR = 60, SEC_PER_HOUR = 22.5;   // 白天 1x：1 游戏时 = 22.5 秒现实
const SEC_PER_MIN = SEC_PER_HOUR / MIN_PER_HOUR;   // 0.375 秒现实 = 1 游戏分钟

// ---- 瓦片 ----

// 浪潮跟着从 +120 降到 +70：它该是"这一下不一样了"，不是"把镇子填回去"。
const BLOCK_DEF = [

  { id:'B', name:'新街区', x:49, y:1,  w:46, h:23, init:31, adj:['A','C'] },

// 哪个街区有哪些房子。数量从这张表数出来，不另写 n —— 两处写就会对不上。
const PLAN = {

  B: ['民宅','民宅','民宅','民宅','民宅','民宅','商铺','商铺'],

  F: ['民宅','民宅','民宅','民宅'],

for (const t in HOUSE_TYPE) HOUSE_TYPE[t].n = 0;
for (const b in PLAN) for (const t of PLAN[b]) HOUSE_TYPE[t].n++;

const ROOM_GRAMMAR = {

  卧室:   ['衣柜','床头柜'],        卫生间: ['药柜'],

const RECIPES = [
  { out:'绷带',      need:{ 布:2 } },

// ==========================================================================
//  T1 · 镇子生成器
//  房型 → 房间语法 → 容器 → 战利品，四层全部照表走，一个数都不在代码里现编。

let TOWN = null, BLOCKS = [], Z = [], P = null;
const tileAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? TL.墙 : TOWN.tiles[y * W + x];
const setTile = (x, y, t) => { if (x >= 0 && y >= 0 && x < W && y < H) TOWN.tiles[y * W + x] = t; };

  for (const b of BLOCKS) if (x >= b.x - 1 && x < b.x + b.w + 1 && y >= b.y - 1 && y < b.y + b.h + 1) return b;

// 玩家能过的地方
const passable = (x, y) => {
  const t = tileAt(x, y);
  if (t === TL.门) { const d = doorAt(x, y); return d ? d.open : true; }
  if (t === TL.窗) return true;                 // 窗可以翻
  return !SOLID[t];
};

// 它们跟着翻窗进屋，门不关就直接跟进来，"进房子也没用"。
// 现在：窗和钉了板的窗僵尸过不去，门只有开着才过得去。
// 它们不会开门也不会翻窗 —— 拆门拆板是 T9 的事，那时才该给它们这个动作。
const zPassable = (x, y) => {
  const t = tileAt(x, y);
  if (t === TL.门) { const d = doorAt(x, y); return !!(d && d.open); }
  if (t === TL.窗 || t === TL.板窗) return false;
  return !SOLID[t];

function genTown(seed) {
  rnd = mulberry(seed);
  const tiles = new Uint8Array(W * H).fill(TL.草);
  TOWN = {
    seed, tiles, W, H, doors:{}, wins:{}, houses:[], containers:[], searched:null, ITEMINDEX:{},
    built:[], corpses:[], deeds:{}, legacy:[], harvested:false,
    seen:new Uint8Array(W * H),               // 记忆层：见过的地形（进镇子档）
    blood:new Uint8Array(W * H),              // 血迹：这条街我清过（进镇子档）
    day:1, hour:6, min:0, season:'秋',
    waterDay: 7 + ri(4), powerDay: 14, waterOn:true, powerOn:true,
    rerolls:0, floorReject:0, relocated:0,
  };
  BLOCKS = BLOCK_DEF.map(b => ({ ...b, pop:b.init, heat:0, lock:0 }));

  // 路：一条主街纵贯 + 两条横街。街区的边界就是路边。
  for (let y = 0; y < H; y++) for (let x = 45; x <= 47; x++) setTile(x, y, TL.路);
  for (const y0 of [24, 51]) for (let y = y0; y <= y0 + 2; y++) for (let x = 0; x < W; x++) setTile(x, y, TL.路);
  for (let x = 0; x < W; x++) { setTile(x, 0, TL.路); setTile(x, H - 1, TL.路); }
  for (let y = 0; y < H; y++) { setTile(0, y, TL.路); setTile(W - 1, y, TL.路); }

  // 建筑：每个街区里按"货架式"排 —— 一排排满了换下一排。
  //
  // 【第一版丢了两栋房】：B 街区计划里有 8 栋，宽度摇到 10~11 时一排只塞得下 3 栋，
  // 两排 6 栋，第三排超出街区高度 —— 两栋商铺被静默丢掉，断言当场报「30 栋，表里写的是 32」。
  // 修法两条：① 挤不下时先退回这个房型的【最小尺寸】再试一次；
  //          ② 本街区实在排不下的，兜底去别的街区找地方，而不是丢掉。
  // 丢一栋房不会崩，只会让镇上少一家药房 —— 这正是最难靠手玩发现的那种错。
  const cur = {};
  for (const b of BLOCKS) cur[b.id] = { cx:b.x + 1, cy:b.y + 1, rowH:0 };
  const tryPlace = (type, b, minOnly) => {
    const T0 = HOUSE_TYPE[type], c = cur[b.id];
    const hw = minOnly ? T0.w[0] : T0.w[0] + ri(T0.w[1] - T0.w[0] + 1);
    const hh = minOnly ? T0.h[0] : T0.h[0] + ri(T0.h[1] - T0.h[0] + 1);
    if (c.cx + hw > b.x + b.w - 1) { c.cx = b.x + 1; c.cy += c.rowH + 2; c.rowH = 0; }
    if (c.cy + hh > b.y + b.h - 1) return false;
    buildHouse(type, c.cx, c.cy, hw, hh, b);
    c.cx += hw + 2; c.rowH = Math.max(c.rowH, hh);
    return true;
  };
  const pending = [];
  for (const b of BLOCKS) {
    const list = (PLAN[b.id] || []).slice();
    // 高的先排，矮的填缝，否则最后一排常常差一格塞不下
    list.sort((p, q) => HOUSE_TYPE[q].h[1] - HOUSE_TYPE[p].h[1]);
    for (const type of list)
      if (!tryPlace(type, b, false) && !tryPlace(type, b, true)) pending.push(type);
  }
  for (const type of pending) {
    let ok = false;
    for (const b of BLOCKS) if (tryPlace(type, b, true)) { ok = true; TOWN.relocated++; break; }

  }

  for (const c of TOWN.containers) for (const it of c.items)

  return TOWN;
}

// 一栋房：墙 → 分间 → 门窗 → 容器 → 连通性校验（不过就重摇内部）
function buildHouse(type, x, y, w, h, blk) {
  const T0 = HOUSE_TYPE[type];
  const hs = { id:TOWN.houses.length, type, x, y, w, h, block:blk.id, exits:[], rooms:[] };
  for (let tries = 0; tries < 8; tries++) {
    wipeRect(x, y, w, h);
    // 外墙 + 室内地板
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
      setTile(x + i, y + j, (i === 0 || j === 0 || i === w - 1 || j === h - 1) ? TL.墙 : TL.地板);
    hs.exits.length = 0; hs.rooms.length = 0;
    partition(hs, T0);
    exits(hs, T0);
    if (!hs.exits.some(e => e.kind === '门') || !hs.exits.some(e => e.kind === '窗')) continue;
    if (!connected(hs)) { TOWN.rerolls++; continue; }
    break;
  }
  // 容器摆在贴墙的格子上；摆完再查一次连通性（别把人堵在角落里）
  for (const room of hs.rooms) fillRoom(hs, room);
  TOWN.houses.push(hs);
  return hs;
}
function wipeRect(x, y, w, h) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    setTile(x + i, y + j, TL.草);
    delete TOWN.doors[(x + i) + ',' + (y + j)];
    delete TOWN.wins[(x + i) + ',' + (y + j)];
  }
  TOWN.containers = TOWN.containers.filter(c => !(c.x >= x && c.x < x + w && c.y >= y && c.y < y + h));
}

// 分间：沿长边切成若干条，条与条之间一道内墙 + 一个门洞。
// 间数不够大就砍掉语法表尾部的房间 —— 宁可少一间，也不要 2 格宽的屋子。
function partition(hs, T0) {
  const want = T0.rooms.slice();
  const inW = hs.w - 2, inH = hs.h - 2;
  let n = want.length;
  const horiz = inW >= inH;
  while (n > 1 && Math.floor((horiz ? inW : inH) / n) < 4) n--;
  const strips = [];
  const span = horiz ? inW : inH, base = Math.floor(span / n);
  let at = 0;
  for (let k = 0; k < n; k++) {
    const len = (k === n - 1) ? span - at : base;
    strips.push({ from:at, len });
    at += len;
  }
  strips.forEach((s, k) => {
    const rx = horiz ? hs.x + 1 + s.from : hs.x + 1;
    const ry = horiz ? hs.y + 1 : hs.y + 1 + s.from;
    const rw = horiz ? s.len : inW, rh = horiz ? inH : s.len;
    if (k > 0) {                                  // 内墙 + 门洞
      if (horiz) {
        for (let j = 0; j < inH; j++) setTile(rx - 1, hs.y + 1 + j, TL.墙);
        const gy = hs.y + 1 + Math.floor(inH / 2);
        setTile(rx - 1, gy, TL.地板);
      } else {
        for (let i = 0; i < inW; i++) setTile(hs.x + 1 + i, ry - 1, TL.墙);
        const gx = hs.x + 1 + Math.floor(inW / 2);
        setTile(gx, ry - 1, TL.地板);
      }
    }
    hs.rooms.push({ type:want[k], x:rx, y:ry, w:rw, h:rh, cont:[],
                    water: want[k] === '厨房' || want[k] === '卫生间' });
  });
}

// 出路：一扇门（朝路的那面优先）+ 一到三扇窗。红线是【至少两条出路】（市井 T30）
function exits(hs, T0) {

  const put = (side, kind) => {
    const p = sidePoint(hs, side);
    if (!p) return null;
    if (tileAt(p.x, p.y) !== TL.墙) return null;
    if (kind === '门') {
      setTile(p.x, p.y, TL.门);
      TOWN.doors[p.x + ',' + p.y] = { open:false, locked: rnd() < T0.lock, house:hs.id };
    } else setTile(p.x, p.y, TL.窗);
    const e = { kind, x:p.x, y:p.y, side, boards:0, broken:false, house:hs.id };
    hs.exits.push(e);

  };

  const nw = 1 + ri(Math.min(3, rest.length));
  for (let i = 0; i < nw; i++) put(rest[i], '窗');

              东:{x:hs.x + hs.w, y:hs.y + (hs.h >> 1)}, 西:{x:hs.x - 1, y:hs.y + (hs.h >> 1)} };
  let best = null, bd = 1e9;
  for (const s in c) {
    for (let d = 1; d < 8; d++) {
      const x = c[s].x + (s === '东' ? d : s === '西' ? -d : 0);
      const y = c[s].y + (s === '南' ? d : s === '北' ? -d : 0);
      if (tileAt(x, y) === TL.路) { if (d < bd) { bd = d; best = s; } break; }
    }

  if (side === '北') return { x:hs.x + jx, y:hs.y };
  if (side === '东') return { x:hs.x + hs.w - 1, y:hs.y + jy };

// 连通性：从门洞灌水，每间屋都得淹到。不过就重摇 —— 卡住了要能自己出来（市井 T30）

  const seen = new Set(), q = [];

    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const x = p.x + dx, y = p.y + dy;
      if (x <= hs.x || y <= hs.y || x >= hs.x + hs.w - 1 || y >= hs.y + hs.h - 1) continue;
      const k = x + ',' + y; if (seen.has(k)) continue;
      if (tileAt(x, y) !== TL.地板) continue;

    const wall = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => tileAt(x + dx, y + dy) === TL.墙).length;

      const ni = ny * W + nx; if (prev[ni] !== -2) continue;

  if (!P.inv.includes(item)) return '缺' + item + '，' + wd.part + '这一步是' + st;

  return wd.part + '·' + st + (nextStep(wd) ? '（下一步：' + nextStep(wd) + '）' : '，处理完了');
}
function treat(part, step) {
  const wd = P.wounds.find(x => x.part === part); if (!wd) return false;
  const item = { 清洗:'瓶装水', 消毒:'酒精', 缝合:'针线', 包扎:'绷带', 夹板:'夹板' }[step];
  const has = P.inv.includes(item);
  if (has) { P.inv.splice(P.inv.indexOf(item), 1); wd.treated.push(step); }
  ev('treat', { part, step, item, ok:has });
  return has && WOUND[wd.type].steps.includes(step);
}
function die(cause) {
  P.dead = true;
  DEATH = { cause, day:TOWN.day, hhmm:hhmm() };
  TOWN.legacy.push({ name:P.name || '无名', days:TOWN.day, cause, deeds:Object.keys(TOWN.deeds).length });
  if (TOWN.legacy.length > 5) TOWN.legacy.shift();
  TOWN.corpses.push({ x:P.x, y:P.y, name:P.name, items:P.inv.slice(), risen:false, killed:false });
  ev('death', { cause });
  say('第 ' + TOWN.day + ' 天，' + cause + '。');
  return DEATH;
}

// ---- 死亡回溯（第六节）：急性看"那一下"，慢性看"最后一次还有机会" ----
const NEEDOF = { 感染:'酒精', 脓毒:'抗生素', 脱水:'瓶装水', 饿死:'罐头', 冻死:'外套', 失血:'绷带', 被围:null };
const CHRONIC = { 脱水:1, 饿死:1, 冻死:1, 脓毒:1 };
function deathReport() {
  if (!DEATH) return null;
  const d = DEATH, lines = [], need = NEEDOF[d.cause];
  lines.push('你死于' + d.cause + '，第 ' + d.day + ' 天 ' + d.hhmm + '。');
  let tail = '';
  if (CHRONIC[d.cause] && need) {
    let last = null;
    for (let i = P.snaps.length - 1; i >= 0; i--) if (P.snaps[i].有[need]) { last = P.snaps[i]; break; }
    const ref = last || P.snaps[0];
    if (ref) {
      const gone = (d.day - ref.day) * 24 + (TOWN.hour - ref.t);
      lines.push('真正的死因在第 ' + ref.day + ' 天 ' + String(ref.t).padStart(2, '0') + ':00 —— 那是你身上最后一份'
        + need + '，' + (last ? '之后的 ' + Math.max(1, gone) + ' 小时里再没找到' : '而你从头到尾都没有过') + '。');
    }
    if (need === '瓶装水' && BUS.some(e => e.kind === 'waterOff')) tail = '停水那天日志里写过，你没去做雨水收集器。';
  } else {
    const o = BUS.find(e => e.kind === (d.cause === '被围' ? 'hurtByHorde' : 'bite')) || BUS.find(e => e.kind === 'bite') || BUS[0];
    if (o) lines.push('真正的死因在第 ' + o.day + ' 天 ' + o.hhmm + ' —— ' + (o.place || '镇上') + '，'
      + (o.what || (o.n ? '三只把你按在墙上' : '你在那里出了声')) + '。');
  }
  if (need) {
    const where = (TOWN.ITEMINDEX[need] || [])[0];
    const hs = TOWN.houses[where];
    lines.push('最近的一份在' + (hs ? hs.type : '镇上某处')
      + (hs && P.seen.has(hs.id) ? '，你从门口路过' : '，你从没进去过') + '。' + tail);
  }
  return { cause:d.cause, lines };
}

// ---- 镇志（第七·五节）：属于镇子，不属于角色 ----
const DEEDS = [
  { id:'sweep',    text:'清空过一个街区',   test:() => BLOCKS.some(b => b.pop / b.init < .10) },
  { id:'winter',   text:'有人活过一个冬天', test:() => TOWN.season === '冬' && TOWN.day >= 28 },
  { id:'genset',   text:'把发电机弄回据点', test:() => TOWN.built.some(b => b.kind === '发电机') },
  { id:'day30',    text:'有人活到第 30 天', test:() => TOWN.day >= 30 },
  { id:'ransack',  text:'全镇的柜子都翻过', test:() => TOWN.searched.length > 0 && [...TOWN.searched].every(x => x) },
  { id:'base',     text:'立起过一个据点',   test:() => strongholds().length > 0 },
  { id:'selfkill', text:'杀掉过上一个你',   test:() => TOWN.corpses.some(c => c.killed) },
  { id:'harvest',  text:'收过一茬庄稼',     test:() => !!TOWN.harvested },
];
function checkDeeds() {
  for (const d of DEEDS) if (!TOWN.deeds[d.id] && d.test()) {
    TOWN.deeds[d.id] = TOWN.day; say('镇志又多一条：' + d.text + '。');
  }
  return TOWN.deeds;
}
const deedsLeft = () => DEEDS.filter(d => !TOWN.deeds[d.id]).map(d => d.text);

// ---- 据点 / 加固 / 快进闸门 / 出生点（第七·五节，ADR-0002：不存归属）----
function place(kind, houseId) {
  const hs = TOWN.houses[houseId]; if (!hs) return false;
  const need = kind === '床' ? { 木板:2 } : kind === '储物箱' ? { 木板:1, 钉:1 } : null;
  if (!need) return false;
  for (const m in need) for (let i = 0; i < need[m]; i++) if (!P.inv.includes(m)) return false;
  for (const m in need) for (let i = 0; i < need[m]; i++) P.inv.splice(P.inv.indexOf(m), 1);
  TOWN.built.push({ kind, house:houseId, x:hs.x + 1, y:hs.y + 1 });      // 没有 owner 字段
  noise(hs.x, hs.y, NOISE.锤钉, 6);
  return true;
}
function board(houseId) {
  const hs = TOWN.houses[houseId]; if (!hs) return { did:0, lack:'没这栋房' };
  let did = 0, lack = '';
  for (const e of hs.exits) {
    if (e.kind !== '窗' || e.boards >= 1) continue;
    if (!P.inv.includes('木板')) { lack = '木板'; break; }
    if (!P.inv.includes('钉')) { lack = '钉'; break; }
    P.inv.splice(P.inv.indexOf('木板'), 1); P.inv.splice(P.inv.indexOf('钉'), 1);
    e.boards++; did++; setTile(e.x, e.y, TL.板窗);
    TOWN.built.push({ kind:'窗板', house:houseId, x:e.x, y:e.y });
    noise(hs.x, hs.y, NOISE.锤钉, 4);
  }
  return { did, lack };
}
const strongholds = () => TOWN.houses.filter(h =>
  TOWN.built.some(b => b.kind === '床' && b.house === h.id) &&
  TOWN.built.some(b => b.kind === '储物箱' && b.house === h.id)).map(h => h.id);
function canFastForward() {
  if (!isNight()) return { ok:false, why:'白天一律 1x：每一秒都有决定要做' };
  const hs = P.atHouse != null ? TOWN.houses[P.atHouse] : null;
  if (!hs || !P.inside) return { ok:false, why:'你不在屋里' };
  const open = hs.exits.filter(e => e.kind === '窗' && !e.boards).length;
  if (open) return { ok:false, why:`还有 ${open} 扇窗没钉` };
  const near = Z.filter(z => Math.hypot(z.x - P.x, z.y - P.y) < FF_VIEW).length;
  if (near) return { ok:false, why:`外面有 ${near} 只` };
  return { ok:true, why:'' };
}
const ROADS = [{ x:60, y:H - 1, block:'F' }, { x:90, y:H - 1, block:'F' }, { x:1, y:40, block:'E' }];
function spawnPoint() {
  const sh = strongholds().map(i => TOWN.houses[i]);
  const densest = BLOCKS.slice().sort((a, b) => b.pop - a.pop)[0].id;
  const pool = ROADS.filter(r => r.block !== densest);
  const use = pool.length ? pool : ROADS;
  if (!sh.length) return use[0];
  let best = use[0], bd = -1;
  for (const r of use) {
    const d = Math.min(...sh.map(h => Math.hypot(h.x - r.x, h.y - r.y)));
    if (d > bd) { bd = d; best = r; }
  }
  return best;
}
function sleep(hours) {
  const inSh = P.atHouse != null && strongholds().includes(P.atHouse);
  P.body.疲劳 = 100;
  if (inSh) P.body.情绪 = Math.min(100, P.body.情绪 + 10);
  advanceHours(hours);
  return inSh;
}

// ---- 搜刮 ----
// 【翻开】和【拿走】以前是同一件事 —— 靠近按一下，东西全自动进包，
// 然后才弹一个面板告诉你拿到了什么。那不是操作界面，是事后通知，
// 而且你没有任何选择。现在拆成两件事。
function openContainer(id) {
  const c = TOWN.containers[id]; if (!c) return null;
  if (!TOWN.searched[id]) {                        // 翻动的声音只响第一次
    TOWN.searched[id] = 1;
    noise(c.x, c.y, CONTAINER[c.kind].noise, 20);
    P.seen.add(c.house);
    ev('loot', { item:c.items[0] || '空', container:c.kind, house:c.house });
  }
  P.open = { id, tab:'box' };
  QS.__ui = 'loot';
  return c;
}
// 拿一件。装不下就明说装不下 —— 静默失败是最让人莫名其妙的那种。
function takeItem(id, idx) {
  const c = TOWN.containers[id]; if (!c) return '没有这个容器';
  const n = c.items[idx]; if (n == null) return '';
  const before = loadTier();
  c.items.splice(idx, 1); P.inv.push(n);
  // 拿得下不是问题，【背不背得动】才是。跨过线的那一下要说一声。
  if (loadTier() > before)
    return '拿了 ' + n + '，' + (loadTier() === 2 ? '已经走不动了' : '开始超重了');
  return '拿了 ' + n;
}
// 放回去。容器就是你的临时储藏点 —— 也是超重时唯一的出路。
function putItem(idx) {
  const n = P.inv[idx]; if (n == null || !P.open) return '';
  const c = TOWN.containers[P.open.id]; if (!c) return '';
  P.inv.splice(idx, 1); c.items.push(n);
  return '放回 ' + n;
}
// 老名字留着：量具和机器人都在用它。语义是"翻开，能装下的都拿"。
function lootContainer(id) {
  const c = openContainer(id); if (!c) return [];
  const got = [];
  for (let i = c.items.length - 1; i >= 0; i--) { got.unshift(c.items[i]); c.items.splice(i, 1); P.inv.push(got[0]); }
  if (got.length) say('在' + (TOWN.houses[c.house] || {}).type + '的' + c.kind + '里翻到 ' + got.join('、') + '。');
  return got;
}

// ---- 存档：镇子 / 角色分开，最多三座镇（第七节）----
function towns() {
  const o = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf('qs.town.') === 0) o.push(k.slice(8));
  }
  return o;
}
const canAddTown = seed => towns().includes(String(seed)) || towns().length < TOWN_CAP;
function save() {
  localStorage.setItem('qs.town.' + TOWN.seed, JSON.stringify({
    seed:TOWN.seed, day:TOWN.day, season:TOWN.season,
    blocks:BLOCKS.map(b => ({ id:b.id, pop:b.pop, heat:b.heat, lock:b.lock })),
    waves:WAVES, kills:KILLS, seeped:SEEPED, searched:[...TOWN.searched],
    corpses:TOWN.corpses, built:TOWN.built,
    // 镇志与遗嘱池都属于镇子。遗嘱曾经写成全局的 qs.legacy —— 那会让 A 镇的
    // 遗嘱漏到 B 镇去用，而"上一个你"却来自另一座镇。
    deeds:TOWN.deeds, legacy:TOWN.legacy,
      // 记忆层与血迹属于【镇子】：上一个你探过的地方、清过的街，下一局还在
      seen:[...TOWN.seen], blood:[...TOWN.blood],
    waterDay:TOWN.waterDay, powerDay:TOWN.powerDay, waterOn:TOWN.waterOn, powerOn:TOWN.powerOn,
  }));
  localStorage.setItem('qs.char', JSON.stringify({
    name:P.name, body:P.body, wounds:P.wounds, infect:P.infect, inv:P.inv, worn:P.worn,
    x:P.x, y:P.y, day:TOWN.day, logPages:LOG,
  }));
  return true;
}
// 顺序：先 town（地图变动态）→ 重建可通行判定 → 再 char（市井 T32 的坑）
function load() {
  const t = JSON.parse(localStorage.getItem('qs.town.' + TOWN.seed) || 'null');
  if (!t) return false;
  start(t.seed, true);
  TOWN.day = t.day; TOWN.season = t.season;
  TOWN.searched = new Uint8Array(t.searched);
  TOWN.corpses = t.corpses || []; TOWN.built = t.built || [];
  TOWN.deeds = t.deeds || {}; TOWN.legacy = t.legacy || [];
    if (t.seen) TOWN.seen = new Uint8Array(t.seen);
    if (t.blood) TOWN.blood = new Uint8Array(t.blood);
  TOWN.waterDay = t.waterDay; TOWN.powerDay = t.powerDay;
  TOWN.waterOn = t.waterOn; TOWN.powerOn = t.powerOn;
  BLOCKS.forEach(b => { const s = t.blocks.find(x => x.id === b.id); if (s) Object.assign(b, s); });
  WAVES = t.waves; KILLS = t.kills; SEEPED = t.seeped || 0;
  for (const b of TOWN.built) if (b.kind === '窗板') setTile(b.x, b.y, TL.板窗);
  QS.__pathReady = true;
  const c = JSON.parse(localStorage.getItem('qs.char') || 'null');
  if (c) { Object.assign(P, c, { seen:new Set(), snaps:[] }); LOG = c.logPages || LOG; }
  return true;
}
const wipeChar = () => localStorage.removeItem('qs.char');
const wipeTown = () => localStorage.removeItem('qs.town.' + TOWN.seed);

// ==========================================================================
//  玩家 / 僵尸 / 一局
// ==========================================================================
const JOBS = ['护士','木匠','警察','农民','厨子','闲人'];
const JOB_KIT = {
  // 木匠的家伙占 7 格而腰包只有 6 —— 开局就超格，捡不了任何东西。
  // 给他一个背包：木匠本来就背工具袋，而且顺带让"+12 格"第一天就够得着。
  护士:['绷带','绷带','酒精','止痛药'], 木匠:['背包','锤','木板','木板','钉','钉'],
  警察:['撬棍','手枪','手枪弹'],        农民:['铁锹','罐头','蔬菜'],
  厨子:['菜刀','罐头','罐头','盐'],      闲人:['撬棍','罐头','瓶装水'],
};
function start(seed, keep) {
  genTown((seed | 0) || SEED0);
  BUS = []; LOG = [{ day:1, lines:['电台说电力还能撑两周。'] }]; DEATH = null;
  KILLS = 0; WAVES = 0; SEEPED = 0; FLOWS = [];
  Z = [];
  for (const b of BLOCKS) for (let i = 0; i < b.pop; i++) Z.push(mkZombie(b.id));
  const job = JOBS[ri(JOBS.length)];
  const sp = spawnPoint();
  P = {
    name:'无名', job, jobRow:JOBS.indexOf(job),
    x:sp.x + .5, y:Math.min(H - 2, sp.y) + .5, stance:'走', face:0, frame:0, walkT:0,
    dead:false, inside:false, atHouse:null, seen:new Set(), snaps:[],
    body:{ 饥饿:100, 口渴:100, 疲劳:100, 体温:100, 恐慌:0, 情绪:80 },
    wounds:[], infect:null, bleed:0, wet:false, worn:[], inv:(JOB_KIT[job] || []).slice(),
    open:null,                                     // 当前翻开的容器（面板用）
    wep:null,                                      // 手动选的武器；null = 按优先级自动挑
    swing:0, recover:0, stagger:0, held:0, dura:{}, aim:-Math.PI / 2, kills:0,
    strikeAt:0, strikeW:null, exec:0, combo:0, ivx:0, ivy:0, moving:false,
  };
  say('我是' + job + '。第一天。');
  if (!keep) checkDeeds();
  return QS;
}

// mins = 这一次调用走【几个游戏分钟】，不传就是一整分钟。
//
// 【第一版没有这个参数】：SPEED 的单位是"格 / 游戏分钟"，而主循环每帧调一次，
// 于是玩家实际快了 60 帧 × 0.375 秒 = 22.5 倍 —— 按一下方向键人就飞出半条街。
// 探针发现不了：它一个游戏小时只调 60 次 move()，语义正好是对的。
// 这种错只有手玩或者量"走一秒钟位移了几格"才抓得到。
function movePlayer(dx, dy, stance, mins) {
  if (P.recover > 0 || P.stagger > 0) return;      // 收手 / 踉跄期间挪不动
  const m = mins == null ? 1 : mins;
  P.stance = stance || '走';
  // 斜着走不该快 1.41 倍
  const len = Math.hypot(dx, dy) || 1;
  if (len > 1) { dx /= len; dy /= len; }
  // >25kg 是【走不动】，不是"走得慢"。站在容器边上还能放回去，所以不会把人困死。
  const tier = loadTier();
  if (tier === 2) { say('背得太多了，走不动 —— 得放回点东西'); return; }
  const sp = SPEED[P.stance] * (tier === 1 ? .65 : 1) * m;
  for (const [ax, ay] of [[dx, 0], [0, dy]]) {
    if (!ax && !ay) continue;
    const nx = P.x + ax * sp, ny = P.y + ay * sp;
    if (passable(Math.floor(nx), Math.floor(ny))) { P.x = nx; P.y = ny; }
  }
  P.x = Math.max(.5, Math.min(W - .5, P.x)); P.y = Math.max(.5, Math.min(H - .5, P.y));
  const t = tileAt(Math.floor(P.x), Math.floor(P.y));
  P.inside = (t === TL.地板);
  P.atHouse = null;
  if (P.inside) for (const h of TOWN.houses)
    if (P.x >= h.x && P.x < h.x + h.w && P.y >= h.y && P.y < h.y + h.h) { P.atHouse = h.id; P.seen.add(h.id); break; }
  // 噪音按【游戏分钟】发，不按帧发 —— 否则 60fps 下每秒发 60 次，
  // 热度一秒钟就把全镇僵尸喊过来了。
  const r = NOISE[P.stance === '跑' ? '跑' : P.stance === '蹲行' ? '蹲行' : '走'];
  P.noiseAcc = (P.noiseAcc || 0) + m;
  if (r && P.noiseAcc >= 1) { noise(P.x, P.y, r, P.noiseAcc); P.noiseAcc = 0; }
  else if (!r) P.noiseAcc = 0;
}
// 手上是哪把 —— 背包里最好的那把，没有就是空手
// 【以前没有"装备"这回事】：手上用哪把全靠 WEP_ORDER 这张写死的优先级表挑，
// 你不能选，也没有任何地方告诉你它是怎么挑的 —— "撬棍怎么装备"这个问题
// 之所以答不上来，是因为没有答案。
// 现在 P.wep 是你【选】的那把；没选过就仍然按优先级自动挑（开局不用先做家务）。
function equip(name) {
  if (!WEAPON[name] || !P.inv.includes(name)) return '';
  P.wep = P.wep === name ? null : name;             // 再点一次 = 交回自动
  return P.wep ? '拿起' + name : '改回自动挑（现在是' + weapon() + '）';
}
function weapon() {
  if (P.wep && P.inv.includes(P.wep)) return P.wep;
  for (const w of WEP_ORDER) if (P.inv.includes(w)) return w;
  return '空手';
}
// 挥一下。
//   · 一次只结算【一个】目标：扇形内最近的那只。规则是"别被围"，不是"一刀一片"。
//   · 收手期间不能动（硬直）—— 这是近战的全部代价，也是"三只以上必死"的来源。
//   · 挥空更吵（6）：你没打着，但街上听见了。
// 挥击分两段：按下 → 抬手 → 【中段命中】→ 收手。
// 【第一版在按下的那一瞬就结算完】，而精灵才刚抬手 ——
// 你先拿到结果再看见动作，顺序是反的，手感全毁在这。现在把结算挂在计时器上。
// 取消窗口：收手的最后 38% 可以接下一击或接推开。
// 【取消窗口是动作游戏的核心语法】——它把硬直从"惩罚"变成"要管理的资源"。
const CANCEL = .38;
const inCancel = () => P.swing <= 0 && P.recover > 0 && P.recover <= WEAPON[P.strikeW || weapon()].recoverSec * CANCEL;
function swing() {
  if (P.dead || P.stagger > 0) return '';
  const combo = inCancel();                       // 踩在取消窗口里 = 连击
  if (!combo && (P.swing > 0 || P.recover > 0)) return '还没收手';
  const w = weapon(), W = WEAPON[w];
  const k = combo ? .7 : 1;                       // 连上了就更快 —— 奖励节奏，不奖励乱按
  P.swing = W.swingSec * k; P.recover = W.recoverSec * k; P.held = 0;
  P.strikeAt = P.swing * .55;                     // 挥到 45% 开始判定
  P.strikeW = w;
  P.combo = combo ? (P.combo || 0) + 1 : 0;
  // 出手垫半步：重心跟着武器走，这是"使上劲"的关键
  const lx = P.x + Math.cos(P.aim) * .22, ly = P.y + Math.sin(P.aim) * .22;
  if (passable(Math.floor(lx), Math.floor(ly))) { P.x = lx; P.y = ly; }
  sfx('挥空', combo ? .95 : .8);
  return '';
}
// 返回 true = 这一击已经结算（打中 / 打空但摸到人了）；false = 还没够着，继续扫。
// 【扫掠判定】：第一版只在挥到 45% 那【一瞬】做一次锥形检测，
// 擦身而过、或者那一帧刚好走出锥形的目标全漏掉 —— 打得中打不中像抽签。
function strike() {
  const w = P.strikeW || weapon(), W = WEAPON[w];
  let best = null, bd = 1e9;
  for (const z of Z) {
    // 【倒地的照打】——第一版在这里 continue，于是你把它打趴下之后
    // 接下来十几秒只能挥空，眼睁睁看它爬起来。打倒该是机会，不是锁。
    const d = Math.hypot(z.x - P.x, z.y - P.y);
    if (d > W.reach + .4) continue;
    const a = Math.atan2(z.y - P.y, z.x - P.x);
    if (Math.abs(((a - P.aim + Math.PI * 3) % (Math.PI * 2)) - Math.PI) > SWING_ARC) continue;
    if (d < bd) { bd = d; best = z; }
  }
  if (!best) return false;                        // 这一帧没够着，下一帧接着扫
  noise(P.x, P.y, NOISE.挥击, 1);
  // ---- 处决：对【倒地】的目标是一次独立的动作，不是普通补刀 ----
  if (best.down > 0) {
    P.exec = .45;                                 // 处决姿势持续多久
    const i = Z.indexOf(best); if (i >= 0) Z.splice(i, 1);
    const b = blk(best.block); if (b) b.pop--;
    KILLS++; P.kills++;
    const bi2 = Math.floor(best.y) * TOWN.W + Math.floor(best.x);
    TOWN.blood[bi2] = 3;                          // 处决留一大摊
    HITSTOP = Math.max(HITSTOP, .18); SHAKE = Math.max(SHAKE, 4.2);
    sfx('致命', 1.15);
    wearOut(w); checkDeeds();
    say('结果了它');
    return true;
  }
  // 手臂伤会让你打不中；恐慌【不】管近战（踉跄链已经在罚被围了）
  if (rnd() > accuracy().melee) { say('没打着'); return true; }
  // 蹲着打翻倍（背后偷袭），补刀倒地的也翻倍 —— 这两下是近战仅有的"划算"
  const dmg = W.dmg * (P.stance === '蹲行' ? 2 : 1) * (best.down > 0 ? 2 : 1);
  best.hp -= dmg;
  const dx = best.x - P.x, dy = best.y - P.y, len = Math.hypot(dx, dy) || 1;
  best.x += dx / len * W.push; best.y += dy / len * W.push;   // 打退半步
  if (best.down <= 0) { best.stun = .5; best.state = '追击'; best.tx = P.x; best.ty = P.y; best.lost = 30; }
  best.flash = .13;                               // 受击闪白
  best.hurt = .22;                                // 受击踉跄：往挨打的方向退一下
  best.hurtA = Math.atan2(best.y - P.y, best.x - P.x);
  wearOut(w);
  const wasDown = best.down > 0, lethal = best.hp <= 0;
  // 顿帧：命中冻住 60 毫秒、打死 110 毫秒。这是最便宜的"打到了"。
  HITSTOP = Math.max(HITSTOP, lethal ? .11 : .06);
  SHAKE = Math.max(SHAKE, lethal ? 3.2 : 1.6);
  sfx(lethal ? '致命' : '命中');
  if (best.hp <= 0) {
    const i = Z.indexOf(best); if (i >= 0) Z.splice(i, 1);
    const b = blk(best.block); if (b) b.pop--;
    KILLS++; P.kills++;
    // 【别用 W】：swing() 里的 W 是武器（const W = WEAPON[w]），把全局的地图宽 W=96 遮住了。
    // 乘出来是 NaN，而 Uint8Array[NaN] = x 是【静默无效】的 —— 血一滴都没留，还不报错。
    const bi = Math.floor(best.y) * TOWN.W + Math.floor(best.x);
    TOWN.blood[bi] = Math.min(3, (TOWN.blood[bi] || 0) + (W.dmg > 1 ? 2 : 1));
    checkDeeds();
    say(wasDown ? '补了一下，不动了' : '放倒了一只');
    return true;
  }
  if (!wasDown && best.hp <= 1 && rnd() < .5) {
    // 【打倒不等于打死】：倒地的十几秒后会自己爬起来
    best.down = 12 + rnd() * 8; best.hp = 1;
    say('把它打趴下了（它还会起来）');
    return true;
  }
  say(P.combo ? '连上了' : '打中了');
  return true;
}
// 推开 —— 被围时唯一的答案。
// 挥击一次只打一只、还有硬直，所以"三只按住你 1.5 秒"原来是个【无解】的一秒半。
// 推是范围的、不看武器、不掉血，只制造间距，并且【把被围的计时清零】。
// 代价：它也有硬直，而且推完它们 0.9 秒后又围上来 —— 你得用这一下跑掉或者进门。
function shove() {
  // 【踉跄【不】挡推】：踉跄是"被挤得挥不开"，而推正是用来解它的。
  // 第一版把 stagger 也挡进来了，于是唯一的解法被它要解的那个状态锁住 ——
  // 被围就真的成了无解的一秒半。
  // 收手的最后一段可以【取消】成推开 —— 砍完一刀立刻推开一圈跑，这是动作游戏的基本语法。
  if (P.dead || P.swing > 0) return '还没收手';
  if (P.recover > 0 && !inCancel()) return '还没收手';
  P.recover = .35;
  let n = 0;
  for (const z of Z) {
    if (z.down > 0) continue;
    const d = Math.hypot(z.x - P.x, z.y - P.y);
    if (d > 2.0) continue;
    const a = Math.atan2(z.y - P.y, z.x - P.x);
    if (Math.abs(((a - P.aim + Math.PI * 3) % (Math.PI * 2)) - Math.PI) > Math.PI / 1.6) continue;  // ±112°，比挥击宽
    // 贴到零距离时借它的朝向当方向，不然 (0/0) 推不动
    const len = d > .01 ? d : 1;
    // d≈0 时借【玩家的朝向】往前推，不能借它自己的朝向 —— 它正朝着你
    const ux = d > .01 ? (z.x - P.x) / len : Math.cos(P.aim);
    const uy = d > .01 ? (z.y - P.y) / len : Math.sin(P.aim);
    const nx = z.x + ux * 1.5, ny = z.y + uy * 1.5;
    if (zPassable(Math.floor(nx), Math.floor(z.y))) z.x = nx;
    if (zPassable(Math.floor(z.x), Math.floor(ny))) z.y = ny;
    z.stun = .9; n++;
  }
  P.held = 0;                                   // ← 这一行就是那 1.5 秒里的答案
  noise(P.x, P.y, 3, 1);
  sfx('推开', n ? 1 : .6);
  if (n) { HITSTOP = Math.max(HITSTOP, .04); SHAKE = Math.max(SHAKE, 1.2); }
  return n ? `推开了 ${n} 只` : '推了个空';
}
function wearOut(w) {
  if (w === '空手') return;
  P.dura[w] = (P.dura[w] || 0) + 1;
  if (P.dura[w] >= WEAPON[w].dura) {
    P.inv.splice(P.inv.indexOf(w), 1); delete P.dura[w];
    sfx('断裂'); SHAKE = Math.max(SHAKE, 2.2);
    say(w + '断了。');
  }
}
// 眼前那一格能干什么。
//
// 【顺序是有讲究的】：先看容器，再看门，最后才是窗。
// 第一版按格子顺序一路 return，于是"刚翻进来的那扇窗"排在身边的橱柜前面 ——
// 机器人爬进屋、站在柜子旁边、又从窗户爬了出去，来回一整天只翻到一个柜子，
// 噪音还高得离谱。人不会这样：眼前有柜子就先翻柜子。
function target() {
  const fx = Math.floor(P.x), fy = Math.floor(P.y);
  const cells = [[0,0],[0,-1],[0,1],[-1,0],[1,0]].map(([dx, dy]) => ({ x:fx + dx, y:fy + dy }));
  for (const p of cells) if (tileAt(p.x, p.y) === TL.家具) {
    const c = TOWN.containers.find(c => c.x === p.x && c.y === p.y);
    if (c && !TOWN.searched[c.id]) return { kind:'容器', c, x:p.x, y:p.y };
  }
  for (const p of cells) if (tileAt(p.x, p.y) === TL.门)
    return { kind:'门', d:doorAt(p.x, p.y), x:p.x, y:p.y };
  for (const p of cells) if (tileAt(p.x, p.y) === TL.窗) return { kind:'窗', x:p.x, y:p.y };
  // 翻完的柜子也要能点开看一眼（不然"这个翻过了"这句话永远说不出来）
  for (const p of cells) if (tileAt(p.x, p.y) === TL.家具) {
    const c = TOWN.containers.find(c => c.x === p.x && c.y === p.y);
    if (c) return { kind:'容器', c, x:p.x, y:p.y };
  }
  return null;
}
// 窗的另一边：挑站得住、而且和现在这边不同侧的那一格
function throughWindow(x, y) {
  const here = [Math.floor(P.x), Math.floor(P.y)];
  const cands = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx, dy]) => ({ x:x + dx, y:y + dy }))
    .filter(p => passable(p.x, p.y) && !(p.x === here[0] && p.y === here[1]));
  if (!cands.length) return null;
  // 优先去和当前所在格相对的那一边（真的"穿过去"，不是沿着墙挪一格）
  const opp = cands.find(p => (p.x - x) === -(here[0] - x) && (p.y - y) === -(here[1] - y));
  return opp || cands[0];
}
function interact() {
  const tg = target(); if (!tg) return '眼前没什么可弄的';
  if (tg.kind === '容器') {
    const first = !TOWN.searched[tg.c.id];
    openContainer(tg.c.id);
    // 翻过的柜子照样能开 —— 里面剩下的东西还在，它就是你的临时储藏点。
    return first ? '翻开' + tg.c.kind : tg.c.kind + '里还剩 ' + (tg.c.items.length || '零') + ' 件';
  }
  if (tg.kind === '门') {
    const d = tg.d;
    if (d.locked) {
      if (!P.inv.includes('撬棍')) return '锁着。得有撬棍';
      d.locked = false; noise(tg.x, tg.y, NOISE.撬门, 6);
      return '撬开了（很响）';
    }
    d.open = !d.open; noise(tg.x, tg.y, 3, 1);
    if (!d.open) {
      const n = Z.filter(z => z.state === '追击' && Math.hypot(z.x - tg.x, z.y - tg.y) < 12).length;
      return n ? `门关上了 —— 外面还有 ${n} 只在找你` : '门关上了';
    }
    return '门开了';
  }
  if (tg.kind === '窗') {
    // 【第一版只喊了一声"翻窗过去"，人没动】——
    // 于是探针卡在窗前反复喊，每天的噪音从 55 冲到 752，全镇僵尸都被喊过来，
    // 死因分布里"被围"占到 67%。看着像战斗太难，其实是这一格没把人送过去。
    const e = TOWN.wins[tg.x + ',' + tg.y];
    const far = throughWindow(tg.x, tg.y);
    if (!far) return '窗那边过不去';
    const first = !(e && e.broken);
    if (e) e.broken = true;
    P.x = far.x + .5; P.y = far.y + .5;
    movePlayer(0, 0, P.stance);                        // 重算在不在屋里
    noise(tg.x, tg.y, first ? NOISE.破窗 : 4, 2);
    return first ? '玻璃碎了，翻了进去（很响）' : '翻窗过去';
  }
  return '';
}

// 僵尸：只跑视口附近的。别处每天靠迁移结算（存量模型天生就是 LOD）
// 视锥：朝向 ±60°、视距 6 格（夜里 2.4），玩家蹲着再打七折。
// 贴身 1.2 格内不管朝哪都会发现你 —— 不然可以贴着它脸站一整天。
function sees(z) {
  const d = Math.hypot(z.x - P.x, z.y - P.y);
  if (d < SIGHT.贴身) return true;
  const sight = (isNight() ? SIGHT.夜 : SIGHT.昼) * (P.stance === '蹲行' ? SIGHT.蹲行折扣 : 1);
  if (d > sight) return false;
  if (losBlocked(z.x, z.y, P.x, P.y) > 0) return false;
  const a = Math.atan2(P.y - z.y, P.x - z.x);
  const da = Math.abs(((a - z.dir + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  return da <= SIGHT.视锥;
}

// 特效计时【和世界时间分开走】：顿帧冻住的正是 update()，
// 把 HITSTOP 放进去就永远解不了冻。这几个是真实时间上的东西，不受冻结影响。
let ANIM_T = 0;
function tickFX(dt) {
  ANIM_T += dt;                                   // 动画时钟：呼吸这类东西用它
  if (HITSTOP > 0) HITSTOP = Math.max(0, HITSTOP - dt);
  if (SHAKE > 0) SHAKE = Math.max(0, SHAKE - dt * 14);
  if (toastT > 0) toastT = Math.max(0, toastT - dt);
}

// dt 是现实秒。僵尸和玩家必须用【同一个时间基准】——
// 第一版玩家按游戏分钟走、僵尸按现实秒走，两边差 2.7 倍，看着像僵尸不会动。
function updateZ(dt) {
  const mins = dt / SEC_PER_MIN;
  const R = 26;
  // 挥击与踉跄的计时（现实秒）
  for (const z of Z) if (z.flash > 0) z.flash = Math.max(0, z.flash - dt);
  if (P.exec > 0) P.exec = Math.max(0, P.exec - dt);
  for (const z of Z) if (z.hurt > 0) z.hurt = Math.max(0, z.hurt - dt);
  if (P.swing > 0) {
    P.swing = Math.max(0, P.swing - dt);
    // 挥到中段开始【连续】判定，一直扫到挥完为止
    if (P.strikeAt > 0 && P.swing <= P.strikeAt) {
      if (strike()) P.strikeAt = 0;
      else if (P.swing <= 0) { P.strikeAt = 0; noise(P.x, P.y, NOISE.挥击 + 2, 1); say('挥空了'); }
    }
  } else if (P.recover > 0) P.recover = Math.max(0, P.recover - dt);
  if (P.stagger > 0) P.stagger = Math.max(0, P.stagger - dt);
  // 踉跄链：两只贴身就动不了，三只按住你一秒半就完了
  const hugging = Z.filter(z => z.down <= 0 && Math.hypot(z.x - P.x, z.y - P.y) < STAGGER.贴身).length;
  if (!P.dead) {
    if (hugging >= STAGGER.必死 && P.stance !== '跑') {
      P.held += dt;
      if (P.held >= STAGGER.必死秒) { ev('hurtByHorde', { n:hugging }); die('被围'); }
    } else P.held = Math.max(0, P.held - dt * .6);
    if (hugging >= STAGGER.踉跄 && P.stagger <= 0 && rnd() < dt * 1.6) P.stagger = STAGGER.踉跄秒;
  }
  for (const z of Z) {
    if (Math.abs(z.x - P.x) > R || Math.abs(z.y - P.y) > R) continue;
    // 【倒地与眩晕在最外层处理】——第一版塞在"追击"分支里，
    // 于是游荡状态被打趴下的那只【永远躺着】起不来。
    if (z.down > 0) { z.down -= dt; if (z.down <= 0) z.stun = .8; continue; }
    if (z.stun > 0) { z.stun -= dt; continue; }
    const K = ZOMBIE_KIND[z.kind];
    let sp = SPEED.僵尸游荡;
    if (z.state === '追击') {
      sp = K.chase;
      if (K.burst) {
        // burstSec / coolSec 是【现实秒】，所以按 dt 减，不按 mins 减
        if (z.dash > 0) { sp = K.burst; z.dash -= dt; if (z.dash <= 0) z.tired = K.coolSec; }
        else if (z.tired > 0) { sp = K.after; z.tired -= dt; }            // 冲完这一段就累瘫
        else if (Math.hypot(z.x - P.x, z.y - P.y) < 9) { sp = K.burst; z.dash = K.burstSec; }
      }
      z.lost -= mins;
      if (z.lost <= 0) z.state = '游荡';
    }
    const d = Math.hypot(z.x - P.x, z.y - P.y);
    if (sees(z)) { z.state = '追击'; z.tx = P.x; z.ty = P.y; z.lost = 30; }
    // 游荡：目标要【留着】走一段，不能每帧重摇 —— 每帧重摇的结果是原地发抖，不是在走
    if (z.state !== '追击') {
      z.wt -= mins;
      if (z.wt <= 0 || z.wx == null) {
        z.wt = 8 + rnd() * 14;                       // 八到二十二个游戏分钟换一次方向
        const a = rnd() * 6.283, r = 2 + rnd() * 5;
        z.wx = z.x + Math.cos(a) * r; z.wy = z.y + Math.sin(a) * r;
      }
    }
    const tx = z.state === '追击' ? (z.tx != null ? z.tx : P.x) : z.wx;
    const ty = z.state === '追击' ? (z.ty != null ? z.ty : P.y) : z.wy;
    // 【互相排开】：第一版没有这一步，于是追击时它们全都收敛到玩家【同一个点】，
    // 叠成一摞。后果是"三只贴身"几乎必然发生 —— 手玩的原话是"一下就被打死"。
    // 现在它们围成一圈而不是挤成一堆，能同时贴到你的就那么两三只。
    let sx = 0, sy = 0;
    // 和玩家也要留间距。第一版只做了僵尸之间，于是追击的那只最后【站在你身上】，
    // 距离 0.0 —— 推开时方向向量除出 0，推不动；画面上也只看得见一团。
    {
      const pdx = z.x - P.x, pdy = z.y - P.y, pd = Math.hypot(pdx, pdy);
      if (pd < SEP_P && pd > .0001) { sx += pdx / pd * (SEP_P - pd) * 1.6; sy += pdy / pd * (SEP_P - pd) * 1.6; }
    }
    for (const o of Z) {
      if (o === z || o.down > 0) continue;
      const ddx = z.x - o.x, ddy = z.y - o.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd > SEP || dd < .0001) continue;
      sx += ddx / dd * (SEP - dd); sy += ddy / dd * (SEP - dd);
    }
    const dx = tx - z.x, dy = ty - z.y, len = Math.hypot(dx, dy) || 1;
    const step = sp * mins;
    const nx = z.x + dx / len * step + sx * step * 2.2, ny = z.y + dy / len * step + sy * step * 2.2;
    let moved = false;
    if (zPassable(Math.floor(nx), Math.floor(z.y))) { z.x = nx; moved = true; }
    if (zPassable(Math.floor(z.x), Math.floor(ny))) { z.y = ny; moved = true; }
    // 和玩家的最小间距做成【硬钳位】，不是软力：
    // 软力的平衡点会被后面挤上来的那几只压到 0.38，"不许小于"这种东西就该钳。
    {
      const pdx = z.x - P.x, pdy = z.y - P.y, pd = Math.hypot(pdx, pdy);
      if (pd < SEP_P) {
        const k = pd > .0001 ? SEP_P / pd : 0;
        const cx = k ? P.x + pdx * k : P.x + Math.cos(z.dir) * SEP_P;
        const cy = k ? P.y + pdy * k : P.y + Math.sin(z.dir) * SEP_P;
        if (zPassable(Math.floor(cx), Math.floor(cy))) { z.x = cx; z.y = cy; }
      }
    }
    if (moved) z.dir = Math.atan2(dy, dx);           // 朝着走的方向
    else if (z.state !== '追击') z.wt = 0;            // 撞墙了就换个方向，别顶着墙杵着
    // 贴身：一只咬一口，三只以上按住你
    if (d < .8 && !P.dead && rnd() < .01 * Math.min(4, mins)) bite(rnd() < .5 ? '左小臂' : '右手');
  }
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// 地形【见过就一直记得】，僵尸【只在视锥内才画】。
// 白天视距 16 格 —— 所以雾真正起作用的地方是：你没进过的屋子里面是黑的，以及夜里。
// 四向：0 南 · 1 北 · 2 西 · 3 东。图集列号 = dir*4 + frame。

  if (d < Math.PI * .75) return 0;                              // 南（屏幕 y 向下）

    else { act = verbOf(n) || `${kgOf(n).toFixed(1)}kg`; if (n === held) col = '#3f6b46'; }
    ctx.fillStyle = (!c && isWep && n === held) ? '#2a4a31' : '#3b352e';
    ctx.fillText(n, x + 6, ry + rowH - 4);
    // 纯背包页每行右边留一个【丢】—— 以前只有开着容器才能放回，
    // 在野外背多了就只能站着，这不合理。
    const dropW = c ? 0 : Math.ceil(ctx.measureText('丢').width) + 12;
    ctx.fillStyle = col;
    ctx.fillText(act, x + w - 6 - dropW - ctx.measureText(act).width, ry + rowH - 4);
    if (!c) {
      ctx.fillStyle = '#a8322a';
      ctx.fillText('丢', x + w - 6 - ctx.measureText('丢').width, ry + rowH - 4);
      hitBox(x + w - dropW, ry, dropW, rowH, () => { const it = P.inv[i]; P.inv.splice(i, 1); say('丢了' + it); });
    }
    hitBox(x, ry, w - dropW, rowH, () => say(
      tab === 'box' ? takeItem(P.open.id, i)
      : c ? putItem(i)
      : isWep ? equip(n)
      : (USE[n] || WARM[n] || n === '背包') ? (useItem(n) ? (verbOf(n) === '穿' ? '穿上' : verbOf(n) + '了') + n : '用不了' + n)
      : n + '现在用不上'));
  });
  if (list.length > shown) {
    ctx.fillStyle = '#9b9182';
    ctx.fillText(`还有 ${list.length - shown} 件`, x + 6, ly + shown * rowH + 9);
  }
  // ── 底行 ──
  const by = y + h - 15;
  ctx.fillStyle = '#8d8272'; ctx.fillRect(x, by, w, 1);
  const act = !c ? '' : tab === 'box' ? '全拿' : '全放回';
  ctx.fillStyle = '#2a2622'; ctx.fillText(act, x + 6, by + 11);
  if (c) hitBox(x, by, Math.round(w / 2), 15, () => {
    if (tab === 'box') { let n = 0; for (let i = c.items.length - 1; i >= 0; i--) if (fits(c.items[i])) { P.inv.push(c.items[i]); c.items.splice(i, 1); n++; }
      say(n ? '拿了 ' + n + ' 件' : '一件也装不下'); }
    else { c.items.push(...P.inv.splice(0, P.inv.length)); say('全放回了'); }
  });
  ctx.fillText('关闭', x + w - 6 - ctx.measureText('关闭').width, by + 11);
  hitBox(x + Math.round(w / 2), by, Math.round(w / 2), 15, () => { QS.__ui = 'none'; P.open = null; });
}
function panel(title, body) {
  // 【浮层要把底下压暗】：不压的话两层信息一起抢眼睛，面板上的字读不进去。
  ctx.fillStyle = 'rgba(8,9,10,.66)'; ctx.fillRect(0, 0, CW, CH);
  const lines = String(body).split('\n').filter(l => l !== '').slice(0, 9);
  const v = visX(), m = isTouch ? 10 : 40;
  const w = Math.round(v.x1 - v.x0) - m * 2;
  // 【高度跟着内容走】。原来写死 120 —— 一行也是 120，九行也是 120，
  // 而且 y 钉在画布底下，手机上一半藏在按钮后面。
  const h = Math.min(CH - 24, 30 + Math.max(1, lines.length) * 12 + 12);
  const x = Math.round(v.x0) + m, y = Math.round((CH - h) / 2);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x + 2, y + 2, w, h);   // 一点投影，跟地面分开
  ctx.fillStyle = 'rgba(232,226,206,.97)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#8d8272'; ctx.fillRect(x, y + 20, w, 1);              // 标题和正文之间一道线
  ctx.font = '9px ui-monospace,monospace';
  ctx.fillStyle = '#2a2622'; ctx.fillText(title, x + 8, y + 14);
  ctx.fillStyle = '#3b352e';
  lines.forEach((l, i) => ctx.fillText(l, x + 8, y + 34 + i * 12));
  if (isTouch) { ctx.font = '7px ui-monospace,monospace'; ctx.fillStyle = '#9b9182';
    ctx.fillText('轻点任意处关闭', x + 8, y + h - 5); }
}

// ---- 侧栏（DOM）----
const METERS = document.getElementById('meters'), LOGEL = document.getElementById('log');
function syncPanel() {
  if (isTouch) return;                            // 侧栏在手机上是藏起来的
  METERS.innerHTML = Object.keys(P.body).map(k => {
    const v = Math.round(P.body[k]);
    return `<div class="row"><span>${k}</span><span>${v}</span></div><div class="bar"><i style="width:${v}%"></i></div>`;
  }).join('') + `<div class="row" style="margin-top:6px"><span>${P.job}</span><span>${P.inv.length} 件</span></div>`;
  const pg = LOG[LOG.length - 1] || { day:1, lines:[] };
  LOGEL.innerHTML = `<b>第 ${pg.day} 天</b><br>` + (pg.lines.slice(-8).join('<br>') || '—');
}

// ==========================================================================
//  输入与主循环
// ==========================================================================
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = 1;
  if (e.code === 'KeyE') say(interact());
  if (e.code === 'Space') { say(swing()); e.preventDefault(); }
  if (e.code === 'KeyQ') say(shove());
  if (e.code === 'KeyM') { MUTED = !MUTED; say(MUTED ? '静音' : '开声'); }
  if (e.code === 'Tab') {
    if (QS.__ui === 'loot') { QS.__ui = 'none'; P.open = null; }
    else { P.open = null; QS.__ui = 'loot'; }      // 纯背包：没有容器
    e.preventDefault();
  }
  if (e.code === 'KeyJ') QS.__ui = QS.__ui === 'log' ? 'none' : 'log';
  if (e.code === 'KeyP') RUN = !RUN;
  if (e.code === 'Escape') { QS.__ui = 'none'; P.open = null; }
  // 桌面上用数字键拿第几件 —— 面板是画在画布上的，没有 DOM 焦点可用
  if (QS.__ui === 'loot' && P.open && /^Digit[1-9]$/.test(e.code)) {
    const i = +e.code.slice(5) - 1;
    say(P.open.tab === 'box' ? takeItem(P.open.id, i) : putItem(i));
  }
  if (QS.__ui === 'loot' && P.open && e.code === 'KeyB') P.open.tab = P.open.tab === 'box' ? 'bag' : 'box';
});
addEventListener('keyup', e => { keys[e.code] = 0; });
addEventListener('resize', fit);
// 桌面：朝向跟着鼠标 —— 近战一次只打得中扇形里最近的一只，朝哪很重要
cv.addEventListener('mousemove', e => {
  P.mouse = true;
  const b = cv.getBoundingClientRect();
  const sx = (e.clientX - b.left) / b.width * CW, sy = (e.clientY - b.top) / b.height * CH;
  P.aim = Math.atan2(sy - (P.y * TS - cam.y), sx - (P.x * TS - cam.x));
});
// 画布坐标：跟缩放倍率无关，直接按 rect 折算
function canvasPt(cx, cy) {
  const r = cv.getBoundingClientRect();
  return { x:(cx - r.left) / r.width * CW, y:(cy - r.top) / r.height * CH };
}
cv.addEventListener('mousedown', e => {
  if (QS.__ui === 'loot') {                        // 面板开着的时候，点击先给面板
    const p = canvasPt(e.clientX, e.clientY);
    if (uiTap(p.x, p.y)) { e.preventDefault(); return; }
    e.preventDefault(); return;                    // 点在面板外面也不该挥刀
  }
  if (e.button === 0) say(swing());
  if (e.button === 2) say(shove());          // 右键 = 推开
  e.preventDefault();
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---- 触屏：摇杆 + 三个键 ----
// 监听器【总是装上】，不因为开局猜错就永久失效（霓虹教训十三）：
// 触屏笔记本、外接触摸屏、开局没碰屏幕的情况都走得通。
const TC = { on:false, dx:0, dy:0, run:false, crouch:false };
let isTouch = matchMedia('(pointer:coarse)').matches;
function goTouch() { isTouch = true; document.body.classList.add('touch'); layout(); }
if (isTouch) document.body.classList.add('touch');
addEventListener('touchstart', goTouch, { once:true, passive:true });
{
  const stk = document.getElementById('stk'), knob = stk.firstElementChild;
  let id = null, cx = 0, cy = 0;
  const R = 46;
  const set = (x, y) => {
    let dx = x - cx, dy = y - cy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    TC.dx = dx / R; TC.dy = dy / R; TC.on = true;
    knob.style.transform = `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`;
  };
  const release = () => { id = null; TC.on = false; TC.dx = TC.dy = 0; knob.style.transform = ''; };
  stk.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; id = t.identifier;
    const b = stk.getBoundingClientRect(); cx = b.left + b.width / 2; cy = b.top + b.height / 2;
    set(t.clientX, t.clientY); e.preventDefault();
  }, { passive:false });
  addEventListener('touchmove', e => {
    if (id === null) return;
    for (const t of e.changedTouches) if (t.identifier === id) { set(t.clientX, t.clientY); e.preventDefault(); }
  }, { passive:false });
  for (const ev of ['touchend', 'touchcancel']) addEventListener(ev, e => {
    if (id === null) return;
    for (const t of e.changedTouches) if (t.identifier === id) release();
  });
  // 切后台会松开摇杆，回来不会还按着（霓虹踩过）
  addEventListener('visibilitychange', () => { if (document.hidden) { release(); TC.run = TC.crouch = false; } });
  const hold = (el, k) => {
    el.addEventListener('touchstart', e => { TC[k] = true; el.classList.add('on'); e.preventDefault(); }, { passive:false });
    for (const ev of ['touchend', 'touchcancel'])
      el.addEventListener(ev, e => { TC[k] = false; el.classList.remove('on'); e.preventDefault(); }, { passive:false });
  };
  hold(document.getElementById('bR'), 'run');
  hold(document.getElementById('bC'), 'crouch');
  // 手机：短按挥，长按（0.28 秒）推 —— 被围的时候按住不放就是推开
  const bA = document.getElementById('bA');
  let aT = 0, aTimer = 0;
  bA.addEventListener('touchstart', e => {
    aT = Date.now(); bA.classList.add('on'); e.preventDefault();
    aTimer = setTimeout(() => { aT = 0; say(shove()); bA.textContent = '推'; }, 280);
  }, { passive:false });
  for (const ev of ['touchend', 'touchcancel']) bA.addEventListener(ev, () => {
    clearTimeout(aTimer); bA.classList.remove('on'); bA.textContent = '挥';
    if (aT && Date.now() - aT < 280) say(swing());
    aT = 0;
  });
  const bE = document.getElementById('bE');
  // 【别靠"id 会挂到 window 上"这条运气】—— 量具的 DOM stub 不会有那一手。
  const bJ = document.getElementById('bJ'), bP = document.getElementById('bP');
  const mclose = document.getElementById('mclose');
  bP.addEventListener('touchstart', e => {
    if (QS.__ui === 'loot' && !P.open) QS.__ui = 'none';
    else { P.open = null; QS.__ui = 'loot'; }     // 纯背包页：换武器、吃东西、穿衣服
    e.preventDefault();
  }, { passive:false });
  bJ.addEventListener('touchstart', e => { QS.__ui = QS.__ui === 'log' ? 'none' : 'log'; e.preventDefault(); }, { passive:false });
  mclose.addEventListener('touchstart', e => {
    const t = e.changedTouches[0], p = canvasPt(t.clientX, t.clientY);
    // 先给面板：点在行上是"拿/放回"，点空白才是关闭
    if (!uiTap(p.x, p.y)) { QS.__ui = 'none'; P.open = null; }
    e.preventDefault();
  }, { passive:false });
  bE.addEventListener('touchstart', e => { say(interact()); bE.classList.add('on'); e.preventDefault(); }, { passive:false });
  for (const ev of ['touchend', 'touchcancel'])
    bE.addEventListener(ev, () => bE.classList.remove('on'));
}
// fit() 要听可视视口和横竖屏切换 —— 地址栏收起、转屏都会改它（霓虹教训五）
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(layout, 150));

let RUN = true, last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (!RUN || !P || P.dead) { if (P) render(); return; }
  tickFX(dt);
  // 顿帧：命中的那几十毫秒把世界冻住，但照常画。
  // 这是"打到了"最便宜也最有效的一个信号 —— 比任何粒子都管用。
  if (HITSTOP > 0) { render(); return; }
  // 键盘和摇杆走同一条路：摇杆推到底才算跑（除非按着"跑"）
  const mag = Math.hypot(TC.dx, TC.dy);
  const dx = TC.on ? TC.dx : (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const dy = TC.on ? TC.dy : (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const st = (keys.ControlLeft || keys.ControlRight || TC.crouch) ? '蹲行'
           : (keys.ShiftLeft || keys.ShiftRight || TC.run || (TC.on && mag > .92)) ? '跑' : '走';
  const mins = dt / SEC_PER_MIN;
  // 【加减速】：输入向量做指数平滑，起步和停步各有约 0.12 秒的过渡。
  // 瞬间起步、瞬间停死是"僵硬"的另一半。平滑只加在主循环里 ——
  // move() 本身的语义不能动，探针和验收按"一次 = 一个游戏分钟"在用它。
  const k = 1 - Math.exp(-dt * 16);
  P.ivx = (P.ivx || 0) + (dx - (P.ivx || 0)) * k;
  P.ivy = (P.ivy || 0) + (dy - (P.ivy || 0)) * k;
  const mag2 = Math.hypot(P.ivx, P.ivy);
  P.moving = mag2 > .08;
  if (P.moving) {
    movePlayer(P.ivx, P.ivy, st, mins);
    if (dx || dy) { if (isTouch || !P.mouse) P.aim = Math.atan2(dy, dx); }
    // 步频跟【实际速度】走，不是跟按键走 —— 慢慢挪的时候腿也该慢慢迈
    P.walkT += dt * (st === '跑' ? 10.5 : st === '蹲行' ? 4 : 6.4) * Math.min(1, mag2);
    // 一个步循环 = walkT 走过 4 个单位；相位在循环里【不均匀】地切帧
    const nf = frameAt((P.walkT % 4) / 4, st === '跑', (dirOf(P.aim) & 3) >= 2);
    if (nf !== P.frame && (nf === 0 || nf === 2)) sfx('脚步', st === '跑' ? .5 : .28);
    P.frame = nf;
  } else { P.frame = 0; P.walkT = 0; }
  updateZ(dt);
  // 时钟：白天 1x，1 游戏时 = 22.5 秒现实
  acc += mins;
  TOWN.min += acc; acc = 0;
  while (TOWN.min >= 60) { TOWN.min -= 60; advanceHours(1); }
  render(); syncPanel();
}

// ==========================================================================
//  验收钩子（契约见 tools/street-stub.js 头部）
// ==========================================================================
const QS = {
  HOUSE_TYPE, ROOM_GRAMMAR, CONTAINER, LOOT, ITEMS, RECIPES, WOUND, NOISE, SPEED,
  ZOMBIE_KIND, INFECT_TEXT, TEMP_BASE, DEEDS, DRAW_PATHS, ROADS, TL, PLAN, SIGHT,
  W, H, TS, RS, SEEP_CAP, TOWN_CAP, FF_VIEW, TOUCH_MIN, TOUCH_MAX,
  get VW() { return VW; }, get VH() { return VH; }, get CSS_SCALE() { return CSS_SCALE; }, layout,
  start, update:(dt) => { updateZ(dt); }, render, migrate, noise, tileHash, losBlocked,
  pathStep, reachAudit, passable, zPassable,
  move:movePlayer, lootContainer, useItem, treat, drinkFrom, advanceHours, sleep, interact,
  equip, get wep() { return P && P.wep; }, toastW, visX, treatNext, nextStep, STEP_ITEM,
  place, board, strongholds, canFastForward, spawnPoint, checkDeeds, deedsLeft, accuracy, warmth,
  openContainer, takeItem, putItem, loadKg, loadTier, kgLine, PACK_KG,
  uiTap, get uiHit() { return UI_HIT; },
  swing, strike, shove, weapon, WEAPON, WEP_ORDER, STAGGER, SWING_ARC, WAVE_N, SEP, SEP_P,
  inCancel, CANCEL, poseSlot, get animT() { return ANIM_T; },
  frameAt, WALK_BEAT, WALK_BEAT_P, RUN_BEAT,
  sfx, SFX, tickFX, get hitstop() { return HITSTOP; }, get shake() { return SHAKE; }, get toast() { return toastMsg; },
  setMute:v => { MUTED = !!v; }, get muted() { return MUTED; },
  canSee, SIGHT_T, clutterAt, CLUTTER, CLUTTER_OUT, CLUTTER_IN, TILESET, FACE_ART, FACE_BAKED,
  setFog:v => { FOG = !!v; }, get fog() { return FOG; },
  // 触屏模式得能从外面扳 —— 不然"人会不会被按钮埋掉"这条只能靠读源码猜
  setTouch:v => { isTouch = !!v; document.body.classList.toggle('touch', !!v); },
  get touch() { return isTouch; },
  clutterOffset, get cam() { return cam; }, wallMask, wallLike, WTH, boxGeom, WALL_H, PROP_H,
  dirOf,
  bite, die, wave, kill, deathReport, save, load, wipeChar, wipeTown, towns, canAddTown,
  setUI:s => { QS.__ui = s; }, night:on => { TOWN.hour = on ? 22 : 12; },
  get TOWN() { return TOWN; }, get BLOCKS() { return BLOCKS; }, get Z() { return Z; },
  get P() { return P; }, get LOG() { return LOG; }, get death() { return DEATH; },
  get bus() { return BUS; }, get kills() { return KILLS; }, get waves() { return WAVES; },
  get seeped() { return SEEPED; }, get __flows() { return FLOWS; }, get __drawn() { return DRAWN; },
  get __order() { return ORDER; }, WALL_H, PROP_H,
  __ui:'none', __pathReady:false,
};
window.QS = QS;
bakeTiles(); bakeClutter(); bakeBuild();
start(SEED0);
layout();
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
