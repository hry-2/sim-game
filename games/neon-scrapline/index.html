<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Neon Scrapline — 赛博朋克像素俯视角生存射击，纯前端单文件。">
<style>html,body{margin:0;background:#04060c;overflow:hidden;overscroll-behavior:none}
img{max-width:100%}[hidden]{display:none!important}</style>
<title>Neon Scrapline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap">
<style>
  :root{
    --ink:#04060c;
    --deep:#0a1020;
    --steel:#7b89ab;
    --cyan:#45f0ff;
    --mag:#ff2ea6;
    --amber:#ffb347;
    --tox:#7cff4f;
    --danger:#ff3b5c;
    --mono:'Share Tech Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Press Start 2P','Share Tech Mono',monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ink);color:var(--steel);
    font-family:var(--mono);
    overflow:hidden;
    height:100vh;height:100dvh;          /* dvh 跟着地址栏收放走，100vh 在手机上会偏高 */
    display:grid;place-items:center;
    user-select:none;-webkit-user-select:none;
  }
  #stage{position:relative;touch-action:none}
  .screen,#levelup,#hud,.layer{line-height:1.4}
  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    background:#04060c;
    box-shadow:0 0 0 1px #16213a, 0 0 60px rgba(69,240,255,.10), 0 0 160px rgba(255,46,166,.07);
    cursor:crosshair;
  }
  .layer{position:absolute;inset:0;pointer-events:none}

  /* ---------- 义体档案（标题页上的成长面板） ---------- */
  #prof{margin:10px auto 2px;max-width:520px;display:flex;flex-direction:column;gap:5px;
    font:500 11px/1.5 var(--mono,monospace);letter-spacing:.04em}
  #prof .prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
  #prof .plbl{color:#5d7392;letter-spacing:.16em;margin-right:2px}
  #prof b{color:#45f0ff;font-weight:600;margin-right:8px}
  #prof .chip{font:inherit;color:#a9c0dc;background:rgba(12,22,38,.6);
    border:1px solid #223252;padding:3px 9px;cursor:pointer;letter-spacing:.04em}
  #prof .chip:hover{border-color:#45f0ff;color:#eaf6ff}
  #prof .chip.on{color:#04060c;background:#45f0ff;border-color:#45f0ff}
  #prof .chip.lock{color:#3e4c63;border-color:#182541;cursor:not-allowed}
  #prof .chip.lock:hover{border-color:#182541;color:#3e4c63}
  #prof .next{color:#ffb03a;letter-spacing:.08em;margin-top:2px}

  /* ---------- 触屏 ---------- */
  /* 盖满整个视口，不是只盖画布：竖屏时画布只占屏幕中间一条，
     而拇指是放在屏幕最下面的 */
  #tc{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
  body.touch #tc.play{display:block}
  /* 暂停时摇杆和动作键收起来，但系统键必须留着 —— 否则点不回来 */
  #tc.paused .stk,#tc.paused .tbtns{display:none}
  #tc .tsys{position:absolute;display:flex;gap:8px;pointer-events:none;
    right:calc(12px + env(safe-area-inset-right,0px));
    top:calc(54px + env(safe-area-inset-top,0px))}
  #tc .tsys button{pointer-events:auto;width:44px;height:44px;border-radius:50%;
    font:600 11px/1 var(--mono,monospace);color:#9fb4cc;background:rgba(10,18,32,.6);
    border:1px solid rgba(120,150,190,.3);-webkit-tap-highlight-color:transparent}
  #tc .tsys button:active{background:rgba(69,240,255,.2);color:#eaf6ff}
  #tc .tsys button.off{color:#4c5468;border-color:#1d2740}
  #tc .stk{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;
    border:2px solid rgba(69,240,255,.30);background:rgba(10,20,34,.26);
    opacity:0;transition:opacity .1s;pointer-events:none}
  #tc .stk.on{opacity:1}
  #tc .stk i{position:absolute;left:50%;top:50%;width:38px;height:38px;border-radius:50%;
    background:rgba(69,240,255,.42);box-shadow:0 0 10px rgba(69,240,255,.5)}
  #tc .stk.r{border-color:rgba(255,46,166,.32)}
  #tc .stk.r i{background:rgba(255,46,166,.45);box-shadow:0 0 10px rgba(255,46,166,.5)}
  #tc .tbtns{position:absolute;display:flex;flex-direction:column;gap:10px;pointer-events:none;
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #tc .tbtns button{pointer-events:auto;width:58px;height:58px;border-radius:50%;
    font:600 12px/1 var(--mono,monospace);letter-spacing:.06em;
    color:#cfe8ff;background:rgba(12,22,38,.62);border:1px solid rgba(69,240,255,.35);
    box-shadow:0 0 12px rgba(69,240,255,.12);-webkit-tap-highlight-color:transparent}
  #tc .tbtns button:active{background:rgba(69,240,255,.22)}
  /* 竖屏原来只占屏幕中间一条，所以要催人横过来。现在竖屏也铺满、而且看得更高，
     催就没道理了 —— 改成只提一句「横屏更宽」，几秒后自己走。 */
  #rotHint{display:none}
  body.touch.portrait #rotHint{display:block;position:fixed;left:50%;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;
    opacity:0;animation:rot 7s ease-in-out forwards;
    transform:translateX(-50%);padding:5px 12px;font:600 11px/1 var(--mono,monospace);
    letter-spacing:.12em;color:#ffd97a;background:rgba(8,14,26,.8);
    border:1px solid rgba(255,217,122,.35);white-space:nowrap}
  @keyframes rot{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0}}

  /* ---------- HUD ---------- */
  #hud{
    display:flex;flex-direction:column;gap:6px;
    padding:10px 12px;font-size:11px;letter-spacing:.06em;
  }
  /* 画布现在顶到屏幕边缘（viewport-fit=cover），所以 HUD 得自己让开刘海和圆角。
     以前画布是居中缩在中间的，天然离边很远，用不着管这个。 */
  body.touch #hud{
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    padding-left:calc(12px + env(safe-area-inset-left,0px));
    padding-right:calc(12px + env(safe-area-inset-right,0px));
  }
  body.touch #buffs{
    left:calc(14px + env(safe-area-inset-left,0px));
    top:calc(78px + env(safe-area-inset-top,0px));
  }
  #hud .row{display:flex;align-items:center;gap:10px}
  #hud .row.top{justify-content:space-between}
  .lbl{color:#5d6b8c;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
  .bar{
    position:relative;height:7px;flex:1;max-width:190px;
    background:#0b1224;border:1px solid #1d2b4a;
  }
  .bar > i{position:absolute;inset:0;width:0%;display:block;transition:width .12s linear}
  #hpFill{background:linear-gradient(90deg,#ff2ea6,#ff6b6b);box-shadow:0 0 10px rgba(255,46,166,.7)}
  #xpFill{background:linear-gradient(90deg,#45f0ff,#7cff4f);box-shadow:0 0 10px rgba(69,240,255,.7)}
  .num{font-family:var(--disp);font-size:11px;color:#c9d6f0;font-variant-numeric:tabular-nums}
  .tag{
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid currentColor;padding:2px 6px;color:#3d4d70;
  }
  #waveTag{color:var(--amber)}
  #dashPip{display:flex;gap:3px}
  #dashPip span{width:14px;height:5px;background:#16223c;border:1px solid #223252}
  #dashPip span.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan);border-color:var(--cyan)}
  #comboWrap{
    position:absolute;right:14px;top:60px;text-align:right;
    font-family:var(--disp);font-size:14px;color:var(--amber);
    opacity:0;transition:opacity .2s;text-shadow:0 0 12px rgba(255,179,71,.8)
  }
  /* 增益条：没有倒计时的话「超频还剩几秒、要不要现在压上去」就无从判断，
     那这套增益就只是随机变强，不是决策。 */
  #buffs{position:absolute;left:14px;top:78px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  #buffs .bf{
    font-family:var(--disp);font-size:10px;letter-spacing:1px;color:var(--c);width:76px;
    border:1px solid var(--c);border-radius:2px;padding:2px 5px;background:rgba(4,6,14,.62);
    text-shadow:0 0 8px var(--c)
  }
  #buffs .bf i{display:block;height:2px;margin-top:3px;background:var(--c);box-shadow:0 0 6px var(--c)}
  #banner{
    position:absolute;left:0;right:0;top:38%;text-align:center;
    font-family:var(--disp);font-size:20px;color:var(--cyan);
    text-shadow:0 0 18px rgba(69,240,255,.8);
    opacity:0;transition:opacity .35s;
  }
  #banner small{display:block;margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mag)}

  /* ---------- screens ---------- */
  .screen{
    position:absolute;inset:0;display:none;
    place-content:center;justify-items:center;gap:0;
    background:radial-gradient(120% 90% at 50% 30%,rgba(10,16,32,.82),rgba(4,6,12,.96));
    pointer-events:auto;text-align:center;padding:24px;
  }
  .screen.show{display:grid}
  h1{
    font-family:var(--disp);font-size:clamp(20px,4.2vw,40px);margin:0;
    color:#eaf6ff;letter-spacing:.02em;line-height:1.35;text-wrap:balance;
  }
  h1 em{font-style:normal;color:var(--mag);text-shadow:0 0 22px rgba(255,46,166,.75)}
  .sub{margin:14px 0 0;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#63739a}
  .keys{
    margin:26px 0 0;display:grid;grid-template-columns:repeat(2,auto);gap:8px 26px;
    font-size:12px;color:#8b9ac0;justify-content:center;
  }
  .keys b{color:var(--cyan);font-weight:400}
  .btn{
    margin-top:28px;font-family:var(--disp);font-size:12px;
    background:transparent;color:var(--cyan);border:1px solid var(--cyan);
    padding:12px 22px;cursor:pointer;letter-spacing:.06em;
    box-shadow:0 0 18px rgba(69,240,255,.25) inset,0 0 18px rgba(69,240,255,.2);
  }
  .btn:hover,.btn:focus-visible{background:var(--cyan);color:#04060c;outline:none}
  #over h1{color:var(--danger);text-shadow:0 0 24px rgba(255,59,92,.6)}
  .stats{
    margin:22px 0 0;display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));
    gap:1px;background:#1a2540;border:1px solid #1a2540;
  }
  .stats div{background:#080d18;padding:12px 14px;line-height:1.3}
  .stats span{display:block;font-size:9px;letter-spacing:.18em;color:#56658a;text-transform:uppercase}
  .stats strong{display:block;margin-top:6px;font-family:var(--disp);font-size:15px;color:#dceaff;font-weight:400}

  /* ---------- level up cards ---------- */
  #levelup{
    position:absolute;inset:0;display:none;
    align-content:center;justify-items:center;
    background:linear-gradient(rgba(4,6,12,.5),rgba(4,6,12,.88));
    pointer-events:auto;padding:20px;
  }
  #levelup.show{display:grid}
  #levelup .head{font-family:var(--disp);font-size:13px;color:var(--tox);text-shadow:0 0 14px rgba(124,255,79,.6);margin-bottom:4px}
  #levelup .hint{font-size:10px;letter-spacing:.2em;color:#54648a;margin-bottom:20px;text-transform:uppercase}
  #cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .card{
    width:172px;min-height:172px;padding:16px 14px;cursor:pointer;
    background:linear-gradient(160deg,#0c1426,#070b16);
    border:1px solid #22304f;
    display:flex;flex-direction:column;gap:8px;
    text-align:left;color:#9fb0d4;font-family:var(--mono);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-5px);border-color:var(--cyan);outline:none;
    box-shadow:0 0 24px rgba(69,240,255,.22);
  }
  .card .k{font-size:9px;letter-spacing:.18em;color:#4c5c80}
  .card .icon{font-family:var(--disp);font-size:17px;color:var(--cyan)}
  .card h3{margin:0;font-size:14px;color:#e6f2ff;font-weight:400;letter-spacing:.04em}
  .card p{margin:0;font-size:11px;line-height:1.55;color:#8494b8}
  .card .stack{margin-top:auto;font-size:9px;letter-spacing:.14em;color:#3f4e70}
  .card.rare{border-color:#4b2e63}
  .card.rare .icon{color:var(--mag)}
  .card.rare:hover{border-color:var(--mag);box-shadow:0 0 24px rgba(255,46,166,.25)}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
  }
</style>

<div id="stage">
  <canvas id="game" width="320" height="180"></canvas><!-- 尺寸由 fit() 按视口比例重设 -->

  <div class="layer" id="hud">
    <div class="row top">
      <div class="row">
        <span class="lbl">整合度</span>
        <span class="bar"><i id="hpFill"></i></span>
        <span class="num" id="hpTxt">100</span>
      </div>
      <div class="row">
        <span class="tag" id="waveTag">WAVE 01</span>
        <span class="num" id="scoreTxt">0</span>
      </div>
    </div>
    <div class="row">
      <span class="lbl">义体等级</span>
      <span class="num" id="lvTxt">1</span>
      <span class="bar"><i id="xpFill"></i></span>
      <span class="lbl">冲刺</span>
      <span id="dashPip"><span></span></span>
      <span class="lbl">武器</span>
      <span class="tag" id="wepTxt">脉冲步枪</span>
    </div>
  </div>

  <div class="layer" id="tc">
    <div class="stk" id="stkL"><i></i></div>
    <div class="stk r" id="stkR"><i></i></div>
    <div class="tbtns"><button id="btnDash">冲刺</button><button id="btnWep">枪</button></div>
    <div class="tsys"><button id="btnPause">暂停</button><button id="btnMute">音乐</button></div>
    <div id="rotHint">横过来左右视野更宽</div>
  </div>

  <div class="layer" id="buffs"></div>
  <div class="layer" id="comboWrap"><span id="comboTxt"></span></div>
  <div class="layer" id="banner"></div>

  <div class="screen show" id="title">
    <h1>NEON <em>SCRAPLINE</em></h1>
    <p class="sub">下城区 · 废钢回收线 · 生存射击</p>
    <div class="keys">
      <div><b>WASD</b> 移动</div><div><b>鼠标</b> 瞄准 / 左键开火</div>
      <div><b>空格</b> 相位冲刺</div><div><b>P</b> 暂停 · <b>M</b> 静音</div>
      <div><b>手柄</b> 左摇杆移动 / 右摇杆瞄准开火</div><div><b>RT·B·X</b> 开火 / 冲刺 / 换枪</div>
    </div>
    <p class="sub" id="titleBest"></p>
    <div id="prof"></div>
    <button class="btn" id="startBtn">接 入 神 经 索</button>
  </div>

  <div id="levelup">
    <div class="head">义 体 升 级</div>
    <div class="hint">选择一条改装 · 按 1 / 2 / 3</div>
    <div id="cards"></div>
  </div>

  <div class="screen" id="over">
    <h1>连 接 中 断</h1>
    <p class="sub" id="overSub">义体在第 1 波被拆解</p>
    <div class="stats">
      <div><span>得分</span><strong id="oScore">0</strong></div>
      <div><span>存活波次</span><strong id="oWave">0</strong></div>
      <div><span>拆解数</span><strong id="oKills">0</strong></div>
    </div>
    <p class="sub" id="overBuild"></p>
    <p class="sub" id="overBest"></p>
    <p class="sub" id="overGain"></p>
    <button class="btn" id="retryBtn">重 新 接 入 &nbsp;[R]</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 常量 ================= */
// 参考视野 320×180。手机上要铺满屏幕，所以真正的 VW/VH 跟着视口宽高比变：
// 规则是「参考框永远完整装在里面」，多出来的空间填成更多可见战场，而不是黑边。
// 这样不管什么屏，任何一个方向上看到的都不会比 320×180 少。
const REF_W = 320, REF_H = 180;
let VW = REF_W, VH = REF_H;
// 视野可能比场地还大（冷却塔只有 608 高，竖屏能看到 690）。
// 那时候不能再夹相机，得把场地摆在中间，否则 clamp 的上界比下界还小。
const camAt = (v, span, view) => span > view ? clamp(v, 0, span - view) : (span - view) / 2;
/* 场地：每打掉一个 BOSS 就换一张，形状、装饰色、网格色都不一样。
   ARENA 是对象，所以只改字段不重新赋值 —— 二十多处引用一个都不用动。 */
const ARENAS = [
  { n: '废钢回收线', w: 1216, h: 768,  props: 84, c1: '#ff2ea6', c2: '#45f0ff', grid: '69,240,255',  lane: '255,46,166' },
  { n: '熔渣池',     w: 1024, h: 1024, props: 62, c1: '#ff9d3d', c2: '#ff2f4f', grid: '255,157,61',  lane: '255,47,79' },
  { n: '冷却塔',     w: 1440, h: 608,  props: 98, c1: '#45f0ff', c2: '#a45cff', grid: '164,92,255',  lane: '69,240,255' },
];
let ARENA_I = 0;
const ARENA = { w: ARENAS[0].w, h: ARENAS[0].h, a: ARENAS[0] };
const TAU = Math.PI * 2;
const PROPS = [], DUST = [];

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');
// bloom 降采样缓冲
// 尺寸在 fit() 里跟着 VW/VH 重设 —— 写死 80×45 的话换了分辨率辉光就错位
const b1 = document.createElement('canvas'); b1.width = REF_W >> 2; b1.height = REF_H >> 2;
const b1x = b1.getContext('2d');
const b2 = document.createElement('canvas'); b2.width = REF_W >> 3; b2.height = REF_H >> 3;
const b2x = b2.getContext('2d');

/* ================= 工具 ================= */
/* ================= 随机源 =================
   仓库的规矩是不用 Math.random（市井那边写在文档里）。这里补上，顺带换来两样东西：
   每日局、以及"同一个种子能复现"。

   关键是【分流】：刷怪和三选一各走自己的随机流，别和粒子、暴击混在一起。
   混在一起的话，你多打一发子弹，下一次三选一的三张卡就变了 ——
   那"每日局大家一样"就不成立了。 */
function mkRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}
const RNG = { fx: mkRng(1), wave: mkRng(2), card: mkRng(3) };
function seedRun(seed) {
  RNG.fx = mkRng(seed ^ 0x9e3779b9);       // 粒子、暴击、护盾 —— 不影响公平
  RNG.wave = mkRng(seed ^ 0x85ebca6b);     // 刷怪表、掉落、场景装饰
  RNG.card = mkRng(seed ^ 0xc2b2ae35);     // 升级三选一
}
// 字符串 → 种子（FNV-1a）。每日局的种子就是当天的日期。
function strSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const dayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

const rnd  = (a, b) => a + RNG.fx() * (b - a);          // 默认流：粒子、抖动、暴击
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const rndw = (a, b) => a + RNG.wave() * (b - a);        // 刷怪流：同一个种子刷出同一批怪
const pickw = arr => arr[(RNG.wave() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[(RNG.fx() * arr.length) | 0];
const len  = (x, y) => Math.hypot(x, y);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

function genScenery() {
  const A = ARENA.a;
  PROPS.length = 0; DUST.length = 0;
  for (let i = 0; i < A.props; i++) {
    const t = RNG.wave();
    PROPS.push({
      x: rndw(24, ARENA.w - 24), y: rndw(24, ARENA.h - 24),
      w: rndi(8, 30), h: rndi(3, 8),
      k: t < .40 ? 'strip' : t < .74 ? 'crate' : 'vent',
      c: RNG.wave() < .55 ? A.c1 : A.c2,
      v: RNG.wave() < .5,
      ph: rndw(0, TAU)

  }
  for (let i = 0; i < 90; i++)

function setArena(i, announce) {

function sprite(rows, pal) {

    t.fillRect(x, y, 1, 1);
  }
  return c;
}

function blit(spr, x, y, ang, sc) {
  sc = sc || 1;
  ctx.save();
  ctx.translate(x | 0, y | 0);
  if (ang) ctx.rotate(ang);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -spr.width * sc / 2, -spr.height * sc / 2, spr.width * sc, spr.height * sc);
  ctx.restore();
}
function orb(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

const Sfx = {
  ac: null, master: null, musicGain: null, noise: null, on: true, musicOn: true,
  init() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = .5 * (typeof OPT === 'undefined' ? 1 : OPT.vol);
    this.master.connect(this.ac.destination);
    this.musicGain = this.ac.createGain();
    this.musicGain.gain.value = .5;
    this.musicGain.connect(this.master);
    const n = this.ac.createBuffer(1, this.ac.sampleRate * 1, this.ac.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = RNG.fx() * 2 - 1;
    this.noise = n;
    this.next = this.ac.currentTime;
  },
  tone(f1, f2, dur, type, vol, dest) {
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + .02);
  },
  burst(dur, vol, freq, q) {
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const s = this.ac.createBufferSource(); s.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(200, t + dur);
    f.Q.value = q || 1;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + .02);
  },
  shoot()  { this.tone(760, 190, .07, 'square', .05); },
  hit()    { this.burst(.05, .10, 3200, 2); },
  kill()   { this.burst(.22, .16, 1400, 1); },
  boom()   { this.burst(.5, .3, 900, 1); this.tone(120, 34, .45, 'sawtooth', .16); },
  hurt()   { this.tone(240, 60, .22, 'sawtooth', .13); },
  dash()   { this.tone(180, 900, .13, 'triangle', .07); },
  xp()     { this.tone(980, 1560, .06, 'sine', .04); },
  levelup(){ [523, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, f, .16, 'triangle', .08), i * 70)); },
  wave()   { [392, 523].forEach((f, i) => setTimeout(() => this.tone(f, f, .3, 'square', .06), i * 130)); },
  eshoot() { this.tone(300, 140, .1, 'sawtooth', .035); },
  shotgun(){ this.burst(.16, .18, 2600, 1); this.tone(320, 90, .12, 'square', .06); },
  rail()   { this.tone(1400, 180, .26, 'sawtooth', .09); this.burst(.14, .10, 5200, 4); },
  arc()    { this.tone(1800, 900, .09, 'square', .04); this.burst(.06, .06, 7000, 6); },
  nade()   { this.tone(200, 420, .09, 'triangle', .06); },
  swap()   { this.tone(520, 880, .07, 'square', .05); },
  buff()   { [660, 880, 1320].forEach((f, i) => setTimeout(() => this.tone(f, f, .1, 'triangle', .06), i * 55)); },
  block()  { this.tone(1200, 700, .06, 'square', .05); },
  fuse()   { this.tone(600, 1500, .5, 'sawtooth', .04); },
  swing(n) { this.burst(.09, n ? .14 : .07, n ? 4200 : 2600, 2); this.tone(n ? 900 : 600, 240, .08, 'triangle', .05); },
  // 极简驱动型 bassline
  next: 0, step: 0,
  music(intensity) {
    if (!this.ac || !this.musicOn || !this.on) return;
    const bass = [55, 55, 82.41, 55, 65.41, 55, 98, 82.41];
    const arp  = [440, 523.25, 659.25, 523.25];
    while (this.next < this.ac.currentTime + .25) {
      const s = this.step, t0 = this.next;
      const sched = (fn) => setTimeout(fn, Math.max(0, (t0 - this.ac.currentTime) * 1000));
      if (s % 2 === 0) sched(() => this.tone(bass[(s / 2) % 8], bass[(s / 2) % 8] * .98, .28, 'sawtooth', .055, this.musicGain));
      if (s % 4 === 2) sched(() => this.burst(.05, .05, 6000, 3));
      if (intensity > .5 && s % 8 === 5) sched(() => this.tone(arp[(s / 2 | 0) % 4], arp[(s / 2 | 0) % 4], .12, 'square', .022, this.musicGain));
      this.next += .15; this.step++;
    }
  }
};

/* ================= 触屏 =================
   双摇杆射击在手机上有一套约定俗成的做法，照着来：
     * 左半屏按下 = 移动摇杆，摇杆的圆心就落在你按下的那一点（不是固定在角上，
       那样拇指得去找它）
     * 右半屏按下 = 瞄准摇杆，按着就一直开火
     * 右手没按的时候自动瞄最近的敌人并开火 —— 单手也能玩
   两个摇杆各自记住自己的 pointerId，所以能同时用。 */
// 一开始按指针粗细猜一次（手机进来就是触屏），但监听器【总是】装上：
// 触屏笔记本插着鼠标时 pointer 是 fine，可用户还是会用手指戳屏幕。
// 真的碰到屏幕那一刻再切到触屏模式，比开局猜一次可靠。
let isTouch = matchMedia('(pointer:coarse)').matches;
const TC = { on: isTouch, idL: null, idR: null, mx: 0, my: 0, ml: 0, ax: 0, ay: 0, al: 0 };
if (isTouch) document.body.classList.add('touch');
function goTouch() {
  if (TC.on && isTouch) return;
  isTouch = true; TC.on = true;
  document.body.classList.add('touch');
  if (typeof fit === 'function') fit();
}

(function () {
  const stkL = document.getElementById('stkL'), stkR = document.getElementById('stkR');
  const R = 46, DEAD = 7;                       // 摇杆半径 / 死区（px）
  const org = { L: { x: 0, y: 0 }, R: { x: 0, y: 0 } };

  const show = (side, x, y) => {
    const s = side === 'L' ? stkL : stkR;
    org[side].x = x; org[side].y = y;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.firstElementChild.style.transform = 'translate(-50%,-50%)';
    s.classList.add('on');
  };
  const move = (side, x, y) => {
    const dx = x - org[side].x, dy = y - org[side].y;
    const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
    const s = side === 'L' ? stkL : stkR;
    s.firstElementChild.style.transform = `translate(calc(-50% + ${dx * k}px), calc(-50% + ${dy * k}px))`;
    const nx = d ? dx / d : 0, ny = d ? dy / d : 0, l = d < DEAD ? 0 : Math.min(1, d / R);
    if (side === 'L') { TC.mx = nx; TC.my = ny; TC.ml = l; }
    else { TC.ax = nx; TC.ay = ny; TC.al = l; }
  };
  const drop = side => {
    (side === 'L' ? stkL : stkR).classList.remove('on');
    if (side === 'L') { TC.idL = null; TC.mx = TC.my = TC.ml = 0; }
    else { TC.idR = null; TC.ax = TC.ay = TC.al = 0; }
  };

  // 挂在 document 上：屏幕任何一处都能起摇杆，不限于画布那一条
  const usable = e => G.state === 'play' && !G.paused &&
    !(e.target && e.target.closest && e.target.closest('button, .screen, #levelup'));
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    goTouch();
    if (!usable(e)) return;
    Sfx.init();
    const side = e.clientX < innerWidth * .5 ? 'L' : 'R';
    if (side === 'L' && TC.idL !== null) return;
    if (side === 'R' && TC.idR !== null) return;
    if (side === 'L') TC.idL = e.pointerId; else TC.idR = e.pointerId;
    show(side, e.clientX, e.clientY); move(side, e.clientX, e.clientY);
  }, { passive: true });
  document.addEventListener('pointermove', e => {
    if (e.pointerId === TC.idL) move('L', e.clientX, e.clientY);
    else if (e.pointerId === TC.idR) move('R', e.clientX, e.clientY);
  }, { passive: true });
  for (const ev of ['pointerup', 'pointercancel']) {
    document.addEventListener(ev, e => {
      if (e.pointerId === TC.idL) drop('L');
      else if (e.pointerId === TC.idR) drop('R');
    }, { passive: true });
  }
  // 切到后台或弹出升级卡时，手指状态要清掉，否则回来还在"按着"
  document.addEventListener('visibilitychange', () => { drop('L'); drop('R'); });
  // 两个按钮：冲刺和换枪。挡住冒泡，别顺手把摇杆也点出来。
  const btn = (id, fn) => {
    const b = document.getElementById(id); if (!b) return;
    b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); Sfx.init(); fn(); });
  };
  btn('btnDash', () => { if (P && P.dashCdT === 0) TC.dash = 1; });
  btn('btnWep', () => cycleWep());
  btn('btnPause', () => { if (G.state === 'play') { G.paused = !G.paused; drop('L'); drop('R'); } });
  btn('btnMute', () => {
    Sfx.musicOn = !Sfx.musicOn;
    if (Sfx.musicGain) Sfx.musicGain.gain.value = Sfx.musicOn ? .5 : 0;
    document.getElementById('btnMute').classList.toggle('off', !Sfx.musicOn);
  });
})();
function nearestMob() {
  let best = null, bd = 1e9;
  for (const m of G.mobs) {
    if (m.dead) continue;
    const d = len(m.x - P.x, m.y - P.y);
    if (d < bd) { bd = d; best = m; }
  }
  return best;
}

/* ================= 手柄 =================
   双摇杆射击本来就是手柄游戏，之前零支持。
   左摇杆走、右摇杆瞄且推着就开火、按键冲刺换枪暂停。
   哪套输入最后动过就用哪套 —— 不猜设备，看行为。 */
const PAD = { on: false, ix: 0, iy: 0, ax: 0, ay: 0, al: 0, fire: 0, dash: 0, prev: {} };
const PAD_DEAD = .22;
addEventListener('gamepadconnected', e => {
  PAD.on = true;
  banner('手 柄 已 接 入', (e.gamepad.id || '').slice(0, 28));
});
addEventListener('gamepaddisconnected', () => { PAD.on = false; });
function pollPad() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let g = null;
  for (const p of list) if (p && p.connected) { g = p; break; }
  if (!g) { PAD.al = 0; PAD.ix = PAD.iy = 0; return; }
  const dz = v => Math.abs(v) < PAD_DEAD ? 0 : (v - Math.sign(v) * PAD_DEAD) / (1 - PAD_DEAD);
  const a = g.axes || [];
  PAD.ix = dz(a[0] || 0); PAD.iy = dz(a[1] || 0);
  const rx = dz(a[2] || 0), ry = dz(a[3] || 0);
  PAD.ax = rx; PAD.ay = ry; PAD.al = len(rx, ry);
  const btn = i => !!(g.buttons[i] && g.buttons[i].pressed);
  const tap = i => { const now = btn(i), was = PAD.prev[i]; PAD.prev[i] = now; return now && !was; };
  PAD.fire = btn(7) || btn(5) || btn(0) ? 1 : 0;        // 右扳机 / 右肩 / A 都能开火
  if (tap(1) || tap(10)) PAD.dash = 1;                  // B / 左摇杆键 冲刺
  if (tap(2) || tap(4)) cycleWep();                     // X / 左肩 换枪
  if (tap(9)) { if (G.state === 'play') G.paused = !G.paused; }
  // 有任何输入就认为玩家在用手柄
  if (PAD.ix || PAD.iy || PAD.al > 0 || PAD.fire) PAD.on = true;
}

function rollOffer() {
  // 没解锁的卡不进池 —— 池子随着档案一点点变大，这才是「下一局会不一样」
  const open = MODE === 'daily';                  // 每日局全部词条开放，大家一样
  const pool = UPGRADES.filter(u => (G.stacks[u.id] || 0) < u.max && (!u.req || open || PROF.unlocked[u.req]));
  const out = [];
  while (out.length < 3 && pool.length) {
    const i = (RNG.card() * pool.length) | 0;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function takeUpgrade(u) {
  u.f(P);
  G.stacks[u.id] = (G.stacks[u.id] || 0) + 1;
  document.getElementById('levelup').classList.remove('show');
  G.state = 'play';
  syncHud();
}
function showLevelup() {
  const offer = rollOffer();
  if (!offer.length) {
    // 所有词条都满级之后牌池是空的。原来这里照样把状态切进 levelup 再发 0 张牌，
    // 于是升级界面弹出来、一张牌都没有、点哪都没反应 —— 整局卡死在这。
    // 离线探针打到二十几波撞出来的；手玩很难玩到那个等级，所以一直没人发现。
    P.hp = Math.min(P.maxhp, P.hp + P.maxhp * .25);

  G.state = 'levelup';
